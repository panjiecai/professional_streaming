是显而易见的，所以易凡没有对她透露天赋具体信息。不出所料，她果然分手，在踢人这个事情上，客观来讲是对荣耀有正面价值，所以她投赞成票是顺理成章的，甚至可能为了彻底撇清关系而表现得尤为积极。\n\t慕容清和易凡一样，是真心想把荣耀做到顶峰，达成登峰造极境的理想，在众人以易凡废物天赋、战队未来、整体实力为由提出踢人补强的方案时，她也无法拒绝。\n\t毕竟人族万年来，总结出的5个人的组合战斗形式是绝对“规则”。\n\t君不见，连高高在上的四尊，武祖、圣行者、昊天、明尊，在他们的时代，都至少有4位同伴与之一同征战！\n\t人族所有的战阵、星图、合击秘术都是至少以5人为单位的！这些东西对5个人战斗力的增幅最少都有1倍！这是任何独行侠都难以比拟的巨大优势。\n\t但是...\n\t“我在自我PUA什么啊！！！”\n\t易凡吐了出来一块软骨，他从来不喜欢吃这玩意。\n\t“什么叫战队？什么叫无法拒绝？什么叫登峰造极境的理想？”\n\t“在客观层面上，无论是对荣耀、对柳如烟、对其他成员、对学校、甚至是对全世界来说，把我踢了再补强都是“最好”的选择！”\n\t“所以，我就要默默受着，就要消失，就要沉沦，就要自我责怪，自我cpu自己？”\n\t“我会让你们全世界知道，不搞战队，不靠别人，我自己也能达到顶峰！”\n\t要知道，易凡前世的偶像可是牢大！人呐，还真得独C！\n\t易凡一个人就把脸盆大小的自热火锅吃干净，把盆里的最后一口汤喝干，“嘶，真香~”\n\t“淦，是谁乱切我的录播？”\n\t易凡鬼鬼祟祟摸进10班训练室，脸上戴着能遮住半张脸的巨型墨镜。\n\t就在十分钟前，他刚出宿舍门口就惨遭围观，路过的学生对着他疯狂指指点点，嘴里还笑着说什么“飞剑哥”，甚至有人都差点上来动手动脚了。\n\t他迷茫掏出手机一搜，顿时眼前一黑。 \n\t月桂市高考红人榜，第五名——易凡！\n\t在他上面的都是殷无忌、慕容清这种名人。\n\t别人都是靠能冲击状元的实力上榜，他是被网友瞎剪辑靠整活上榜的，短视频平台上全是他的搞笑集合。\n\t还真别说，这届网友带梗练武，一些标签看着十分乐呵：#飞剑哥#、#求神拜佛大王#、#作死探险家#、#易林兄弟情（CP向）#...\n\t但另一些标签就很有争议了：#荣耀弃子#、#被战队遗漏的黑马#、#孤狼反噬与崛起#。\n\t他感叹，没想到在山顶上遇见的那只石妖竟然是北区的准成年期妖兽，更想不到自己居然能从准成年期妖兽手中逃跑！\n\t由于与荣耀的对立关系，网上很多荣耀的粉丝，似乎在炮轰他，然后一些易凡的自来水乐子人粉丝就与荣耀的粉丝对线，双方你来我往，硬是把他和荣耀战队的相关话题热度炒到了一个新的高度。\n\t除了觉得这些网络骂战有些好笑和无奈之外，易凡暂时并没有太多别的感觉。他毕竟拥有前世的记忆，对网络舆论的喧嚣有着更强的免疫力。\n\t但这恰恰凸显了独行侠的一个弊端——信息渠道单一，缺乏专业的分析和公关支持。如果他身处一个战队中，自然会有专人负责收集信息、分析舆情、甚至进行公关引导。\n\t在收集的信息加持下，或许能从中看出，他和荣耀战队的所谓“对立”，背后很可能有推手在故意炒作、带节奏。从一模直播开始时的某些引导性弹幕，到论坛、社交媒体上那些刻意挑起矛盾的讨论帖，总有一些固定账号在煽风点火，其目的可能是为了流量，也可能是其他更复杂的利益牵扯。\n\t现在，只是单纯觉得有些心酸和无奈，因为他热度很高，但是根本没正经公司赞助他。\n\t在官网上，目前就一些寻常赞助。\n\t比如老百金牌的百枚气血丹，没有啥用，他本身资质就不行，现在像快速提升气血，用轮回绝境杀妖就好了；\n\t359牌赞助了一套武装，里面最有用的就是一把合金重剑；\n\t飞步赞助一套攀岩套，特意标明有特长绳钩，可用于空中钩住点位进行腾挪，这东西，难道要让他真当个探险家飞来飞去吗？\n\t其他珍贵的东西都没有， 不像殷无忌、慕容清等人，据他了解，他们可是有顶级骨粉、超潜石之类的关键赞助，普通资源基本是无限量供应！\n\t易凡的赞助偏运动，他们的赞助偏商务。\n\t不过想想也很合理，这个世界由于武德充沛，商人们还是很“朴实”的，正常赞助都是宣传自家产品的正面效果，像易凡这种靠剪辑、搞笑走红的，不一定有什么正面作用。\n\t而且他在官网上挂的还是3点气血值和F级天赋还是十分醒目的，让绝大多数追求稳健的赞助商望而却步。\n\t训练室中脚步迭起，越来越多学生到了。\n\t“易凡同学，可以合照留影吗？我是您的粉丝！”\n\t“胡颖你真不要脸，明明我才是真正的粉丝！”"},{"title":"第21章 公布成绩","order":21,"label":"21","text":"一声“安静”，终于还是“姗姗来迟”的顾沁结束了这场闹剧。\n\t开始了今天最重要的事情，公布成绩，按排名获得信用点奖励。\n\t顾沁抱起手臂，目光扫过全场。\n\t“全部归位。”\n\t她声音不高，却自带威严。\n\t“现在开始公布本次模考成绩，同时...” \n    “按排名发放信用点！”\n\t“这是联盟和学生给予每个高考备考生的支持，我们要好好感谢...”\n\t“我们10班的第一名，易凡！”\n\t虽然早有预料自己会拿下普通班的第一名，但是易凡当着众人的恭喜下还是有些羞涩，在众人的掌声中，他从顾沁手中接过成绩单。\n\t“易凡的生存分是25，杀妖分是20，探索分是15，总分50。”\n\t“位列年级第88名！全市第404名！”\n\t“获得200信用点。”\n\t顾沁刚说完400信用点，底下的学生惊呼——\n\t“哇！居然是年级88！”\n\t“这么多信用点！”\n\t“飞剑哥牛逼！（破音）”\n\t王虎：“切~”\n\t易凡笑意盎然，不论是排名前一百，还是200信用点，都足够他进雏鹰训练营了！\n\t他看着手上的成绩单，里面十分详细标出了各项分数、分数来源、以及提升分数的建议。\n\t生存分：南区标定分数是25分没什么好说的。\n\t杀妖分：总共2.5只；单杀第一只桂仁鸟5分（首次单杀5分）；他人合作击杀第二只细肢螂算作0.5只击杀，获得1分（多人合作击杀1只妖兽只有2分）；击杀第三只桂仁鸟4分（同类型妖兽分数递减）；与准成年期妖兽单独战斗造成伤害10分。\n\t探索分：跨区发现准成年期妖兽15分（发现10分，跨区5分）。\n\t成绩单上还有提高分数的建议：“人与妖兽势不两立，积极参与击杀妖兽将会使你的分数显著提高！”\n\t易凡苦笑：“这些嫌弃自己杀妖不够积极吗？问题是没有轮回绝境，我也杀不了多少呀...”\n\t他现在5.2气血，通过半步完美的剑法，再加上偷取的速度加持，估计能对标6.5气血的学生。\n\t在南区面对速度型妖兽，投放的数量最稀少，光找它们都要花费很多时间，妖兽又不是傻子，面对身上沾满腥味的武者，它们也会怕，也会跑。\n\t“反正绝对不是因为我觉得没有轮回绝境偷取属性的收益才不去杀妖的。”\n\t1、偶遇荣耀战队等，冲突，慕容清独处\n\t2、收取快递\n\t3、雏鹰训练营报名，严厉教官，武学系、团战系、联防系、荒野系\n\t4、支付信用点，妖兽角斗场、凌霄塔、第二战壕、巨岩岛"},{"title":"附录 · 后续大纲（作者备忘）","order":null,"label":"附录","text":"1、偶遇荣耀战队等，冲突，慕容清独处\n2、收取快递\n3、雏鹰训练营报名，严厉教官，武学系、团战系、联防系、荒野系\n4、支付信用点，妖兽角斗场、凌霄塔、第二战壕、巨岩岛"}]}</script>

<script>
(function(){
"use strict";

/* ========== 数据 ========== */
const BUILTIN = JSON.parse(document.getElementById("book-data").textContent);
const SKEY = {
  settings:"reader.settings.v1",
  pos:function(id){return "reader.pos.v1."+id;},
  imported:"reader.imported.v1"
};
const FS_BASE = {paper:"serif",sepia:"serif",dark:"serif"};

const $ = sel => document.querySelector(sel);
const $$ = sel => Array.from(document.querySelectorAll(sel));

const article = $("#article");
const readerEl = $("#reader");
const tocEl = $("#toc");
const quickJump = $("#quickJump");
const searchEl = $("#search");
const sortMode = $("#sortMode");

let book = null;      // {id,title,sub,source,chapters:[{id,title,label,order,seq,text}]}
let cur = 0;          // 当前章索引（排序后数组）
let settings = null;
let pos = {i:0, ratio:0};
let saveTimer = 0;
let suppressScrollSave = false;

/* ========== 数字解析与排序 ========== */
const CN_DIGIT = {零:0,"〇":0,一:1,二:2,两:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9};
function cnToNum(s){
  let section = 0, num = 0;
  for (const ch of s){
    if (CN_DIGIT[ch] !== undefined) num = CN_DIGIT[ch];
    else if (ch === "十"){ section += (num || 1) * 10; num = 0; }
    else if (ch === "百"){ section += (num || 1) * 100; num = 0; }
    else if (ch === "千"){ section += (num || 1) * 1000; num = 0; }
  }
  return section + num;
}
function parseOrder(title, seq){
  const t = title.replace(/\s+/g, "");
  const m = t.match(/第([0-9]+(?:\-[0-9]+)?|[零〇一二两三四五六七八九十百千]+)(?:章|节|回|话|篇|卷)?/);
  if (!m) {
    const m2 = t.match(/([0-9]+(?:\-[0-9]+)?)(?:章|节|回|话)/);
    if (!m2) return null;
    const raw2 = m2[1];
    return raw2.indexOf("-") >= 0
      ? (n => n)(raw2)
      : parseInt(raw2, 10);
  }
  const raw = m[1];
  if (/^[0-9]/.test(raw)){
    if (raw.indexOf("-") >= 0){
      const p = raw.split("-");
      return parseInt(p[0], 10) + parseInt(p[1] || "0", 10) / 1000;
    }
    return parseInt(raw, 10);
  }
  return cnToNum(raw);
}
function orderKey(o){ return o == null ? Number.MAX_SAFE_INTEGER : o; }
function naturalCompare(a, b){
  const ka = orderKey(a.order), kb = orderKey(b.order);
  if (ka !== kb) return ka - kb;
  return String(a.title).localeCompare(String(b.title), "zh-Hans-CN", {numeric:true, sensitivity:"base"});
}

/* ========== 设置 ========== */
const DEFAULT_SETTINGS = {theme:"paper", fs:18, lh:1.95, measure:42, font:"serif", indent:true};
function loadSettings(){
  try{
    const s = JSON.parse(localStorage.getItem(SKEY.settings) || "null");
    settings = Object.assign({}, DEFAULT_SETTINGS, s || {});
  }catch(e){ settings = Object.assign({}, DEFAULT_SETTINGS); }
  if(!FS_BASE[settings.theme]) settings.theme = "paper";
}
function applySettings(){
  document.documentElement.setAttribute("data-theme", settings.theme);
  const root = document.documentElement.style;
  root.setProperty("--fs", settings.fs + "px");
  root.setProperty("--lh", String(settings.lh));
  root.setProperty("--measure", settings.measure + "em");
  const fonts = {
    serif:'"Noto Serif SC","Source Han Serif SC","Songti SC",SimSun,serif',
    sans:'"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif',
    kai:'"Kaiti SC","STKaiti",KaiTi,"Noto Serif SC",serif'
  };
  document.body.style.fontFamily = fonts[settings.font] || fonts.serif;
  article.classList.toggle("indent", !!settings.indent);

  $("#fsRange").value = settings.fs;
  $("#lhRange").value = settings.lh;
  $("#fsVal").textContent = settings.fs + " px";
  $("#lhVal").textContent = Number(settings.lh).toFixed(2);
  $$(".theme-btn").forEach(b => b.classList.toggle("active", b.dataset.theme === settings.theme));
  $$("#widthSeg button").forEach(b => b.classList.toggle("active", Number(b.dataset.measure) === Number(settings.measure)));
  $$("#fontSeg button").forEach(b => b.classList.toggle("active", b.dataset.font === settings.font));
  $("#indentToggle").checked = !!settings.indent;
  try{ localStorage.setItem(SKEY.settings, JSON.stringify(settings)); }catch(e){}
}

/* ========== 书与目录 ========== */
function normalizeBook(raw, source){
  const chs = (raw.chapters || []).map((c, i) => {
    const text = String(c.text || "");
    const title = String(c.title || ("第" + (i + 1) + "章")).trim();
    return {
      title,
      text,
      seq: i,
      order: c.order == null ? parseOrder(title, i) : c.order,
      label: c.label || makeLabel(parseOrder(title, i), i + 1)
    };
  });
  return {
    id: raw.id || "builtin",
    title: raw.title || "未命名",
    sub: raw.sub || "",
    source: source || "builtin",
    chapters: chs
  };
}
function makeLabel(order, fallback){
  if (order == null) return String(fallback);
  if (order >= Number.MAX_SAFE_INTEGER) return "附";
  const n = Math.floor(order);
  const frac = order - n;
  const base = n < 10 ? "0" + n : String(n);
  return frac ? base + "-" + Math.round(frac * 1000) : base;
}
function sortedChapters(){
  const arr = book.chapters.slice();
  if (sortMode.value === "natural") arr.sort(naturalCompare);
  else arr.sort((a, b) => a.seq - b.seq);
  return arr;
}
function buildTOC(){
  const list = sortedChapters();
  tocEl.innerHTML = "";
  const frag = document.createDocumentFragment();
  const last = pos || {};
  list.forEach((ch, i) => {
    const b = document.createElement("button");
    b.className = "toc-item" + (i === cur ? " active" : "");
    b.dataset.index = String(i);
    b.title = ch.title;

    const num = document.createElement("span");
    num.className = "toc-num";
    num.textContent = ch.label;

    const name = document.createElement("span");
    name.className = "toc-name";
    name.textContent = cleanChapterTitle(ch.title, ch.label);

    b.appendChild(num);
    b.appendChild(name);
    if (last && last.i === i) {
      const mark = document.createElement("span");
      mark.className = "toc-last";
      mark.textContent = "●";
      mark.title = "上次读到这里";
      b.appendChild(mark);
    }
    frag.appendChild(b);
  });
  tocEl.appendChild(frag);
  tocEl.scrollTop = Math.max(0, (cur - 2) * 40);

  quickJump.innerHTML = "";
  list.forEach((ch, i) => {
    const o = document.createElement("option");
    o.value = String(i);
    o.textContent = ch.label + " · " + cleanChapterTitle(ch.title, ch.label);
    quickJump.appendChild(o);
  });
  quickJump.value = String(cur);
  searchEl.value = "";
  $("#footInfo").textContent = "共 " + list.length + " 章 · 数字排序";
  filterTOC("");
}
function filterTOC(q){
  q = q.trim().toLowerCase();
  const list = sortedChapters();
  $$("#toc .toc-item").forEach((el, i) => {
    const ch = list[i];
    if (!ch) return;
    const hit = !q || ch.title.toLowerCase().indexOf(q) >= 0 || String(ch.label).toLowerCase() === q;
    el.classList.toggle("hidden", !hit);
  });
}
function cleanChapterTitle(title, label){
  let t = title.replace(/^#+\s*/, "").replace(/\s+/g, " ").trim();
  t = t.replace(/^第\s*[0-9零〇一二两三四五六七八九十百千]+\s*(章|节|回|话)\s*[：:·、.．\-—]?\s*/, "");
  t = t.replace(/^第\s*[0-9]+\s*[：:·、.．\-—]\s*/, "");
  return t || title;
}

/* ========== 渲染 ========== */
function escHtml(s){
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function inlineMd(s){
  let t = escHtml(s);
  t = t.replace(/`([^`]+)`/g, "<code>$1</code>");
  t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  t = t.replace(/(^|[^\*])\*([^*\n]+)\*(?!\*)/g, "$1<em>$2</em>");
  return t;
}
function isRule(line){ return /^([-*_]\s*){3,}$/.test(line) || /^──+$/.test(line); }
function renderChapter(){
  const list = sortedChapters();
  const ch = list[cur];
  if (!ch) return;
  const frag = document.createDocumentFragment();

  const h = document.createElement("h1");
  h.className = "ch-title";
  h.textContent = cleanChapterTitle(ch.title, ch.label) || ch.title;
  frag.appendChild(h);

  const meta = document.createElement("div");
  meta.className = "ch-meta";
  meta.textContent = "第 " + (cur + 1) + " / " + list.length + " 章 · 约 " + countWords(ch.text) + " 字";
  frag.appendChild(meta);

  const lines = String(ch.text || "").replace(/\r\n?/g, "\n").split("\n");
  for (let line of lines){
    line = line.replace(/\u3000/g, " ").replace(/\t/g, "").trim();
    if (!line) continue;
    if (/^#{1,6}\s*/.test(line)) {
      if (line.replace(/^#+\s*/, "").trim() === ch.title.trim()) continue;
      if (/^#{1,6}\s*第/.test(line)) continue;
    }
    if (isRule(line)) continue;

    if (line.charAt(0) === ">"){
      const bq = document.createElement("blockquote");
      bq.innerHTML = inlineMd(line.replace(/^>\s*/, ""));
      frag.appendChild(bq);
      continue;
    }
    const p = document.createElement("p");
    if (line.charAt(0) === "【"){
      p.className = "barrage";
    }
    p.innerHTML = inlineMd(line);
    frag.appendChild(p);
  }
  article.innerHTML = "";
  article.appendChild(frag);

  const endNav = document.createElement("div");
  endNav.className = "end-nav";
  const prev = document.createElement("button");
  prev.className = "nav-btn";
  prev.textContent = cur > 0 ? "← " + cleanChapterTitle(list[cur - 1].title, list[cur - 1].label) : "已是第一章";
  prev.disabled = cur === 0;
  prev.onclick = () => goTo(cur - 1);
  const next = document.createElement("button");
  next.className = "nav-btn";
  next.textContent = cur < list.length - 1 ? cleanChapterTitle(list[cur + 1].title, list[cur + 1].label) + " →" : "已是最后一章";
  next.disabled = cur >= list.length - 1;
  next.onclick = () => goTo(cur + 1);
  endNav.appendChild(prev);
  endNav.appendChild(next);
  article.appendChild(endNav);

  $("#curNum").textContent = ch.label;
  $("#curTitle").textContent = cleanChapterTitle(ch.title, ch.label);
  $("#btnPrev").disabled = cur === 0;
  $("#btnNext").disabled = cur >= list.length - 1;
  quickJump.value = String(cur);
  $$("#toc .toc-item").forEach((el, i) => {
    el.classList.toggle("active", i === cur);
    const mark = el.querySelector(".toc-last");
    if (mark) mark.remove();
  });
  const active = tocEl.querySelector('.toc-item[data-index="' + cur + '"]');
  if (active){
    active.classList.remove("hidden");
    active.scrollIntoView({block:"nearest"});
  }
}
function countWords(t){
  return String(t || "").replace(/\s+/g, "").length;
}

/* ========== 跳转 / 进度 / 记忆 ========== */
function currentRatio(){
  const max = Math.max(1, readerEl.scrollHeight - readerEl.clientHeight);
  return Math.min(1, Math.max(0, readerEl.scrollTop / max));
}
function goTo(index, restoreRatio){
  const list = sortedChapters();
  if (index < 0 || index >= list.length) return;
  cur = index;
  pos.i = index;
  pos.ratio = restoreRatio == null ? 0 : restoreRatio;
  renderChapter();
  suppressScrollSave = true;
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      const max = Math.max(0, readerEl.scrollHeight - readerEl.clientHeight);
      readerEl.scrollTop = pos.ratio * max;
      updateProgress();
      suppressScrollSave = false;
      savePos(true);
    });
  });
}
function updateProgress(){
  const list = sortedChapters();
  const ratio = currentRatio();
  const overall = ((cur + ratio) / Math.max(1, list.length)) * 100;
  $("#progressBar").style.width = overall.toFixed(2) + "%";
}
function savePos(immediate){
  const id = book.id;
  const ratio = currentRatio();
  const payload = {i:cur, ratio:ratio, t:Date.now()};
  pos = payload;
  const write = () => {
    try{ localStorage.setItem(SKEY.pos(id), JSON.stringify(payload)); }catch(e){}
  };
  if (immediate){ clearTimeout(saveTimer); write(); }
  else { clearTimeout(saveTimer); saveTimer = setTimeout(write, 350); }
}
function restorePos(){
  let raw = null;
  try{ raw = JSON.parse(localStorage.getItem(SKEY.pos(book.id)) || "null"); }catch(e){}
  if (!raw || typeof raw.i !== "number"){ pos = {i:0, ratio:0}; return false; }
  pos = {i: raw.i, ratio: raw.ratio || 0};
  return true;
}

/* ========== 载入书籍 ========== */
function loadBook(b, opts){
  book = b;
  $("#bookTitle").textContent = book.title;
  $("#bookSub").textContent = book.sub || (book.source === "builtin" ? "内置全文" : "已导入");
  sortMode.value = "natural";
  const restored = restorePos();
  const target = Math.min(pos.i, Math.max(0, book.chapters.length - 1));
  buildTOC();
  goTo(target, pos.ratio || 0);
  if (restored){
    toast("已回到上次位置：第 " + (target + 1) + " 章 · " + Math.round((pos.ratio || 0) * 100) + "%");
  }
}

/* ========== 导入 ========== */
function readFile(f){
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve({name:f.name, text:String(fr.result || "")});
    fr.onerror = () => reject(fr.error);
    fr.readAsText(f, "utf-8");
  });
}
const HEAD_RE = /^(?:#{1,4}\s*)?(第\s*(?:[0-9]+(?:\s*-\s*[0-9]+)?|[零〇一二两三四五六七八九十百千N]+)\s*(?:章|节|回|话|篇)\s*[^\n]*|卷\s*[0-9零〇一二两三四五六七八九十百千]+\s*[^\n]*|序章|楔子|引子|尾声|后记|番外[^\n]*)$/;
function splitChapters(files){
  const chapters = [];
  let seq = 0;
  for (const f of files){
    const raw = f.text.replace(/\r\n?/g, "\n");
    const lines = raw.split("\n");
    const base = f.name.replace(/\.(md|markdown|txt)$/i, "");

    // 找出所有标题行
    const heads = [];
    lines.forEach((line, i) => {
      const t = line.trim();
      if (!t) return;
      if (/^#{1,4}\s+\S/.test(t)){ heads.push({i, title:t.replace(/^#+\s*/, "")}); return; }
      if (HEAD_RE.test(t) && t.length <= 40) heads.push({i, title:t});
    });

    if (heads.length === 0){
      chapters.push({title: base, text: raw.trim(), seq: seq++, order: parseOrder(base, seq)});
      continue;
    }
    // 首个标题前的内容并入第一章
    const preamble = lines.slice(0, heads[0].i).join("\n").trim();
    heads.forEach((h, k) => {
      const end = k + 1 < heads.length ? heads[k + 1].i : lines.length;
      let body = lines.slice(h.i + 1, end).join("\n").trim();
      if (k === 0 && preamble) body = preamble + "\n\n" + body;
      chapters.push({title: h.title.trim(), text: body, seq: seq++, order: parseOrder(h.title, seq)});
    });
  }
  return chapters;
}
async function importFiles(fileList){
  const files = Array.from(fileList || []).filter(f => /\.(md|markdown|txt)$/i.test(f.name));
  if (!files.length){ toast("没有找到 .md / .txt 文件"); return; }
  try{
    const data = await Promise.all(files.map(readFile));
    const chapters = splitChapters(data);
    if (!chapters.length){ toast("没有解析到章节"); return; }
    const firstTitle = data.length === 1 ? data[0].name.replace(/\.\w+$/, "") : "导入的小说";
    const nb = normalizeBook({
      id: "imp:" + firstTitle + ":" + chapters.length,
      title: firstTitle,
      sub: "导入 · " + files.length + " 个文件",
      chapters
    }, "import");
    loadBook(nb, {});
    try{
      const raw = JSON.stringify(nb);
      if (raw.length < 2500000){
        localStorage.setItem(SKEY.imported, raw);
        toast("已导入 " + chapters.length + " 章，并记住到本地");
      } else {
        localStorage.removeItem(SKEY.imported);
        toast("已导入 " + chapters.length + " 章（内容较大，仅本次有效）");
      }
    }catch(e){ toast("已导入 " + chapters.length + " 章（本地空间不足，仅本次有效）"); }
  }catch(err){
    toast("读取失败：" + (err && err.message ? err.message : err));
  }
}

/* ========== UI 交互 ========== */
function toast(msg){
  const el = $("#toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove("show"), 2600);
}
function openSide(open){
  $("#sidebar").classList.toggle("show", open);
}
function openSettings(open){
  $("#settingsPanel").classList.toggle("show", open);
  $("#mask").classList.toggle("show", open);
}

tocEl.addEventListener("click", e => {
  const btn = e.target.closest(".toc-item");
  if (!btn) return;
  goTo(Number(btn.dataset.index));
  openSide(false);
});
searchEl.addEventListener("input", () => filterTOC(searchEl.value));
sortMode.addEventListener("change", () => {
  const curTitle = sortedChapters()[cur] && sortedChapters()[cur].title;
  buildTOC();
  const list = sortedChapters();
  const idx = list.findIndex(ch => ch.title === curTitle);
  goTo(idx >= 0 ? idx : 0);
});
quickJump.addEventListener("change", () => goTo(Number(quickJump.value)));
$("#btnPrev").onclick = () => goTo(cur - 1);
$("#btnNext").onclick = () => goTo(cur + 1);
$("#btnSide").onclick = () => openSide(!$("#sidebar").classList.contains("show"));
$("#btnSettings").onclick = () => openSettings(true);
$("#btnCloseSettings").onclick = () => openSettings(false);
$("#mask").onclick = () => { openSettings(false); openSide(false); };

$$(".theme-btn").forEach(b => b.onclick = () => { settings.theme = b.dataset.theme; applySettings(); });
$("#fsRange").oninput = e => { settings.fs = Number(e.target.value); applySettings(); };
$("#lhRange").oninput = e => { settings.lh = Number(e.target.value); applySettings(); };
$$("#widthSeg button").forEach(b => b.onclick = () => { settings.measure = Number(b.dataset.measure); applySettings(); });
$$("#fontSeg button").forEach(b => b.onclick = () => { settings.font = b.dataset.font; applySettings(); });
$("#indentToggle").onchange = e => { settings.indent = e.target.checked; applySettings(); };

$("#btnSavePos").onclick = () => { savePos(true); toast("已记住：第 " + (cur + 1) + " 章"); };
$("#btnClearPos").onclick = () => {
  try{ localStorage.removeItem(SKEY.pos(book.id)); }catch(e){}
  pos = {i:cur, ratio:0};
  toast("已清除本书阅读记录");
};

$("#btnImport").onclick = () => $("#fileInput").click();
$("#fileInput").onchange = e => { importFiles(e.target.files); e.target.value = ""; };
$("#dirInput").onchange = e => { importFiles(e.target.files); e.target.value = ""; };
$("#btnBuiltin").onclick = () => {
  const nb = normalizeBook(BUILTIN, "builtin");
  nb.id = BUILTIN.id || "builtin";
  bookmarkBuiltin(nb);
  loadBook(nb, {});
};

function bookmarkBuiltin(nb){ /* 内置书始终可用，无需存储 */ }

/* 滚动：进度 + 记忆 */
let rafId = 0;
readerEl.addEventListener("scroll", () => {
  if (rafId) return;
  rafId = requestAnimationFrame(() => {
    rafId = 0;
    updateProgress();
    if (!suppressScrollSave) savePos(false);
  });
}, {passive:true});

/* 快捷键 */
document.addEventListener("keydown", e => {
  const tag = (e.target && e.target.tagName) || "";
  if (/INPUT|SELECT|TEXTAREA/.test(tag)) return;
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  switch (e.key){
    case "ArrowLeft": goTo(cur - 1); break;
    case "ArrowRight": goTo(cur + 1); break;
    case "Home": readerEl.scrollTop = 0; break;
    case "End": readerEl.scrollTop = readerEl.scrollHeight; break;
    case "/": e.preventDefault(); searchEl.focus(); break;
    case "Escape": openSettings(false); openSide(false); break;
  }
});

window.addEventListener("pagehide", () => savePos(true));
window.addEventListener("beforeunload", () => savePos(true));

/* ========== 启动 ========== */
loadSettings();
applySettings();
(function init(){
  const nb = normalizeBook(BUILTIN, "builtin");
  let saved = null;
  try{ saved = JSON.parse(localStorage.getItem(SKEY.imported) || "null"); }catch(e){}
  // 内置书优先；若上次导入过且用户想继续，可在侧栏“内置书”切回
  const start = saved && saved.chapters && saved.chapters.length ? saved : nb;
  loadBook(start, {});
  updateProgress();
  openSide(false);
  setTimeout(updateProgress, 120);
})();

})();
</script>
</body>
