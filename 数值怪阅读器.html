<!DOCTYPE html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>《数值怪》阅读器</title>
<style>
:root{
  --bg:#fbfaf7; --panel:#f2f0e9; --panel2:#e9e6dc; --text:#2c2a26; --muted:#8b8577;
  --line:#ddd8cb; --accent:#8a6a35; --accent-soft:#efe6d0; --shadow:0 8px 24px rgba(40,35,20,.10);
  --barrage:#6f6a5f; --barrage-bg:#f4f1e7;
  --side-w:288px;
}
html[data-theme="sepia"]{
  --bg:#f7ecd8; --panel:#f0e2c8; --panel2:#e8d8ba; --text:#3b2f21; --muted:#8d7a5d;
  --line:#ddcaa8; --accent:#8a5c2a; --accent-soft:#ecdcc0; --shadow:0 8px 24px rgba(80,55,20,.14);
  --barrage:#7a6a52; --barrage-bg:#efdfc6;
}
html[data-theme="dark"]{
  --bg:#15171b; --panel:#1c1f25; --panel2:#252931; --text:#cdd2da; --muted:#7f8794;
  --line:#2d323b; --accent:#c9a86a; --accent-soft:#2b2a24; --shadow:0 8px 24px rgba(0,0,0,.45);
  --barrage:#8f9aab; --barrage-bg:#1f232b;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:"Noto Serif SC","Source Han Serif SC","Songti SC",SimSun,serif;
  -webkit-font-smoothing:antialiased;
  transition:background .25s ease,color .25s ease;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
#app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);height:100%}

/* ---------- 侧栏 ---------- */
#sidebar{
  background:var(--panel); border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;
}
.side-head{padding:18px 18px 10px;display:flex;align-items:flex-start;gap:10px}
.book-meta{min-width:0;flex:1}
.book-title{font-size:17px;font-weight:700;line-height:1.35;margin:0 0 4px;letter-spacing:.02em}
.book-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ghost{
  border:1px solid var(--line);background:transparent;border-radius:8px;
  padding:6px 9px;font-size:12px;color:var(--muted);white-space:nowrap;
}
.ghost:hover{color:var(--accent);border-color:var(--accent)}
.side-tools{display:flex;gap:8px;padding:0 18px 10px}
.side-tools input{
  flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);
  border-radius:8px;padding:8px 10px;font-size:13px;outline:none;
}
.side-tools input:focus{border-color:var(--accent)}
.side-tools select{
  border:1px solid var(--line);background:var(--bg);border-radius:8px;
  padding:8px 6px;font-size:12px;outline:none;
}
#toc{flex:1;overflow-y:auto;padding:4px 10px 16px;min-height:0;scrollbar-width:thin}
.toc-item{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:transparent;border:0;border-radius:10px;padding:9px 10px;margin:1px 0;
  color:var(--text);font-size:13.5px;line-height:1.35;
}
.toc-item:hover{background:var(--panel2)}
.toc-item.active{background:var(--accent-soft)}
.toc-item.active .toc-name{font-weight:700}
.toc-num{
  flex:none;min-width:26px;height:22px;padding:0 4px;border-radius:6px;
  background:var(--panel2);color:var(--muted);font-size:11px;font-family:ui-monospace,Menlo,monospace;
  display:flex;align-items:center;justify-content:center;
}
.toc-item.active .toc-num{background:var(--accent);color:var(--bg)}
.toc-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toc-last{flex:none;font-size:10px;color:var(--accent);opacity:.9}
.side-foot{
  border-top:1px solid var(--line);padding:10px 18px;font-size:11.5px;color:var(--muted);
  display:flex;justify-content:space-between;gap:8px;
}
.side-foot button{background:none;border:0;color:var(--muted);padding:0;font-size:11.5px}
.side-foot button:hover{color:var(--accent)}

/* ---------- 主区 ---------- */
#mainWrap{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
#topbar{
  position:relative;flex:none;display:flex;align-items:center;gap:12px;
  padding:10px 18px;background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);z-index:5;
}
.icon{
  border:1px solid var(--line);background:transparent;border-radius:8px;
  width:34px;height:32px;display:none;place-items:center;font-size:15px;
}
.crumb{min-width:0;display:flex;align-items:baseline;gap:8px;flex:1}
#curNum{font-size:12px;color:var(--muted);font-family:ui-monospace,Menlo,monospace}
#curTitle{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-tools{display:flex;align-items:center;gap:8px}
#quickJump{
  max-width:190px;border:1px solid var(--line);background:var(--panel);
  border-radius:8px;padding:6px 8px;font-size:12px;outline:none;
}
.nav-btn{
  border:1px solid var(--line);background:transparent;border-radius:8px;
  padding:6px 11px;font-size:12.5px;color:var(--muted);
}
.nav-btn:hover:not(:disabled){color:var(--accent);border-color:var(--accent)}
.nav-btn:disabled{opacity:.35;cursor:default}
#progressTrack{position:absolute;left:0;right:0;bottom:-1px;height:2px;background:transparent}
#progressBar{height:100%;width:0;background:var(--accent);transition:width .12s linear}
#reader{
  flex:1;overflow-y:auto;padding:44px 32px 80px;scroll-behavior:smooth;
  outline:none;
}
.article{
  max-width:var(--measure,42em);margin:0 auto;
  font-size:var(--fs,18px);line-height:var(--lh,1.95);
  text-align:justify;text-justify:inter-ideograph;
}
.article.indent p:not(.barrage):not(.note){text-indent:2em}
.ch-title{
  font-size:calc(var(--fs,18px) * 1.35);line-height:1.4;font-weight:700;
  margin:0 0 .35em;letter-spacing:.02em;
}
.ch-meta{font-size:12px;color:var(--muted);margin:0 0 2.2em;letter-spacing:.04em}
.article p{margin:0 0 .82em;word-break:break-word}
.article p.barrage{
  color:var(--barrage);background:var(--barrage-bg);
  border-left:3px solid color-mix(in srgb,var(--accent) 35%,transparent);
  padding:7px 12px;margin:1.1em 0;font-size:.9em;line-height:1.7;
  border-radius:0 8px 8px 0;text-indent:0;
}
.article blockquote{
  margin:1.2em 0;padding:.6em 1em;border-left:3px solid var(--accent);
  background:var(--panel);color:var(--muted);border-radius:0 8px 8px 0;
  font-size:.94em;text-indent:0;
}
.article strong{font-weight:700}
.article code{font-family:ui-monospace,Menlo,monospace;background:var(--panel2);padding:.1em .35em;border-radius:4px;font-size:.9em}
.end-nav{max-width:var(--measure,42em);margin:52px auto 0;display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:22px}
.end-nav button{max-width:48%}

/* ---------- 设置面板 ---------- */
#mask{
  position:fixed;inset:0;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;
  transition:opacity .2s ease;z-index:20;
}
#mask.show{opacity:1;pointer-events:auto}
#settingsPanel{
  position:fixed;top:0;right:0;height:100%;width:320px;max-width:90vw;
  background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--shadow);
  transform:translateX(102%);transition:transform .24s ease;z-index:21;
  display:flex;flex-direction:column;
}
#settingsPanel.show{transform:none}
.sp-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.sp-head h2{margin:0;font-size:15px}
.sp-body{padding:8px 18px 24px;overflow-y:auto}
.sp-group{padding:14px 0;border-bottom:1px dashed var(--line)}
.sp-group:last-child{border-bottom:0}
.sp-label{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-bottom:9px}
.sp-label span:last-child{color:var(--muted);font-size:12px;font-family:ui-monospace,Menlo,monospace}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.theme-btn{
  border:1px solid var(--line);border-radius:10px;padding:12px 6px;font-size:12.5px;
  background:transparent;
}
.theme-btn.active{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
input[type="range"]{width:100%;accent-color:var(--accent)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{
  border:1px solid var(--line);background:transparent;border-radius:8px;padding:8px 4px;font-size:12.5px;
}
.seg button.active{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.switch-row{display:flex;justify-content:space-between;align-items:center;font-size:13px}
.switch{position:relative;width:42px;height:24px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch i{
  position:absolute;inset:0;background:var(--panel2);border-radius:99px;
  transition:.2s;border:1px solid var(--line);
}
.switch i::after{
  content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;
  background:var(--muted);transition:.2s;
}
.switch input:checked + i{background:var(--accent-soft);border-color:var(--accent)}
.switch input:checked + i::after{left:21px;background:var(--accent)}

/* ---------- 提示 ---------- */
#toast{
  position:fixed;left:50%;bottom:30px;transform:translate(-50%,16px);
  background:var(--panel2);border:1px solid var(--line);box-shadow:var(--shadow);
  color:var(--text);padding:10px 16px;border-radius:10px;font-size:12.5px;
  opacity:0;pointer-events:none;transition:.25s ease;z-index:40;max-width:80vw;
}
#toast.show{opacity:1;transform:translate(-50%,0)}
.hidden{display:none!important}

/* ---------- 窄屏 ---------- */
@media (max-width:860px){
  #app{grid-template-columns:minmax(0,1fr)}
  #sidebar{
    position:fixed;top:0;bottom:0;left:0;width:var(--side-w);max-width:86vw;z-index:25;
    transform:translateX(-102%);transition:transform .24s ease;box-shadow:var(--shadow);
  }
  #sidebar.show{transform:none}
  .icon{display:grid}
  #reader{padding:28px 18px 64px}
  .top-tools #quickJump{display:none}
  .ch-title{font-size:calc(var(--fs,18px) * 1.2)}
  .side-head .ghost{display:none}
}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="side-head">
      <div class="book-meta">
        <div class="book-title" id="bookTitle">开局轮回绝境，我成了终极数值怪</div>
        <div class="book-sub" id="bookSub">《数值怪》· 内置全文</div>
      </div>
      <button class="ghost" id="btnImport">导入</button>
    </div>
    <div class="side-tools">
      <input id="search" placeholder="搜索章节…" autocomplete="off">
      <select id="sortMode" title="目录排序方式">
        <option value="natural">数字排序</option>
        <option value="source">原顺序</option>
      </select>
    </div>
    <nav id="toc" aria-label="目录"></nav>
    <div class="side-foot">
      <span id="footInfo">共 0 章</span>
      <button id="btnBuiltin" title="回到内置小说">内置书</button>
    </div>
  </aside>

  <main id="mainWrap">
    <header id="topbar">
      <button class="icon" id="btnSide" aria-label="打开目录">☰</button>
      <div class="crumb">
        <span id="curNum">01</span>
        <strong id="curTitle">星灵祝福：窃法巧手</strong>
      </div>
      <div class="top-tools">
        <select id="quickJump" aria-label="快速跳章"></select>
        <button class="nav-btn" id="btnPrev">上一章</button>
        <button class="nav-btn" id="btnNext">下一章</button>
        <button class="icon" id="btnSettings" aria-label="阅读设置" style="display:grid">⚙</button>
      </div>
      <div id="progressTrack"><div id="progressBar"></div></div>
    </header>
    <div id="reader" tabindex="-1">
      <article class="article" id="article"></article>
    </div>
  </main>
</div>

<div id="mask"></div>
<div id="settingsPanel" role="dialog" aria-label="阅读设置">
  <div class="sp-head">
    <h2>阅读设置</h2>
    <button class="ghost" id="btnCloseSettings">关闭</button>
  </div>
  <div class="sp-body">
    <div class="sp-group">
      <div class="sp-label"><span>主题</span></div>
      <div class="themes">
        <button class="theme-btn" data-theme="paper">纸白</button>
        <button class="theme-btn" data-theme="sepia">暖黄</button>
        <button class="theme-btn" data-theme="dark">夜间</button>
      </div>
    </div>
    <div class="sp-group">
      <div class="sp-label"><span>字号</span><span id="fsVal">18 px</span></div>
      <input type="range" id="fsRange" min="14" max="26" step="1" value="18">
    </div>
    <div class="sp-group">
      <div class="sp-label"><span>行距</span><span id="lhVal">1.95</span></div>
      <input type="range" id="lhRange" min="1.5" max="2.6" step="0.05" value="1.95">
    </div>
    <div class="sp-group">
      <div class="sp-label"><span>版心宽度</span></div>
      <div class="seg" id="widthSeg">
        <button data-measure="34">窄</button>
        <button data-measure="42">适中</button>
        <button data-measure="56">宽</button>
      </div>
    </div>
    <div class="sp-group">
      <div class="sp-label"><span>字体</span></div>
      <div class="seg" id="fontSeg">
        <button data-font="serif">宋体</button>
        <button data-font="sans">黑体</button>
        <button data-font="kai">楷体</button>
      </div>
    </div>
    <div class="sp-group">
      <div class="switch-row">
        <span>段落首行缩进</span>
        <label class="switch"><input type="checkbox" id="indentToggle" checked><i></i></label>
      </div>
    </div>
    <div class="sp-group">
      <div class="sp-label"><span>阅读位置</span></div>
      <div class="seg">
        <button id="btnSavePos">记住当前</button>
        <button id="btnClearPos">清除记录</button>
      </div>
    </div>
  </div>
</div>

<input type="file" id="fileInput" class="hidden" multiple accept=".md,.txt,.markdown">

<script id="book-data" type="application/json">{"id":"shuzhiguai","title":"开局轮回绝境，我成了终极数值怪","sub":"《数值怪》· 新版本 21 章 + 大纲","chapters":[{"title":"第01章 星灵祝福：窃法巧手","order":1,"label":"01","text":"《开局轮回绝境，我成了终极数值怪》\n第一章 星灵祝福：窃法巧手\n\t烈日骄阳炙烤，少年行尸走肉。\n\t班主任顾沁：“易凡同学，由于你觉醒的是F级天赋，根据《月桂市第三中心实验班管理条例》将你从实验班转到普通班，来我办公室签名。”\n\t队长慕容清：“易凡，虽然你剑术超群，即使只是身负3气血值也能比肩5气血值的学生，但是天赋太差，在高考冲刺一个月时间里，会迅速被尖子生拉开差距，还记得我们建立荣耀战队的初心吗？登峰造极境！我决定把你的位置换成有A级天赋的叶知秋，要怪就怪你自己跟不上我们的步伐吧！”\n\t父亲易建连：“小凡，看了你的天赋，爸决定把非凡道馆传给你大师姐了。你也18岁成年，我们易家素来倡导刻苦精神，今后你就搬到学校宿舍吧，老爸每个月给你3000生活费，直到你找到工作能养活自己。爸当年一穷二白创立道馆赚了上亿，相信你能青出于蓝。”\n\t铮亮的第三中学牌匾前，易凡看着手机绿泡泡蹦出的消息，虽然还没有反应过来发生了什么，但消息内容已然让他血压直接拉满。\n\t他不是还在出租屋中试玩大热的黑猴吗？怎么突然就到大街上了，而且看这20米宽敞人行道，以及旁边十车道的马路，空中没有蝉鸣鸟叫，入目之处无一植物，不真实感扑面而来。\n\t随后，汹涌的记忆轰然流入脑海。\n\t在一阵头晕目眩后，易凡明白了一切。\n\t他穿越了！但是今年十八岁才苏醒记忆。\n\t这个世界光怪陆离，武者、科技、异族、妖兽杂烩。\n\t万年前，灵气复苏后，蓝星膨胀百倍，动物、植物妖化，兽巢林立，肆虐蓝星，人类万不存一。\n\t好在人类发现18岁后就有幸运儿觉醒神奇能力，他们把它成为天赋。\n\t万年历史里，英雄辈出，带领人族一步步重新踏上蓝星之巅。\n\t有一个人，凭借其天赋能力，创武道，划下武者五境，携人族最后火种，救亡图存，向天再借千年，世人称之为武祖。\n\t有一个人，立大宏愿，深入兽群灵脉，铸下第一圣城，建立人族根据地，从此人族据守圣城，世人称之为圣行者。\n\t有一个人，通天彻地，其活跃时期，人族达到顶峰，足足拥有九座圣城，引得大阳照耀，让其独断万古！打得妖兽唯有潜入地下苟存。世人称之为昊天。\n\t有一个人，生不逢时，红月奇变，红月成了多元宇宙通道，蓝星遭遇异族殖民入侵，在仅存一座圣城时，于微末崛起，屡创奇迹，反攻异族，宣告人族生生不息之势。世人称之为明尊。\n\t四人一同列入人族最高殿堂，共称为四方天尊！\n\t现如今，蓝星人族联盟余下六座圣城，如六角星六个角包住人族领地，为了防止动植物妖化伤人，领地内的活物只有人类，领地外遍地妖穴。\n\t随便一只最低级的妖都有3米高，气血值10点以上，而普通中年人气血值在7点左右，气血值是蓝星武者体质的综合体现，和前世的格斗比赛的体重级别类似，普通人和妖相当于羽量级打超重量级，或者说是50斤的小孩打100斤的大人，简直噩梦。\n\t而易凡正处于联盟南部琅琊圣城辖下的古越州月桂市。\n\t扯远了，其实很简单。\n\t他穿越了，才刚恢复前世记忆，\n\t觉醒的天赋被评为F级，\n\t随后学校把他从实验班转到普通班，\n\t战队把他踢走，\n\t家里的不动产自己毛都没有。\n\t忽然，一个身穿紫色旗袍，一头紫发烫了大波浪的妩媚女生走到他跟前，\n\t“易凡，我们分手吧。”\n\t“柳如烟？？”\n\t随后不给易凡反应机会，就一扭身体钻进身后的车子副驾，悠悠驶进校园。\n\t易凡回头，主驾坐着一个黄毛小子，朝他露出一抹莫名的笑容。\n\t如果易凡没记错这个黄毛就是顶替他在荣耀战斗位置的叶知秋！\n\t柳如烟同样也属于荣耀战队，两人凑在一起，其中的意味大概不需要解释了。\n\t学校把他降级至普通班，他可以理解，毕竟是按校规行事，所有中学都有规定，F级天赋不准许待在实验班，防止世家大族乱安插子弟。\n\t老爹对他失望，他也可以理解，毕竟他口中的大师姐，乃是三年前高考状元！更何况易凡也不在意一个破道馆。\n\t但是曹丹的荣耀战队，他无法理解！\n\t是谁当初无私分享战斗技巧给他们？！\n\t是谁平日任劳任怨与所有成员陪练？！\n\t是谁拼死受伤数月才争取校队资格？！\n\t如今前飘飘一句天赋太差就把他踢出战队，让一个貂毛摘了桃子，可恨啊！！！\n\t从原来的富二代到如今人人嫌弃，只需要一个晚上，一次天赋觉醒。\n\t这就是这个世界每年都发生无数次的残酷现实，被蓝星学者称为绝望的六月！\n\t也不怪蓝星人这样，天赋评级是人族万年来长久经验总结，天赋高的人吃了资源往往会比平凡人发挥的作用大得多。\n\t天赋不同级别的差距巨大，打个比方，如F级巨力天赋，最多就能增加1倍力量，然而到C级巨力天赋，最高能增加2倍力量，B级4倍，A级8倍，每一级差距都在2倍以上！\n\t但是这里举的是简单天赋能力的评级，在遇到功能很复杂、无法量化、无法迅速兑现为实力的天赋，就得经过智慧树（人类开发的智脑）更高级的模拟评级，易凡的天赋就是功能复杂的那种，它真的是废物吗？\n\t易凡凝聚精神，在脑海中，浮现了他的天赋能力。\n\t[星灵祝福——窃法巧手]：暮光星灵每天会和你玩一个抽奖答题游戏，她在LOL（英雄联盟）中搜索所有英雄技能，汇总成奖池，然后抽取一个技能的描述作为题面，只要你能一次不差地猜中它的名字，就可以选择获得这个技能。\n\t每第五天，只会抽到英雄的终极技能（大招R）。\n\t每第四天，只会抽到英雄的被动技能。（相当于一个英雄的全部5个技能数量）\n\t你每拥有1个终极技能，就获得1个法术星云，所有获得的普通技能将汇入星云，并融合成一个以终极技能为底座的独特技能，每个法术星云每天可使用1次。\n\t“不是哥们，这不是我无聊设置的抽奖游戏吗？怎么变成我的天赋了？但是我没有设置猜谜呀，这是被无形大手反向优化了么。”易凡惊了。\n\t抽奖、猜谜、融合，怪不得天赋被评为F级，要兑现天赋，只能每天猜谜，然而只要是没见过技能名称的人，从技能描述反向猜测技能名称的难度...不亚于猜对象今天想吃什么饭。\n\t再加上LOL的中文翻译总喜欢搞艺术，以常人的脑回路确实很难猜到。\n\t举个栗子：“瑟提又痒难耐，渴望打架，在朝着敌人的方向移动时获得移动速度，此外，瑟提的下两次攻击造成额外的最大生命值物理伤害，攻击总会以一左一右的方式进行。”（腕豪Q技能的描述）\n\t正常人都是猜“左右开弓”、“双手互博”、“一板一眼”吧？再不济猜个“武德充沛”？\n\t哪个神人在没看过其技能名称的时候会想到“屈人之威”这名字？\n\t还有“天霸横空烈轰”、“瞬狱影杀阵”这种，谁猜？\n\t估计就“致盲吹箫”这种容易一点，因为技能描述有关键要素致盲。\n\t易凡猜测，在智慧树模拟天赋能力测试时，压根没有猜出任何一个名字，再通过联盟资深的评委席也猜不出一二三四，甚至都没有送到评委席，不认为有人能猜出来，就评了个F级。\n\t有人说这种评法不够严谨，其实人族现在每年千万人觉醒天赋，评委席就那么些人，大部分就是智慧树筛一遍，是多少级就多少，智慧树的不出错概率号称9个9，也就是99.9%后面带9个9，实在存在疑议的，才会送给评委席。\n\t百年前有个人觉醒了天赋[百年预言]：耗费巨量生命力（具体多少不知道），就可以知道一百年后的事情。也是没法验证的能力。\n\t但是当时有高人拿出无数天才地宝，让其拥有生死人肉白骨的生命力，让其预言一个天大的事情，谁知他刚开始第一次预言，磅礴生命力凭空消失，瞬间就奄奄一息，留下遗言就溜溜球了。\n\t无数资源造成一场空，从那以后，联盟发布《降本增效》条例，对于十分复杂、无法量化、无法模拟、豪无效益、巨高成本的天赋，将会被评为F级，减少人们对那些无法兑现天赋转化为实力的天赋能力的空虚追捧。\n\t捡漏了！易凡没想到自己一穿越过来就捡了个大漏！\n\tLOL的英雄技能很多，凭借他这个老玩家、大乱斗爱好者、以及前世忠实的观赛经验（管大校魅力时刻），也知悉了七七八八。\n\t来！吧！天赋[窃法巧手]发动！\n\t念头落下，易凡脑海浮现星光闪烁，伴随银铃笑声，一张卡牌噔噔噔噔噔地排列出来。\n\t“自带BGM，还是小孩桌的。”易凡无语中。\n\t[技能]：使用者将自身和一个敌方英雄放逐至死者领域7秒，并在期间内偷取该英雄10%的核心属性。如果使用者在死者领域中杀死了该敌人，那么使用者会吞噬目标的灵魂，保留使用者所偷取的属性，直到目标复活为止。（核心属性包含：法强、攻击力、攻速、护甲、魔抗、最大生命值）\n\t“哟，这不是小黑屋嘛？发明5A级连招的铁男的大招——[轮回绝境]。”\n\t“终极技能！所以说今天是所谓的第五天了。”\n\t“由于家传武学是《非凡剑术》，所以之前我都在练剑，剑术水平在同龄人中也算佼佼者，不然也没法在气血值只有3点的情况下进入到实验班，正常要冲击大学的学生在觉醒天赋时气血值都有4点左右，而那些尖子生更是达到恐怖的5气血。”\n\t“言归正传，之前自己考虑走剑客职业，可惜轮回绝境不是剑系技能，实在可惜了，算了，先提交！”\n\t小孩BGM响起，结果不出所料！\n\t√\n\t铁男大招主要效果是关小黑屋，但其实更重要的偷取了对手的很多属性，不然无法发挥5A级连招的最大威力，而且注意到有个关键描述：“如果使用者在死者领域中杀死了该敌人，那么使用者会吞噬目标的灵魂，保留使用者所偷取的属性，直到目标复活为止。”\n\t游戏里能复活，但这里是现实世界啊，人被打死了就会死，复活不了！那岂不是说只要在7秒内打死对手，偷取的属性就永久保留？成就真正的5A级圣体？\n\t选择落下，轮回绝境卡牌化作星光飘飞，汇入脑海中的法术星云中，一瞬间，无数知识、技巧出现在易凡的记忆、身体本能中，只要他想，就可以瞬间使用出轮回绝境！\n\t[法术星云1——轮回绝境]\n\t你将自身和一个敌人放逐至死者领域7秒，并在期间内偷取该英雄10%的核心属性。\n\t如果你在死者领域中杀死了该敌人，那么你会吞噬目标的灵魂，保留你所偷取的属性，死者领域中的战斗不会在现实留下痕迹。\n\t（核心属性包含：气血、速度、防御力、精神力）\n\t接下来只要杀怪发育就好了。\n\t等等，易凡气血值才3点，而且城市里只有人没有妖，怎么发育？难道要..."},{"title":"第02章 一模开幕，桂仁鸟送头","order":2,"label":"02","text":"易凡的父亲易建连在十几年前的异族战争，功体尽废，同时易凡的母亲战死。\n\t父亲终日忧郁，平时都泡在酒坛子里。\n    三年前，抚恤金花光八成后，他才想办法拿着剩下的钱开了一个剑术道馆混口饭吃。\n\t非凡道馆开业三年，累计招收了多达数百学员，但今年只剩20位学员在册。\n\t作为一个丙级道馆，还是初步成立的，能招收到那么多的学员，全靠当年易建连走了狗屎运，捡漏了一个天才，他的大师姐——周蝉。\n\t没错，第一年就招到了家境贫穷的周蝉这一个学生，在当年高考一飞冲天，斩获状元，考上TOP2大学，震惊无数月桂市民，还在采访中特意提到非凡道馆，大伙儿才知道原来周蝉在非凡道馆学过《非凡剑法》。\n\t然后第二年直接收到了几万人报名，甚至有不少人加钱报名，成为当时热门新闻，奈何非凡道馆场地有限，只能含泪选取了出钱最多的几百名学员，一周一场教学，七天轮流上课才能运转，狠狠的赚了一笔，估计够易建连喝酒喝到千年后了。\n\t然而易建连只是每天例行在道馆教一下剑术，其余时间都在酒坛子中泡着，教学效果不咋地，《非凡剑法》也只不过是一门“平平无奇”的玄级重剑功法。\n\t大量学员意识到上当了，周蝉能上名校不是因为道馆，而是她自己牛，因此非凡道馆第三年就只剩下了20位年龄还很小的学员，而且因为易建连经常喝酒，还有个外号叫非凡酒馆。\n\t总之，易凡想让他父亲帮他抓妖来练级是行不通了。\n\t他想变强最快的途径是杀妖，杀妖的前提是自己先变强...闭环了。\n\t老爹指望不上，\n\t战队把他踢了，\n\t唯今之计，只能看今天开始的一模（第一次模拟高考），据说学校会安排一处临岸孤岛封闭环境，投放妖兽幼崽。\n\t投放的幼崽气血值在6点左右，比学生的气血高一些，他也难以单独击杀。\n\t值得注意的是，由于每个学生的天赋和定位不一样，有些是战士，有些是辅助，所以高考是5人团队制合作，一模也是如此。\n\t这是个重要的机会，想到这，易凡踏步走向办公室，先去签名调班降级吧。\n\t如愿偷偷来到班主任的办公室，扣了一下门。\n\t“进。”清亮声音回应。\n\t易凡踏进办公室，只见一个高马尾美女把头埋在桌上的一堆资料中。\n\t“顾老师...”\n\t“易凡，就剩你还没签名了，今年实验2班40个人，有高达10个天赋F级，其它9个都签完去新班级报到了。”\n\t还不等易凡说话，顾沁就迅速开口。\n\t“给你分配的是普通班10班，班主任...暂时还是由我兼任。”\n\t说罢，她递出一张协议，上书《自愿转班协议书》。\n\t易凡之前就知道，10班原班主任过产假去了，就分配给顾沁兼管，所以看起来她十分忙碌。\n\t扫了一眼协议，大部分都是废话，说起来普通班和实验班的区别，在于教师水平和校队选拔资格，普通班教师修为较低，而且没有进校队的资格。\n\t临近高考，其实教师的影响不大，而校队就比较重要了。\n\t三中历年都会组织4只5人战队作为校队，加诸资源，让校队在一模、二模、高考上拿到好成绩，都是为了中学排名，为了招生。\n    把他踢出队伍的荣耀战队就是其中之一。\n\t易凡在考虑自己要不要透露天赋能力，留在实验班，但转念一想，自己评F级天赋时被这么多人嫌弃，反而自己还像谄媚一样向他们展现自己拥有了更好的天赋，有点难评。\n\t以他的闷骚性格不喜欢做花里胡哨的，只要默默发育，一剑把看不起他的人拍在地上才是他之所爱，特别是荣耀战队这群人。\n\t易凡脑中闪过自己偷偷发育惊艳所有人的场景，在一众观众眼中大话特话，人争一口气、黄昏见证真正信徒、扮猪吃虎、三十年河东等等名言。\n\t哦~想想就膏潮了。\n\t手起，签字。\n\t从别人眼中高人一等的实验班学生变成了芸芸众生...\n\t“顾老师...”\n\t易凡话音才起，就又被顾沁打断。\n\t“签好了嘛？刚好要到一模时间了，我们赶紧去广场集合吧，免得迟到。”\n\t顾沁站起身来，牛仔裤白衬衫，一头马尾一副眼镜，双眸淡然面无表情，光着额头唇白齿白，与往常一样，易凡只感受到了“干净”二字。\n\t“走吧。”\n\t广场上，高三50个班级排列成一个个方队，每个方队前方站着两个迷彩哥，现场没有噤声，嘈杂人声混着口哨，好不热闹。\n\t易凡跟在顾沁身后，从路过的实验班方队感受到几道强烈目光。\n\t不用猜都知道来自一班是前女友柳如烟，而三班就是荣耀战队剩下的众人了。\n\t无须理会，他径直往十班方队走去。\n\t路过三班，学生纷纷和顾沁打招呼，出乎意料的是，顾沁居然没有走到实验三班，反而也走到了十班，这次她似乎带队十班。\n\t三班方队，站在最前面第一排，有四个异常醒目的学生，三男一女，都是荣耀战队成员，看向易凡的眼神，有不屑，有可怜，有摄人，有纠结。\n\t“多亏了这‘人才’觉醒了F级天赋，我捡了个校队名额。”\n\t“易凡，你为什么不求求队长，这几年的情谊，她至少都可以留你做预备成员！”\n\t“祸患已除，不成气候。”\n\t“这个决定，真的对荣耀最好吗？”\n\t一班方队，见易凡没有看向她，柳如烟神色莫名：“易凡...”\n\t她身后，还有一个怒上眉梢的红发少年，紧握双拳，青筋隆起：“易凡，这次一模我要让你知道谁才是真正配得上如烟的强者，像你这样的渣男，恶有恶报，果然只觉醒了F级天赋，这次一模注定要被我踩在脚下。”\n\t恰巧，他的身边也有一个绿头发的高瘦学生，悄声问道：“老大，易凡已经废了，大嫂必定要和他分手，为何我们还要和一个区区废物较劲。”\n\t“你不懂！那天我自告奋勇去帮如烟搬行李，没想到...没想到竟然在她桌子上看到敏婷和早孕测试棒！”\n\t“啊这！？”\n\t“哼，你以为我会觉得如烟不干净吗？不，我只觉得易凡这个渣男让她受苦了！！！到时在岛上，没遇到他也就罢了，遇到必把他淘汰出局，以解我心头恨啊！我恨啊啊啊啊啊啊！”\n\t杨沸突然发狂，吓得旁边的人都退后几步，他们可不想招惹这个战斗狂，而且他还是三中仅有5位的S级天赋学生，觉醒了怒霸体！\n\t另一边，易凡迎着10班同学好奇的目光走进队伍后头，令他感叹的是，场上50个班级嘈杂无比，只有3班和10班队伍安安静静，全赖顾沁平日的严格管理。\n\t很快，一模开幕式展开，台上数位老登现身。\n\t“让我们欢迎王校长致辞...”\n\t“让我们欢迎警卫司岳局长致辞...”\n\t易凡听的摇摇欲坠，到最后快睡着时，终于开始讲述一模规则和要点：\n\t1、人员，月桂市十所中学高三学生联考；\n\t2、地点，空降巨岩岛；\n\t3、成绩，两天内探索、杀妖、生存综合表现评分；\n\t4、直播，每个战队或优秀个人独立直播，收益、赞助归战队和个人所有。\n\t易凡发现，这个世界的高考发展和前世区别挺大的，不是应试考试，而是和前世的选秀节目类似，在一些规则下，对抗妖兽，展现每个个体的能力、价值，但是可能会丧失一些公平性。\n\t时候不早，一架架战机飞来，以班级为单位把学生运往巨岩岛。\n\t一个小时的旅途，易凡在战机上疯狂恶补城外的经验知识，其他学生也是如此，99.9%的学生都是第一次出城，对于书本、电视上描述城外炼狱般的场景还没有切实感受。\n\t好在班主任顾沁有问必答。\n\t“城外，没有网络，你们身上普通的通讯器都失去了联络功能，只有特制月球通讯器才能在野外使用，所以你们有不同班级的战队成员，要提前约定好等会儿跳伞降落集合的位置。”\n\t“遇到危险迅速触发你们身上的安全报障装置，每年都会有学生在一模中受伤甚至死亡！”\n\t“这次投放的妖兽大部分是6点气血值，少部分妖兽气血值更高！目前三中学生还没有超过6点气血值的，一半学生在3点气血左右，少部分达到4点，只有顶尖那批学生到了5点气血以上，所以对你们来说这些妖兽都是难以单独战胜，最好集体行动。”\n\t“杀妖不是唯一获取分数的途径，生存到最后一刻会有20基础分，十分重要。”\n\t“探索巨岩岛也是不错的选择，巨岩岛是以前人妖大战遗址，岛上毫无生机，只留有一座座光秃秃的石头山，传闻藏有不少烈士遗物，等待你们寻找。”\n\t战机上学生叽叽喳喳讨论，普通班的学生配置基本都是F~C级天赋+3~4点气血，即使组了5人战队，都不一定打得过6气血值的妖兽幼崽。\n\t没有组战队的在找队友，甚至有几个妹子都找到易凡那里来了，不过她们实力才C级天赋+3气血，太差了，不一定帮得上她，要知道易凡虽然3气血，但是凭借超群剑术，可以越级战斗，战力比肩5气血。\n\t如果开启轮回绝境，偷取妖兽1层综合属性，此消彼长之下，7秒内他的实力应该约等于5.5气血。\n\t有数据统计，对于10气血值以下的武者来说，前期天赋增幅的实力并不算太高，换算成气血值统计单位，大概是F级=0.5气血值，C级=0.7，B级=1，A级=1.5，S级=2，她们的实力大概在3.7气血值左右，实力强不强不说，战队也是要有时间磨合的，这种临时组队实际是1+1<2的效果，得不偿失。\n\t时过境迁，烈阳被红云笼罩，战机下，堪比前世海南岛大小的巨岩岛泛着黑光。\n\t来自三个中学高三的数万名学生开始统一跳伞，像下面条一样稀里哗啦的。\n\t根据给的资料，巨岩岛大概被分为四个区域，投放的妖兽测重属性不一样，东区是肉食妖类输出高，南区是速度和飞行妖类，北区都是草食妖类防御高，西区妖类属性最低，但是有毒。\n\t战机上看学校论坛大家的讨论，大部分人选择去防御高伤害低的北区，大家还是毕竟从心的，生命可贵。比如被易凡拒绝的几个妹子，就跳往了北区。\n\t顶尖战队都选择去东区，攻高防低的妖兽有利于他们发挥杀妖的速度优势。\n\t剩下南区和西区鲜有人选择，从跳伞密集度也能看出一般。\n\t理由很容易想到，南区有飞行和速度快的妖兽十分难杀，而且容易被偷袭受伤，回报率低，但是论坛中有个叫百晓牲的人分析：\n\t为了平衡四区难度和评分，去北区的人评分肯定偏低，东区竞争激烈，反倒是看起来性价比低的南区和西区，理应有评分补偿，他十分推荐有控制类天赋的学生去南区，而有净化类天赋的学生去西区。\n\t先不说他猜的对不对，这种猜测规则的行为十分受欢迎，与前世高考押题的性质差不多，如果猜中出题人心思，就可以事半功倍获取分数，反之则是吃力不讨好。\n\t易凡心里其实是认可他的猜测的，而且他的轮回绝境就是一个十分强力的控制技能，所以他选择跳南区。\n\t谁料。易凡离地还剩20米时，风声骤起，扭头寻去，一只诡异的鸟类自转螺旋式地冲来，2米开外的体型，头似黄褐色龙眼，十分骇人。\n\t是飞行妖类，桂仁鸟！\n\t“桂仁鸟说是鸟，其实本体是它脑袋上的龙眼化妖，这种鸟喜欢吃龙眼，被化妖的龙眼反噬，替换了脑袋，控制着鸟躯，最终成为桂仁鸟。”\n\t易凡的直播间被导播拉起，他是第一个与妖兽正面交战的学生，被导播拉到主直播视角，直播间热度迅速高涨，一群弹幕划过，解说反应也不差，开始分析此时战况。\n\t“来不及讲解了，它的速度十分快，易凡同学虽然发现了，但是在空中降落伞上无法借力，他是否能有效应对？他是第一个对上妖兽的学生，该说不说有点倒霉，是否会是第一个淘汰的学生？”\n\t易凡也意识到空中无法借力，与它对上凶多吉少。\n\t现在他有两种方式应对，一个是直接使用轮回绝境进入死亡领域避免空中劣势，但是他肯定没法在7秒内打死它，第一次轮回绝境就浪费了。\n\t另一种方式...易凡不再犹豫，反手拔出制式长剑，一剑割断降落伞绳子，让自己迅速降落，微微偏离了它冲锋方向，并使出非凡剑术三式武技之一的泰若斩，一记大力斩击后发先至拍向它伸出的爪抓。\n\t威力比寻常时低了许多，伴随一声金石交击声，巨大的反作用力使易凡手臂颤抖，然而他的目的达到了，借助这股反作用力，他以极快的速度降落在地上，接触地面的刹那，翻滚两圈以卸力。\n\t在直播间中，解说管震见状，脱口讲解。\n\t“它的攻击手段很多，最恶心的一种是张开骇人巨口，飞近目标后，一口把目标吞入束缚消化。”\n\t“哇，易凡反应很快，先舍弃降落伞，然后他再反击飞鹰爪击，成功扛过空中偷袭！”\n\t又有一女声补充道：“还不止，这里他的细节处理很多，自由落体躲开桂仁鸟预定的骇人巨口的攻击轨道，迫使它不得不改成临时的飞鹰爪击，削弱了至少5成的攻击强度。\n\t随后的一击威力不小，既防住了它的爪击，还借助反作用力，实现快速落地，避免被它二次空中打击，\n\t最关键的是落地的卸力处理十分纯熟，换做正常学生从20米高以这么快的速度落下，不残也伤。\n\t大家有没有注意，他用剑割开的降落伞，而不是手解开，说明他十分信任手中剑，我猜他一定是个剑术不错的学生。”\n\t“颜语眼力很好啊！竟然比我看出这么多东西，佩服佩服。刚好我们来看下易凡的资料，能如此流畅的处理，相信他一定是中学学生中的佼佼者！颜语，你觉得他实力如何？我觉得他或许是一个天骄。”\n\t“我感觉他应该有5气血值的实力，实验班种子选手，顶尖战队成员。”\n\t直播间中，亮起了易凡的官方资料。\n\t姓名：易凡\n\t学校：三中10班（顾沁）\n\t战队：无\n\t气血值：3.1\n\t天赋：F级\n\t武学：玄级非凡剑法（融会贯通）\n\t教师评语：易凡剑术超群，学生时期，家传的非凡剑法从初窥门径练到半步完美无瑕，剑术成就比之三年前的周蝉只差半步，能对抗4~5点气血的同学。然而天妒英才，易凡的资质不太理想，仅有3气血，雪上加霜的是，觉醒了丝毫无用的F级天赋。\n\t观众看到资料，纷纷刷起了弹幕。\n\t【竟然是难得一见的慧心通玄颜语大小姐翻车猜错了，易凡仅仅是一个普通班3气血普通学生，难道这一届学生的质量这么高了，人族之福啊】\n\t【我觉得不是颜语老婆的问题，是管震毒奶发动了连累颜语老婆】\n\t【虽然猜错了气血，但是易凡的实力不差吧，3气血逆罚5气血，可称小天才】\n\t【易凡之前是二中校队荣耀战队的成员，只不过天赋太废，资质太差，才会被踢出，曾经确实是个天才】\n\t【天才个毛啊，废天赋+普通资质，未来成就一眼可见，一个武二代罢了，非凡酒馆馆主的孩子，凭借从小学习家传武学，甚至是传功的家学，才能越级战斗】 \n\t【哇擦，周蝉不是三年前月桂市的高考状元吗？而且当时她学的也是非凡剑法！他们是同门师兄弟呀！】\n\t【楼上的，非凡剑法已经在一年前被证实就是一个普通的玄级武学，非凡酒馆也是某个酒鬼谋生的创业手段，实际是周蝉自身能力才能夺取状元】\n\t【谁说的，当年可是有强者传出来，非凡剑法脱胎自某门珍贵的地级武学，只不过没人能练到其描述的境界罢了】\n\t【营销号洗脑，呵呵】\n\t【导播换台了，荣耀战队遇上妖兽啦】\n\t幸好一模中的考生没法看到直播间弹幕，不然多少要被影响心态了。\n\t两名解说看到资料，明白自己猜错了，也有点尴尬。好在管震脸皮厚，打了个哈哈就过去了。\n\t“易凡有惊无险藏到石洞中，桂仁鸟毕竟是飞行妖兽，地面作战屈居劣势，这下他安全了。虽然他并不是大伙儿喜欢关注的顶尖战队成员，但是表现不可小觑，剑术非常牛。而且学习的是三年前周蝉所使的同款剑法，看点十足，大家喜欢剑的可以多多关注。”\n\t“好的，导播又给我们带来了东区顶尖战队——荣耀战队的战斗画面...”\n\t那只桂仁鸟幼崽伫立在高耸的巨岩上，从龙眼中透出悠悠的目光，这是它掌握捕猎技能以来第3次捕猎失败，虽然以它小小的脑壳不清楚自己为什么一眨眼斗转星移换到了一个巨岩林立的地方。\n\t但是几天没吞食，它迫不及待开始狩猎，却发现它打不过地上跑的飞快的“猫咪”和“虫子”，现在发现一只看起来弱小的猴子，却没把握住机会，它可以感受到这只猴子力道很小，这次它不会放弃。\n\t但是它也不敢落地，不仅实力削弱，还容易被猫咪和虫子抓住，除非...夜幕降临，一击毙命，所以它死盯着这个猴子，它不信猴子能在石洞里躲一辈子。"},{"title":"第03章 非凡剑法，没石掷斩桂仁","order":3,"label":"03","text":"岩洞内，看到桂仁鸟没有追击，易凡抚平激荡的心，深深松了一口气。\n\t幸好自己是苏醒记忆，而不是突然穿越过来，身体还具有位列三中剑术前茅的本能反应，不然凭自己前世游戏宅的身份，估计就来不及反应，直接成牢大了...\n\t易凡手扶身前长剑，选择南区面对速度型妖兽，还有一个原因是他所学非凡剑法属于重剑剑法，并且达到举轻若重的剑道境界。\n\t同水平下，重剑武者是会被速度型对手克制的，但举轻若重的剑者可以反过来克制速度型对手。\n\t他老爹易建连曾经对他说过，非凡剑法走的是重剑、慢剑的路子，讲究不动则已，动如猛虎！若练到完美无暇，则有机会悟到举轻若重剑道境界。\n\t重剑剑法，一直以来都有举轻若重和举重若轻两种剑道境界，也一直有孰强孰弱的争执。\n\t举重若轻：将沉重的重剑使得像羽毛一般，潇洒自如，刚猛迅速，无往不破。\n\t举轻若重：让轻巧的武器蕴含千钧之力，专注凝练力量，大巧若拙。\n\t更简单点，一个更快更猛，正面突破，一个多思慢打，见机爆发。\n\t非凡剑法有三道核心武技：击逆剑，泰若斩，没（mo不是mei）石掷。\n\t第一招考验眼力，深含后返先至的要义，专打对手攻击的薄弱处，是一招以伤换伤的剑技；\n\t第二招是激发所有力量的纯粹重斩，像泰山压顶般把对手压垮，使用后有力竭风险；\n\t第三招是把剑飞掷出去，威力之大能把剑峰全部没入石头中。\n\t招招不同寻常，威力直追地级武学，得名非凡剑法。\n\t武学一般有五个境界，初窥门径、登堂入室、融会贯通、完美无瑕，超凡入圣。\n\t易凡天生就对非凡剑法有极高的契合度，再加上他很乐意与同学对练，在非凡剑法上进步飞快。\n\t在同龄人都还是初窥门径、登堂入室的挣扎的时候，易凡凭半步完美无暇的非凡剑法就能越级战斗高他一两点气血的学生。\n\t而且十分神奇的是，在三年前看到周蝉运用完美级非凡剑法后，易凡意外领悟到了举轻若重的剑境，现在只是使用学校发的制式长剑，就和运使重剑一样，威力巨大。\n\t不过，这只是一门玄级剑法罢了，等他们考入大学，就有很多机会接触地级甚至天级武学，到时候就无法通过这小小的领先拉平差距。\n\t更何况，有些人估计都认为易凡的非凡剑法进度是老爹的手笔，甚至是传功。\n\t学校观战台上，王校长和局长还有一堆领导老师谈笑风生。\n\t“老王啊，你看这个第一个碰上妖兽的学生，穿的是你们学校的战斗服，后生可谓呀，竟然能在天空中被偷袭的情况下安然落地，想我们当初同样的年纪怕是无法如此从容！”\n\t“老岳说笑了，我们月桂市谁不知道你曾经少年英雄，年纪轻轻就带领队伍从兽潮突围，我们三中学子想追上你的步伐怕是要再努力得多哦！”\n\t王校长与岳局长对视而笑，又转头询问身后凝望的女教师，“顾老师，这是你们班上的学生吧，还不给老岳介绍一下。”\n\t顾沁打开一份资料，“易凡原来是实验3班学生，长久以来凭借半步完美的家传玄级武学，可以越级与5气血同学对战，学生们常常与他交流武技，他也来者不拒，想必在日常对战中积累的十分扎实的功底。只不过觉醒了废天赋，如今已自愿转入10班。”\n\t两个老登听着家传、玄级武学、越级等字面感欣慰了然，后又听到4气血、自愿、转班，面色转为可惜惋惜，从短短几句话就明白这个少年所经历。\n\t“老王啊老王，你这干的不地道呀，这少年一看战力表现，足以可见是武学才子，至少也是勤奋之人，你这中学不加以培养？不如毕业后介绍到我警卫司后备队，我们警卫司就喜欢勤奋少年。”\n\t“老岳你那警卫司干的都是保家卫国，拼命的活儿，我们学校那些尖子生都够不着，这初出茅庐的小崽子怕是顶不住，不过到时可以让他报名你们警卫司，争取一个机会。”\n\t月桂市非凡道馆中，一个老登喝着“矿泉水”，酒气熏熏，眯着双眼，他的身后一堆少年孩子，大屏电视中，不是易凡是谁。\n\t“凡哥哥加油！啊~打，呀呀呀呀呀，打死大怪兽~”\n\t“好棒棒！”\n\t就在易凡蹲坑恢复施展泰若斩造成的些许力竭时。\n\t他的直播标题已经被改成【F级天赋3气血少年使用三年前周蝉同款非凡剑法单人击退桂仁鸟】，热度直追种子学生，位列第二梯队。\n    弹幕频率很高。\n\t【嘶，空中激战桂仁鸟，我观此少年有大帝之姿！】\n\t【嘶，我观此少年有大龟之姿！哪有人一落地就龟在洞里啊？】\n\t【练武之人，耗费气力更高，岛上有没有食物，只能食妖，两天内只龟缩洞里，虽无危险，但气血渐渐削弱，越往后越难杀妖拿分，高考中的苟道在前人经历来看评分十分低啊】\n\t【无危险？我觉得他已经被那只桂仁鸟盯上了，一出洞就要凉凉】\n\t【你们懂什么？不出老夫所料，刚刚在空中应该是施展了非凡剑法中的泰若斩，后遗症就是力竭，所以他在休息罢了，老夫为了孙儿研究了周蝉和非凡剑法三年，我可以说比创招者还懂】\n\t【经典懂哥~】\n\t【唉，怪不得被荣耀踢了，开局就被妖兽追着打，狼狈逃串，与荣耀的画风确实格格不入】\n\t洞内，易凡调息沉思。\n\t在空中强行运使泰若斩，饶是他能举轻若重，也在桂仁鸟爪子反震下浑身酸痛，若是脚踏大地，决不会力竭。\n\t经过半个小时调息，他身躯终于恢复了，但另一个问题，他现在明显感觉到饿了，啃着学校给的物资里面只有一块压缩饼干，吃完之后，两天内的一定要杀妖食补！\n\t他已经有目标了，就是那只贱鸟！\n\t所有人类都清楚的一件事，妖兽好杀戮，睚眦必报，持强凌弱。\n\t从他给它的那一斩，它必然知道他力气不如它，所以可以肯定，现在它一定会狩猎他。\n\t但它没有马上追击过来，是怕在洞穴中会自削实力吗？还是说...\n\t忽然，一声惊雷骤响，似要让大雨落下。\n\t“通报一则消息，巨岩岛将会在2小时后下暴雨，暴雨持续4小时。”\n\t是头顶的隐形无人机的声音，官方天气通报！\n\t下雨不是一件好事，特别是野外的雨，会引起强烈的天地灵气激荡，暴露在雨中，容易...生病感冒！\n\t“那就在2小时内把它干掉吧，欲速则不达，在此之前，消化饼干、调息让自己身体达到最佳状态！”\n\t其他区域，一听到这个消息，不论战队、独狼，只要希望成绩亮眼的学生，都开始行动起来，寻找接触妖兽，再不开干，等雨停后，就入夜了，那样更有风险。\n\t最疯狂的就是北区，由于妖兽都是防御型，一大堆学生要磨很久才能打死一只，漫山遍野都在战斗。\n\t易凡直播间中，观众见他看到天气通知都不为所动，渐渐也放下了耐心，流量一降再降。\n\t【快去看，猎妖榜上有动静了，已经有战队斩杀了妖兽，这个大龟不会出去打妖兽了，让他自生自灭吧】\n\t【我看着都睡着了，真无聊就一直蹲】\n\t【谁说不是呢，外卖都吃光了，索然无味呀，还想看下状元周蝉同款剑法，溜了溜了】\n\t1个小时后。\n\t直播间流量已降到末尾，当然易凡并不知道这个事情。\n\t养精蓄锐，利剑出鞘，斩妖！\n\t踏出岩洞，观察周围环境，或许是因为官方早就考虑到学生分布，似乎南区的妖兽投放比较少，四周没有明显妖兽活动的痕迹。\n\t身前，是一株株十几米高的岩石柱，有点像前世的喀斯特地貌，瘦骨嶙峋，不太适合速度型妖兽进攻，容易被躲闪拉扯。\n\t易凡，“地图设计和地图理解不差。”\n    但他知道这样的话，那只鸟可能不会出来。\n    他穿过石林，到了一个广阔的平台，这里没有遮挡，如果他是鸟，必然会在这里发动攻击。\n\t一声雷声掩盖，一只妖鸟，诡异地自转螺旋从易凡背后冲来，竟然会配合自然环境，发起突袭！\n\t“哼！畜生就是畜生，给饵就吃。”易凡从冽冽风中感知到偷袭，竖起长剑，看到了它的影子。\n\t就在它龙眼开了一道缝，准备张开骇人巨口时，易凡嘴角一歪，不退反进，提前侧身一躲，稍微测了一些角度朝它口中狠狠一刺。\n\t非凡剑法之击逆剑，以伤换伤之招，同时也是以攻为守之招，在举轻若重加持下，这一击可以比拟5气血的武者的全力一击。\n\t它张开的龙眼巨口，像花瓣一般，外边是暗黄色隆起坚硬的果壳，巨口之内，苍白色的果肉如同肌肉一样盘桓蠕动，只有被吞入其中，绝对会被瞬间压断浑身骨头，然后被充满尖刺的果核切成肉沫！\n\t双方硬碰硬之下，易凡由于稍微偏了一下身子，在反作用力之下身子被反震得发麻，但也险险躲过了巨口吞食，而它就没有好过，它的白肉被长剑切下一大块。\n    “可惜，没刺中它的果核，只有斩下果核，它才会真正死亡。”\n\t桂仁鸟大怒，借由巨岩迅速回转，一人一妖交错而过，快速一爪，把易凡背后抓去，他自然不甘受戮，鼓动全身气力，反手一发泰若斩，又是金石交击声响，再次震得易凡手臂发麻。\n\t越级对战妖兽还是太吃力了，虽然它属于速度型妖兽，攻击力相对小很多，但实打实是6气血，它的普通一击，就相当于易凡全力施展武技的威力，气力消耗很快。\n\t再对几招，他可能又要力竭，“以3气血对上6气血，果然十分吃力，甚至我感觉自己有些托大了...”\n    “桂仁鸟幼崽有个习性，当它对战处于均势时，会悬在半空，张开果壳，引发超声波震荡骚扰，持续数十秒，如果不慎被超声波冲击到，影响感知，它就可以趁此机会攻击。”\n    “这是对前人武者的一个超级初见杀技能，很多知识储备不够扎实的年轻武者会惨死在这招下，就算知道了这招，但对手如果没有打断它的能力，也只能被动闪躲无形的超声波。”\n    “同时，如果对方躲过了，或者不受超声波的影响，它就会逃离，因为它使用了最强手段都没能赢，只能仗着有翅膀逃之夭夭。\n    “只有在它发动这招时，用没石掷一剑射爆它的果核才有机会！”\n    想到这里，易凡再次鼓动力量，怒吼斩向飞来的妖鸟，又一次交锋。\n    “再来！畜生！”\n    易凡举剑直指桂仁鸟，挑衅味十足。\n    它螺旋的龙眼脑袋，不断张开又闭合，看起来十分愤怒，愤怒自己竟然拿不下这个看似弱小的猴子，在速度快攻下，他竟然还向自己挑衅，可恶啊！\n    它悬停在5米空中，螺旋的龙眼张开大口，形似一只螺旋的花瓣，肉眼可见的把周围的风沙吸进口中，正式超声波震荡起手动作。\n    “来了！超声波震荡，我等候多时！在使用时，也正是你这畜生破绽最大时，只要你开始放波，我就要你死！”\n    易凡双眼紧盯它的果核，赫见果核中间出现一个小口，这就是超声波开始发射的信号！\n    “接我，没石掷！”\n    易凡自转一圈，手中长剑精准掷向桂仁鸟。\n    它看着飞来的长剑，不屑地煽动翅膀，就这种攻击，它随意一偏，就能躲开。\n    它并未感知到身后，一个黑点同时张开，黑暗、死亡、透明的大门如同幽冥巨口就要把一人一妖吞噬。\n    它发现竟然无法飞行躲避？什么情况，飞震的翅膀象征了它内心的惊恐！\n    “天命，主宰，欺诈！轮回绝境！”\n    易凡早有准备，早在发射长剑时，他的左手同时发动天赋能力，法术星云祭出，正是铁皮人大招，关小黑屋。\n    众所周知（指的是有LOL客户端的众），铁男在释放大招时，敌方英雄会受到很强的减速效果，所以当时游戏有一个连招是ER连招，先用E对准敌人，同时释放大招，敌人无法通过走位躲避E技能（断魂一扼：一个大爪子把人拉动一段距离），这个连招十分好用。\n    也正是这个连招的存在，易凡想到要如何应对这只桂仁鸟。\n    现实也正如他所料，在黑暗之门张开的瞬间，双方都无法动作，桂仁鸟只能硬接飞剑，而他只能硬接超声波。\n    再加上他偷取了0.6气血，此消彼长，这发没石掷，足有5.5气血武者全力一击的威力！而它被偷取0.6气血后，仅存5.4气血，妖躯素质全面下降！\n    造就，一个被飞剑刺爆了果核，一个则被超声波震得头痛发昏。\n    结局已被写下，还未来得及展开的黑暗死亡领域瞬间消失，妖躯跌落，冰冷的妖躯化作易凡身上温暖的气血、速度、防御、精神。\n    本要力竭的易凡，瞬间又感觉充满了力量，从头昏中恢复。\n    （转身45°望天，嘴角一歪）\n    “First Blood！”\n    （妖尸在身后不甘倒地）"},{"title":"第04章 首战告捷，偷气血","order":4,"label":"04","text":"首战告捷，易凡趁着没有其他妖兽，赶紧把龙眼果肉挖下来。\n    桂仁鸟的本体是龙眼脑袋，身子是靠龙眼提供的能量，所以它刚死，鸟躯就马上变得腐臭，必须迅速切下龙眼头，也只能吃龙眼头。\n    桂仁鸟的龙眼果肉经过妖化后，十分鲜美，雪白雪白地，既有肉味，又有果香，在野外是难得不用加热就很好吃的食物。\n    等桂仁鸟到了成年期，龙眼就会凝练成一个小小的桂圆，它之桂圆脑袋，是妖兽界难得的自然药材，成年期的桂仁鸟被称作桂圆鸟。\n    （冷知识：桂圆是晒干的沉默...噢不，是晒干的龙眼）\n    回到岩洞，易凡掂量了一下果肉的大小，书上说，它的能量密度十分不错，这些十几公斤的果肉，相当于数百块压缩饼干，足够这两天使用了。\n    切半斤果肉粒，一块块放进嘴里。\n    “嗯，营养是牛肉的十倍。和桂圆煲鸡汤差不多，神奇。”\n    其他的果肉用绳子吊在岩洞上方。\n    这个岩洞入口刚好是一个人高，里面个5平米，易凡回来时，顺便扛了两块半人高的石头，封住洞口，有石头掩护，想防住妖兽是不可能的，但至少可以避免它们悄无声息地偷袭。\n    今天已经用过技能了，再去找妖兽的必要性不高，而且没有轮回绝境肯定是打不过的，养精蓄锐。\n    易凡这才好好感受身躯中暴涨的气血，从3.1到3.7，足足五分之一的提升，也是他今年来进步最大的一次，幸好使用没石掷时，没有因为力量暴涨而失败。\n    回想战斗，他3.1气血对上6气血的速度型飞行妖兽，靠着知己知彼，加上出乎它意料的铁男职业连招，一环扣一环，才能险险拿下。\n    若是换做一个没有针对速度妖兽能力的5气血武者，怎么防住它连续速度快攻？怎么能打到飞在空中的鸟？怎么准确命中果核？\n    他自己战力不差，而且由于举轻若重，攻击伤害比寻常人高得多。\n    对官方设计的初衷，易凡再次有了深刻理解。\n    6气血妖兽是要五人战队配合战胜的，当然这里的战队指的是普通4气血的学生成员，如果是顶尖战队，他们为了分数，会连续追猎妖兽，甚至是主动挑战更难的目标。\n    能被寻常4气血武者战胜的6气血妖兽幼崽，只存在北区！它们只会防御！能被磨死！\n    北区设置防御妖兽，是为了大众学生，让学生见见血见见世面，感受高考氛围的，毕竟这只是一个模拟高考。\n    而东、南、西区的设置，就很有深意。\n    首先东区攻击型妖兽，脾气必然是具有十足的攻击性，所以一只妖兽即使面对五个人，也不会马上逃跑，给足了双方共同的擂台，而且可能会出现多只妖兽同行的情况，或者气血值更高的妖兽，以便拉开评分。\n    而南、西则是对于一下具有珍贵天赋学生的舞台。\n    南区速度型妖兽，具有速度优势，远远看到五人战队，大部分都是跑路，没有特殊天赋的话，战队还追不上，所以人多反而不容易杀妖，是否意味着，官方更希望南区成为一个妖和人刺激SOLO的场地？\n    西区，面对毒物，要求必备辅助防毒、解毒等方面的优势，更偏向于生存，易凡敢肯定，如果能在西区待两天，最后生存评分必然会高得多。\n    答案八九不离十。\n    易凡直播间又来了几名观众。\n    一来，易凡是少数会选择南区的学生；\n    二则是，似乎是想来看看这个苟（考）生会不会出门杀妖。\n    【这小子还没出门吗？隔壁马芸也在南区，刚把1只影豹踢死了，看点位，好像离他不算太远。】\n    【你是说那个腿超长的美女学生吗？据说是一中的种子选手，是尖子生中罕见不在东区集结战队的】\n    【是啊，她还没显露天赋，使的是佛山无影脚，速度型的武学，据说是古越州一个门古老的武学】\n    【咦，他洞里上面挂的是什么，之前没有的，还往嘴里塞，不会是饿晕了，乱捡的什么垃圾吧】\n    【这他么是桂仁鸟的果肉，我吃过一样的，雪白雪白的，再加上他开局遇到的桂仁鸟，难道他刚刚出去干了一只桂仁鸟？】\n    【看回放呀，你问我啊？】\n    【看了，这小子真把妖鸟砍了，但我怎么理解不了他的飞剑能这么准】\n    【荣耀丢大漏了呀，一模中能单杀飞行类妖兽的，历年来都屈指可数的】\n    【我靠，这鸟不会是病了吧，就算它在使用超声波攻击，也能迅速飞行躲避的呀，给他遇上一只病鸟，纯捡分！！！】\n    【前面的，不过是一只奇怪的妖兽而已，以荣耀的实力，他们已经打死好几只妖兽了，易凡才是捡漏打死的桂仁鸟】\n    因为在轮回绝境展开一瞬间打死的桂仁鸟，所以他们不会看到一人一妖消失的场景，误打误撞之下，技能暂时还未暴露。\n    突然，易凡直播间的标题变成了【震惊！一柄单杀飞行妖兽的飞剑】\n    同时主直播间中，直播镜头转向易凡，只不过播放的是从易凡出去杀妖的录像。\n    管震熟悉的声音挥发，“看完尖子生们的默契配合，导播又给我们带来了一个精彩回放，这是...首例单杀飞行妖兽的战斗回放！刚刚我们才看过马芸的飞毛腿单杀影豹，这次居然是单杀飞行妖兽，大家想看吗？想知道是哪位强势考生？”\n    “噢~真让人惊异和好奇呢。”\n    一幕【想看】弹幕刷屏而过，里面夹杂着一两个【颜语女神的捧哏还是一如既往的搞笑】。\n    “啊？竟然是南区的易凡！”\n    “是开局被桂仁鸟袭击的那个吗？”\n    “没错，我没记错的话，他气血值只有3.1吧！”\n    颜语看着回放，开始解说起来。\n    “走到了石柱林，这是一个飞行妖兽劣势的地图场景诶，不错...”\n    【开始做笔记】\n    “不对，他怎么还在往前走，走到空地上了，似乎在...勾引别人攻击他，但这样他属于劣势了呀！”\n    “竟然察觉到了雷声掩饰下的偷袭，而且使用了以伤还伤的打法，这是什么招式！”\n    “看到了吗！就像是一只老虎在向你扑过来的时候，你将手中的刀竖起来，人后仰向前滑铲，在老虎的肚子上面划一刀一样，他的剑削下了一大块雪白妖肉。”\n    【滑铲吗？那很形象了】\n    【神他么滑铲，语语太会比喻了】\n    “然后角度特意偏了一些，让反作用力把他推开不至于被吞入口中！神奇的预判！”\n    “但是他被震退了十几步，说明他在力量气血上占用劣势的，但是按照我们资料中显示，他仅仅是3.1气血，按理来说以他的力量应该直接被抓成血雾才对。”\n    “可能是武技或者天赋，是三年前高考状元周婵同款非凡剑法的能力吗？”\n    “资料显示，非凡剑法是一门重剑剑术，攻击力惊人。”\n    “一击，又一击，数招下来，虽然不知道什么武技能让他越级与桂仁鸟纠缠至今，即使桂仁鸟的爪击攻击强度相对较小，但是他确实处于劣势。很难想象他如何战胜小鸟。”\n    “难道是一道雷把它批下来？”\n    “他竟然还向桂仁鸟挑衅，我的评价是十分大胆，这样很有可能激起它的凶性。”\n    “果然，桂仁鸟发动了知名的新手武者噩梦的招数，超声波震荡！”\n    “易凡再次选择拼招，射出飞剑，在它发射声波时反击，这个方式很多人曾经试过，但是效果不太好，因为它发射过程中还是可以急速飞行躲避攻击，武者反击反而会让自己难以躲开声波，从而饮败，得不偿失。”\n    “什么，小鸟被飞剑射中了，它倒了，躲啊！它怎么不躲啊？”\n    “这个结果似乎有些虎头蛇尾，让人和抓不着头脑，难道易凡有瞬间控制的天赋技能？但是资料显示他的天赋评级是F级，如果是瞬间控制，必不可能仅仅F级。难道是以伤还伤类的因果天赋？也不可能是F级...”\n    “神奇。”\n    管震眼看颜语解说不下去，赶紧出来下台阶，“连我们的颜语都看不出来跟脚吗？上次我们也是猜易凡是尖子生来着，屡屡让我们解说下不来台，这个易凡看来十分难缠啊大伙们。”\n    “大家可以多多关注易凡的直播间，看看他有何秘密！”\n    经过解说发酵，易凡的直播间又充满了游客，这次比开局的还多，而且观众留存率很高，毕竟开局只是躲避偷袭，这次可是单杀妖兽，含金量十足。\n    【老百金集团赞助易凡百份高能气血丹，老百金气血丹，易吸收，促梦想】\n    老百金是联盟中十分有名的武者资源买卖公司，看到易凡的单杀成就，敏感地嗅到了其潜力，瞬间开始赞助，打广告。\n    赞助的这一幕，发生在无数尖子生直播间，这场一模带来很强的经济效应，可以说高考是一场真人秀plus，官方培养了人才，学生获得了关注度和资源，各大公司打响了广告知名度，大家都有美好的未来。\n    巨岩岛的雨如期而至，各区学生都开始暂停作战，躲进石洞，而找不到石洞，或者拜托不了妖兽的学生，都惨遭淘汰。\n    甚至有一些考生来不及触发保命装置，命丧妖口，这一幕在每年都会发生好几次！"},{"title":"第05章 气血如潮，一模夜榜","order":5,"label":"05","text":"无论是黑夜，亦或者是雨中，妖兽都是更加强势的一方，即使顶尖战队也选择偃旗息鼓，趁着暴雨，在山洞中休整。\n    易凡感受吞食龙眼果肉后，身躯中前所未有地沸腾起来的气血，人族气血境各个阶段的突破和妖兽有很大的关系，自己的气血从3.1偷取到3.7，再吞食妖兽血肉，现在已经突破到3.9了。\n    偷取来的气血翻涌，困锁多时的气血值再上一层楼。\n    “增长的气血，竟然可用于突破气血境！”\n    人族历史中，天赋给予气血的增强都是“加持”类的，也就是说你根本的气血是5点，有一个经典天赋[沸血]，作用是给予自身0.1倍的气血加成，也只是在运用武学的时候变成5.5气血加持而已，不会改变你根本气血是5点的本质，这5气血被称作基础气血。\n    而另一种常见天赋[药物亲和]，可以增幅身体吸收气血丹甚至兽药的亲和度，以达到打药提升气血的效果，这类天赋才能变相增强武者基础气血。\n    众所周知，武者五大境，第一境：气血境。\n    气血境专练气血，提升气血值，分为三个阶段，练血，练骨，练脏。\n    其中，练血期最为重要，如果把气血境比作一个人从1气血走到7气血这7个等级，那么练血期圆满就是1到5的路途，5到6就是练骨期圆满，6到7自然就算练脏圆满。\n    这里是用寻常人来比喻，实际气血值和三个阶段达成的情况是看个人资质而异。\n    比如资质强的人，练血期圆满可以把气血推至6，练骨、练脏圆满以此类推，气血境圆满能推到10气血，这群资质强的人，练血圆满、练骨圆满、练脏圆满的气血值都比寻常人高多达1点。\n    人族多年来的经验，资质上下限差距不会超过3点气血值，最低7，最高10。\n    那么有人要问，有没有气血境推到10气血以上的？\n    有的，兄弟。\n    在三个阶段圆满以上，称为[极境]，人族可以通过各种手段在气血境最高推到10到13气血这段神鬼领域，看武者是否把三个阶段打磨到极限，而这3点气血，被称为极境之血。\n    通常来说天赋能力加持的气血，无法作用于境界圆满、极境。\n    但易凡偷取了0.6的气血，感觉自己的练血期实打实的走了一大步，气血沸腾，自己的资质测过了，就算最差的，练血期圆满就是5气血。\n    如果偷取的气血能用于境界，那他是否能凭借其突破极境？极境除了气血更高，还会有各种奇妙的效果！\n    想想就兴奋，他十分期待明天的技能抽取，以及杀妖偷气血！\n    晚上，官方公布了今天一模的资料和数据，包括考生总数、四区分布、四区妖兽投放种类和数量、目前的杀妖排名等等。\n    古越州的各个平台下，一模的讨论度炸翻了锅。\n    大家最关注的，实属排名。\n    【目前排名前一百的，和往常一样都是顶尖战队成员吧？】\n    【不对，有两个学生是以单杀2只妖兽上榜，马芸和李萧然，位列前十】\n    【前一百杀妖数量都在1.5只以上，今年竞争激烈！】\n    【经过妖血洗礼，今晚会有很多学生蜕变，从练血期圆满踏上练骨期，他们有的人气血将会与报考资料上的气血产生极大的变化，预估有学生最高会接近7气血，战局迷离，更难看清哪只是好股！】\n    【明天将会是猎妖狂潮，官方资料显示东区的6气血妖兽数量不多，后面只剩下7到10气血，这是完美设计啊，让尖子生们不得不越级对上妖兽】\n    【我看好马芸，她的无影脚进步有目共睹，踢死第2只影豹只用了1分钟，她的天赋被公开了，是S级[双腿互博]，两只脚能释放不同的武技，实力强劲】\n    【感觉...不如二中的李萧然，同为S级天赋，李萧然的[逍遥游]可是一种珍贵心境天赋，一萧一剑挥洒自如】\n    【感觉不如...杨沸】\n    【感觉不如...柳如烟】\n    【感觉不如...荣耀战队队长慕容清】\n    【有没有可能，你们说的学生在杀妖榜首殷无忌面前都是渣渣？白天他已经率队围猎了1只7气血妖兽！】\n    【相比这些莽夫，无归战队今天在西区设下了一个大陷阱，顺利的话，将会坑杀数十种妖兽，夺冠无虑】\n    【怎么都是考前预测的尖子生，今天没有黑马出现吗？】\n    【有几只黑马，但是在人族千万年积累的选拔机制选出的尖子生面前，不太够看】\n    【别吵了！明天自见分晓】\n    【还用等明天？今晚有几只战队去偷7气血妖兽了】\n    【什么情况！晚上人的感知削弱，而妖兽反而增强，这...风险是不是太大，而且别的战队以逸待劳，明天很容易就追赶上了呀】\n    东区一处水潭，五颜六色的众人站立周围。\n    黄发青年兴奋开口，“清姐，那只大鳄鱼真在水潭里面吗？”\n    “没错，刚才你们在吃饭的时候，我的超能感应察觉到这地方有两只妖兽在战斗，我果断催动天赋能力，仔细一看，发现是冷纹鳄和索姆豹在战斗，看它们战斗的威视，都属于8气血的妖兽。”\n    “两妖两败俱伤，索姆豹逃离这里，而冷纹鳄明确是潜入水潭中。”\n    蓝发御姐不紧不慢回答，紧闭地双眼说明她正在使用所谓的[超能感应]天赋。\n    “不愧是S级天赋，捡漏一只8气血残血鳄鱼，我们的评分必然再上一个台阶。”\n    如果易凡在这里，必然知道，这一行人正是荣耀战队5人：\n    蓝发长腿御姐是队长慕容清，人称清姐，S级天赋[超能感应]和前世蜘蛛侠的蜘蛛感应类似，能感应即将到来的危险或者机缘，十分神奇，再加上她擅长的弓箭武学，相辅相成难缠至极。\n    黑发青年是陈玄北，荣耀战队主T（第一坦克），A级天赋[自动格挡]遇到危险时自动触发最佳格挡防守，以前是练长枪的，现场改成练棍类武学，是一个难得的防御性武者。\n    紫发妩媚女生是柳如烟，处于辅助位置，A级天赋[歃血寄生]，给被种子寄生的人提供强大的生命力恢复（治疗）。\n    红发青年是仇升东，是队伍中的游走位，擅长毒术，A级天赋[草人]收到伤害可以使用一个替身草人留在原地，然后自己隐身瞬移到附近，草人可以触发大爆炸。\n    最后的黄发少年就是替代了易凡位置的叶知秋，战士位置，听说天赋是A级[冥炎]，修炼武学《焚寂剑》，威力惊人。\n    这是一个配置超高的战队阵容，都是万中无一的A级天赋以上，竭尽实验班3班的人才，除了柳如烟，她是实验1班，还是经易凡的关系加入的。\n    柳如烟甩了甩长鞭开口，“如今玄北哥和清姐双双踏入练骨期，6点多的气血，是时候拿更强的妖兽开刀了。”\n    “今晚大家打起精神来，只要拿下这只鳄鱼，到时候知秋、小仇、如烟都可以吸收它的血肉精华，突破练血期圆满，一起踏上练骨！”\n    陈玄北立在黑铁棍上笑道。\n    “8气血妖兽可不同反响，一个甩尾估计都把我们锤飞了，再加上黑夜加持，如果不是有慕容的情报在，我们也不敢觊觎它，就算如此，待会儿也免不了一场恶战！”\n    水潭中央，一块血肉散发浓烈腥味，血水散入水潭，他们正在用白天打到的血肉吸引它出来。\n    慕容清突然睁开丹凤眼，从背上取出一人高的弓，“来了！按原计划行事！”"},{"title":"第06章 荣耀战队首战8气血","order":6,"label":"06","text":"一阵阵涟漪散开，月光下，一团黑影从水潭浮起起，张开血盆大口吞向肉块。\n    荣耀战队众人纷纷跑动起来，仇升东腰间系了一条绳子，他跳入水潭中双手抱住血肉，大喊：“拉！”\n    叶知秋双臂肌肉贲张，猛地拉动绳子，把人和肉险之又险地被拖回岸边，冷纹鳄巨大的上下颚猛地合拢，发出“咔嚓”一声令人牙酸的巨响，竟是咬了个空！\n    看着血肉上的仇升东，到嘴的血食飞了，再加上白日的旧伤，彻底激怒了这头水域霸主！庞大的身躯猛地一摆冲向血肉，成功引诱上岸了！\n    众人这才看到，它背上一道道深邃爪痕，必然是索姆豹造成的伤势。\n    而在岸上，迎接它的是一根浑身漆黑的制式长棍，面对那如同高速列车般冲撞而来的巨兽，毫无惧色！陈玄北双脚猛地踩入地面，沉腰立马，手中那根漆黑的长棍爆发出淡金色光芒！\n    “自动格挡，开！”\n    长棍准确锁定冲击薄弱处，收到了最少压力，尽管如此，它足足有20米长的身躯，也顶着他往岸上冲出来近50米。\n    在场众人一惊，“嘶！好可怕的力量！8气血妖兽，恐怖如斯！”\n    眼看队友对上冷纹鳄，叶知秋不可能无动于衷，挥着泛红光的长剑斩向它的下颚，暂缓它冲锋的压力，及时救下陈玄北，让后者退后十米开外。\n    “可恶，它的鳞甲防御太高了，一招焚寂剑砍它下巴居然没破防！”\n    尽管冷纹鳄旧力刚尽、新力未生，但嗜血凶性以及受伤绝境，它仍然横扫一爪向这只胆敢砍它下颚的猴子，然而陈玄北卸除余劲，再度欺身上前，挡住爪击。\n    “它的背上鳞甲已被破防，我会重点关照哪些伤口，你们注意周旋拉扯，不要硬碰硬。”\n    慕容清率先挽弓射箭，因为它有伤在身，他们根本不需要考虑打它相对柔软的腹部、嘴巴和眼睛，只需往它背上灌伤害即可。\n    弓弦发出连续爆鸣，三连箭矢一前一后没入鳄鱼伤口，打得它生疼爆血。\n    冷纹鳄泛蓝的双眼不停转动，它可以清晰察觉到附近5只小虫子，前面三只，左侧一只，还有一只站在10米高的岩石上。\n    它锁定住了陈玄北，大口咬去，后者刚才单抗它的冲锋，浑身颤抖，只能侧闪躲避，不料它搏杀经验不差，紧接一记重爪夹攻，让他被迫持棍艰难顶住，棍上淡金色花纹闪烁，天赋自动格挡发动！\n    \"玄北哥撑住！\"几枚诡异的紫色种子飞入陈玄北背后，缓解他的疲态。暗中蛰伏的仇升东悄然摸上它的脊背。\n    慕容清一箭一箭不间断射向它背上流血的伤口。\n    吃痛下，压住陈玄北的重爪反而突然发力，把他狠狠拍陷入土里，不愧是嗜血妖兽，血性十足。\n    叶知秋凌空跃起，长剑燃起红色冥炎，剑光在鳄鱼前肢上擦出刺目火花，仅仅留下一道血痕，不足以救出陈玄北。\n    慕容清十分冷静，一箭接着一箭射中其伤口，妖血不断绽放像花一样，双方体型量级存在差距，她的攻击没有迅速生效，发动超能感应下，她预测出血伤口还需要30分钟才能影响其生命力。\n    “玄北！你怎么样了！还撑得住吗？”\n    爪下苦苦支撑的陈玄北，尽管有自动格挡加持，也被重压得虎口崩裂，浑身发麻，咬紧牙关回应：“我快撑不住了，你们加强进攻！”\n    慕容清闻言，蓄势待发，弓如满月，这次射向的，是它的眼睛！一支特制的破甲箭矢上流转着湛蓝色的气芒。\n    “嗖！”划过夜色。\n    然而，妖兽的危机直觉远超想象，冷纹鳄猛地一偏头，箭矢狠狠扎进了它脖子上，发出“铿”的一声，竟未能完全穿透！\n    同时，仇升东在其背上，肆无忌惮的绞杀原有伤口，如同犁地一般，遍地生花，各种毒瓶丢出，仿若伤口上撒盐。\n    “吼！”再次受创，冷纹鳄彻底疯狂，一记甩尾把陈玄北抽飞，挣扎着想要退回水潭！\n    “哼！想跑？”叶知秋冷笑一声，再次动了！他纵身跃起，手中长剑骤然爆发出最深邃的紫色的诡异火焰，那火焰并不炽热，反而散发着一种冰冷的、仿佛能焚烧灵魂的诡异气息！\n    正是其天赋冥炎，能直接作用于精神、灵魂的伤害，如果打个比喻，就像是LOL中的真实伤害，无法阻挡，无法防御！\n    “焚寂剑法——长日寂灭！！！”舍身地全力一击，重重刺入它的脑门！\n    紫色火焰，竟然如同幽灵一样穿过厚实鳞甲，直击到它脑袋里的妖核了！\n    冷纹鳄发出了前所未有的痛苦咆哮，庞大的身躯剧烈地翻滚抽搐，仿佛正在承受来自内部的灼烧！\n    仇升东见状直接释放天赋草人，从它的背上溜走。\n    叶知秋力竭从空中掉落，就要被它压扁之际，一根长鞭及时赶来把他拉到远处。\n    《白蟒青蛇》是柳如烟所学的一门进退自如的鞭法，与易凡的《非凡剑法》一样，能攻能守，十分灵活。\n    刚才那长鞭就是她觑准时机所使，让叶知秋力竭之后无虑脱离战团。\n    以往这种情形往往是柳如烟与易凡相互配合的，如今物是人非，但却没有影响到荣耀五个人的整体节奏。\n    冷纹鳄妖核中，仅剩下的一丝本命妖力不自主地释放出来，一口怒寒口气，把周围地面雨水全都冰封。\n    它得名冷纹，是因为可以释放霜寒吐息，冻住水面，困锁猎物，在与索姆豹的争斗中，妖力消耗殆尽，这才在刚才的战斗中没有发挥很强的攻击性。\n    如今冥炎袭击妖核，使它被迫用出这最后一丝妖力，妖力枯竭，它的生命力会大减！\n    如今它只想冰住这些虫子，然后滚回水潭养伤，留得青山在，不怕没柴烧，翻滚着向水潭而去。\n    慕容清见场上情况，陈玄北伤重，叶知秋力竭，如今只有她和小仇有战斗力。\n    “小仇，引爆草人！”\n    随后也奔袭上前，同时弯弓射箭，力求造成更多出血伤害。\n    仇升东眼看自己草人被裹在它冒血伤口处，直接引爆！在其伤口炸出一个圆形肉洞。\n    最后，冷纹鳄还是逃入了水潭中，弥漫的血气和寒霜使水潭上结起了一层血红冰面。\n    柳如烟从身后走出，“清姐，那只畜生呢？成功了吗？”\n    慕容清发动超能感应，瞬间睁开眼睛，平日冷静的声音此时也有了一些激动。\n    “成了！它本就是强弩之末，又燃烧了最后的妖力，最后被我和小仇补上伤害，我的超能感应得知，它在半个小时后就会真正死去，到时妖躯就会浮上水面。”\n    “我们原地整理伤势，静等即可！玄北、知秋、如烟、小仇，辛苦了！”\n    荣耀战队直播间，已经很晚了，但观众欢呼雀跃，好不热闹。\n    【精彩绝伦的配合】\n    【信息、防御、输出、奶全都到位，好全面的战队】\n    【最重要的是还能磕叶知秋和柳如烟的CP】\n    【磕你个头，不如陈玄北和慕容清的CP感足】\n    【今年首个战胜8气血妖兽的战队，牛波一】\n    【我就说把易凡踢了没毛病，有他在，绝对打不死冷纹鳄】\n    五颜六色的众人，稍显狼狈，相视而笑。\n    “我们，是最正确的5人！”\n    柳如烟看着眼前意气风发的队友，心想：“易凡，换做是你，你能做到如此吗？”\n    “冥炎直击妖核，对妖兽实在是一个大杀器，叶知秋在某些时候怕是不比那些S级攻击类天赋的尖子生差。”\n    “不论为了是我的未来，还是荣耀的未来，易凡，你都只能是淘汰者！”"},{"title":"第07章 第三日，无情铁手","order":7,"label":"07","text":"一夜清风凉到梦。\n    另一边。\n    岩洞之外，雨后的风呜咽着穿过岩柱，带起一阵浸骨的凉意。\n    洞内，易凡坐在角落里，休息得并不安稳。\n    “哈秋...咪！”\n    一个响亮的喷嚏打破了寂静\n    易凡揉了揉面庞，“不是吧！没淋雨也会感冒吗？这荒野的寒气，果然厉害。”\n    他赶紧吃了两口龙眼压压惊，将晶莹剔透的果肉塞入口中，甘甜的汁液顺着喉咙滑下，一股暖意渐渐从胃部向四肢百骸蔓延，这才感觉舒服了些。\n    用昨日收集的雨水清洗一番，整理战衣。\n    接着，他走到岩洞内侧，面朝正东方向——那是每日太阳初升，紫气东来的方位。他小心地将几块表面相对平整的岩石垒砌起来，形成一个简易而稳固的石台，权当是祭台或是香案。\n    头顶无声浮在空中的无人机，默默给直播推流。\n    直播间内，在线人数稀稀拉拉，似乎也只有几个习惯早起的中年人或彻夜未眠的夜猫子。\n    【这小子在干嘛，在这么危险的野外也如此讲究！一模最后一天，别人怕是早就磨刀霍霍，他倒好，他还在这里搞来搞去】\n    【该说不说，这小子收拾干净了还挺帅的，棱角分明，眼神也亮，正中老娘审美！】\n    【楼上的别花痴了，高考看的是实力和积分，光帅能当饭吃吗？】\n    随后易凡朝着桌台跪拜在地，默念有词：\n    “青天在上！”一拜。\n    “黄天在上！”再拜。\n    “苍天在上！”三拜。\n    “圣人在上！”四拜。\n    “无量天尊！”五拜。\n    “阿弥陀佛！”六拜。\n    【？？？】\n    一连串的问号瞬间刷屏。\n    【好家伙，我直接好家伙！这是个什么路数？拜天拜地拜圣人拜道祖拜佛祖？】\n    【还是个迷信的家伙儿！临时抱佛脚也没这么抱的吧？这求保佑的范围是不是太广了点？】\n    【笑死，咋不拜一下传下武道、开启新纪元的武祖他老人家呢？那才是正根啊！】\n    易凡脑中默念，“窃法巧手！发动！”\n    这一次，他不会再大意了。\n    星光溢彩中，卡牌谜面列出：\n\t[技能]：被动：获得护甲穿透。主动：使用者用斧头进行勾拽，造成拖拽、击飞和持续1秒的减速。\n    看完题面，易凡心中了然，诺手狗的无情铁手，这个技能是个LOL玩家都熟，又有穿透，又能把人拉回来，还有关键词“斧头”，一下子就定位到诺手的E技能了。\n    然后在前世各种梗视频的洗脑下（主要是余小C的“下饭”操作集锦），首先排除有情铁手和机械飞爪，是个人都知道诺手的E技能叫无情铁手。\n    在卡牌填入[无情铁手]。\n    提交！\n    滴哩哩哩滴哩哩哩噔哒~\n    √\n    “获得无情铁手技能！”\n    易凡扶额沉思，脑海中再次回响他的天赋能力描述。\n    [星灵祝福——窃法巧手]\n    第一个效果：暮光星灵每天会和你玩一个抽奖答题游戏...\n    第二个效果：有被动技能和终极技能保底...\n    诶，重点来了，第三个效果：你每拥有1个终极技能，就获得1个法术星云，所有获得的普通技能将汇入星云，并融合成一个以终极技能为底座的独特技能，每个法术星云每天可使用1次。\n    也就是说，他选取的多个技能并非独立存在，而是会以终极技能为核心，融合成一个全新的、独特的复合技能。\n    但限制也同样明显，由于每天只能使用1次，他的持续战斗能力很差，这也是他没有出洞去杀妖的原因。\n    “那么，已经选择了轮回绝境作为底座，其效果是强行拉人进入‘死者领域’单挑。”\n    “现在再加入无情铁手，融合起来，会诞生出什么样的技能形态？”\n    易凡思维飞速运转，“是在展开轮回绝境的同时，直接附带一次无形的巨斧勾拽，将对手强行拉到面前接敌？还是在死者领域之内，我可以额外主动使用一次无情铁手，把对手拉近？”\n    无论哪种，听起来都很抽象，用斧头勾人什么的，太逊了，正常人都是用来砍的。\n    易凡思考着。\n    无情铁手则是一个十分“数值”的技能，LOL中诺手狗的5个技能，全是数值技能，被动是巨量攻击力，Q大杀四方是巨量回复，W致残打击是巨量减速和爆伤，E无情铁手是巨量护甲穿透，R诺克萨斯断头台是巨量真实伤害！可以说诺手的技能都十分适合他之前拿的轮回绝境。\n    偷取属性，然后通过无情铁手的巨量护甲穿透削弱对手防御，打出巨量伤害，形成良性循环。\n    而且技能上面描述的“被动”，是不是意味着有机会在不使用法术星云的情况，常态拥有这些护甲穿透呢？\n    要知道诺手的E技能的护甲穿透的效果可以比拟装备中的大穿甲，相当于买护甲穿透送一个勾子控制！\n    “融合，无情铁手！”\n    星光流转，易凡浑身舒畅，直发哆嗦。\n    【他咋了，怎么一抖一抖的，不会在...？】\n    【无敌了，怪不得背向镜头】\n    易凡脑海中，嬉笑声音传来，“融合成功~”\n    [法术星云1——轮回绝境]\n    被动：获得40%护甲穿透\n    主动：你将自身和一个敌人放逐至死者领域7秒，并在期间内偷取该英雄10%的核心属性。\n    如果你在死者领域中杀死了该敌人，那么你会吞噬目标的灵魂，保留你所偷取的属性，死者领域中的战斗不会在现实留下痕迹。\n    （核心属性包含：气血、速度、防御力、精神力）\n    “竟然直接把主动效果吞了，只留个被动护甲穿透。”\n    易凡回过神来。\n    “难道是因为技能形态问题，没办法很好地融合？”\n    “不过，仅仅是40%的护甲穿透就很香了。”\n    他仔细体察自身，经过一夜的休息，以及那几颗气血龙眼果肉的能量蕴养，他能清晰地感觉到，自己的气血之力比之昨天又浑厚了不少。意念微动，感知气血应该有4.1的程度了，比之昨天足足增长了超过1点！\n    这是过去数年按部就班修炼都难以企及的恐怖增长速度！\n    “怪不得前人经常感叹，妖兽既是危机，也是移动的宝库。”\n    易凡感慨。\n    “食其肉，淬其血，炼其骨，便能助长气血，强化己身！这条武道之路，本就充满了掠夺与进化。”\n    不再犹豫，他收拾好物品，推开洞口岩石，远边天际——\n    云开，日出！"},{"title":"第08章 细肢螂的卸力","order":8,"label":"08","text":"今天到明天早上6点，是最后的时限，绝大多数人都会和往年一样，通宵作战，争取在6点前拿到更多分数。\n\t易凡的想法也是如此，昨天杀一只妖，今天再杀一只，随后以逸待劳，等到晚上0点，窃法巧手和法术星云冷却同时刷新，再杀一只，凑够三次，收益拉满。\n\t就在刚刚他四处寻找妖兽，发现方圆几里内都无妖兽踪迹，说明南区投放的妖兽确实毕竟少，这是要让选择这里的学生寻找它们，也算是一种变相考研速度的方式。\n\t毕竟速度不够快，只能在速度型妖兽后面吃屁，更别提桂仁鸟这种飞行妖兽，只要它不想，很难碰到它。\n\t现在他重新返回岩洞老地方，收拾一下行李，主要是十几公斤龙眼，然后准备往巨岩岛中部走，按照经验肯定是越往里越多妖兽的。\n\t【日上三竿了才出门，怪不得你找不到妖兽，你挑的嘛】\n\t【毕竟只是一个被战队淘汰的学生，能做到这个地步已经很难得了】\n\t【南区尖子生都往中部山区走了，马芸和李萧然他们在山上找到了一个山洞，似乎有前人武学传承的线索】\n\t【武道发展这么多年，所谓武学传承感觉都不如当代那些出名的武学（天级武学除外），重点还是评分，如果找到先人遗物，必然获得探索分】\n\t【巨岩岛战役最后就是在一道天级掌法轰掣下，所有战斗痕迹都被抹去，仅有一些藏在石头缝里的东西保留下来，多年过去，不知道还剩多少？】\n\t【人族数百年来重新踏上此地，是时候揭晓了】\n\t易凡一路奔袭，路上无一妖兽，倒是见到几处战斗痕迹以及腐烂血肉。\n\t“这些痕迹...似乎他们都往前方的山峰走，只能往那边走了。”\n\t“真是望山跑死马，狂奔了2小时，才刚刚看到山脚，好在...终于看到你们这些畜生了！”\n\t就在易凡驻足观望时，一阵腥风背后袭来，得益于击逆剑这招半步完美，他的感知超乎常人，就在刚刚察觉到了暗处的杀气，果断回首一剑盲砍。\n\t“斩！”\n\t巨大的力道，和袭来的金毛犬一般大小的节肢妖兽相互冲击，易凡瞳孔骤然收缩——这畜生竟然还能突然加速！剑刃接触妖兽漆黑的前爪的瞬间，竟然诡异地滑向顺爪方向，导致易凡感觉自己的力道被对方卸去，反而胸口被它划过一道血痕，红绿黄三色相间的制服撕裂，露出身躯。\n\t易凡闷哼一声，在山岩上连踏三步，每一步都把脚下碎岩踩成砾石。\n\t“该死！是细肢螂，而且这力道，不只6气血！”\n\t错眼一看，才看清它，身躯覆盖着青黑色骨甲，关节处生长着倒刺，双爪尾端竟是柄骨质镰刀！\n\t它的左爪上，挂着一缕衣物，甲壳上粘连着红色的血肉和组织，似乎...杀过人！\n\t【惨了，他遇到了细肢螂，而且它战过一个B级天赋5气血的学生，那个学生不慎被它的双爪钳住，撕成两半！十分残忍】\n\t【你们有所不知，练血期武者杀妖，经历妖血洗礼，吞噬其血肉，借其气血突破至练骨期，反之，杀过人，噬过血的妖兽幼崽，也会激发自身潜力，成长加快，这就是人妖势不两立的一大原因】\n\t【老登你在卖弄什么，这不是十大名著之一的《进化论》内容吗，随便路过的一条小学鸡都懂！】\n\t【放心吧，他死不了】\n\t【何出此言？即使让叶知秋来，也未必能正面击杀这只细肢螂，要知道它可以速度型妖兽，哪怕跑路都很难被追上】\n\t【看下去就知道了，本人已经看穿易凡的跟脚】\n\t这只细肢螂的气血，怕是接近6.7了，这不是最可怕的，怕的是它与人类战斗过，似乎对人类的攻击方式有一些了解，从刚刚把他斩的那一剑撇开卸力的诡异力量，是它从上次战斗中获得的妖力使用技巧进化吗？\n\t不等他仔细思考对策，细肢螂四脚一蹬，再次攻来，不给任何喘息机会。\n\t好在易凡轮回绝境偷取了桂仁鸟的一层速度，一剑一击都能跟上其攻击频率，勉强在其攻势下抗衡。\n\t由于它诡异的卸力技巧，易凡刚刚获得的护甲穿透属性没有发挥效果，相当于对战一个自带半反击风暴（武器E技能）的螳螂，十分憋屈，以易凡如今的力量，根本无法冲破它的技巧，把伤害切实落到它的身上。\n\t易凡身上的伤痕渐渐多了起来，如同细刀慢炖，细肢螂也发现这个该死的人类竟然能跟上自己的攻击速度，往往在最后一刻用剑挡住，要不就是砍向自己的脑袋，自己还没有到能用脑袋卸力的程度。\n\t自己没法利用速度和锋利的双爪直接抓死这个人，转而采用迂回战术，每次进攻和防守都使用力道很小但很快的攻击偷取一些便宜。\n\t易凡一边战斗，一边吞下龙眼果肉，要知道他一晚上通过龙眼蕴养\t气血，如今4.1气血，在熟练贯通的武技和举轻若重境界的加持下，越两级对战也不能坚持太久，好在他可以吃龙眼稍微补充消耗。\n\t“周围不少桂仁鸟的叫声，还有未知野兽的吼叫，再拖延下去，说不定腹背受敌，或者被坐收渔利了。”\n\t现在双方势均力敌，按平常来说他直接使用法术星云，偷取1层属性，在妖兽攻来的时刻，一道泰若斩，必然可以砍死它。\n\t但这只妖兽有卸力技巧，他现在没有把握能对其灌上全部伤害，如果一击失败，他也许就没有机会在7秒内把它打死，从而浪费今天的发育机会。\n\t“在这样下去要准备夺路逃生了，多狼狈呀。”\n\t“我的超级大脑，我命令你，想个办法吧！”\n\t石人族著名智者墨菲特说过：任何可能出错的事情最终都会出错。\n\t一声低沉吼叫，一只浑身黯淡无光的豹子窜出，獠牙直指易凡空挡背后。\n\t易凡听到吼声，暗道不好。\n\t“该死，果然有第三者！”\n\t恰巧选在自己与细肢螂对招之后，卡着攻击间隙偷袭，这只影豹狠毒，腹背受敌，自己绝对无法招架，只能使用轮回绝境了吗？\n\t只能在它们两中选择一只关进去单挑，打死后以全胜姿态再战另一只，才有机会活下去！\n\t电光石火间，易凡已做出决断，法术星云蓄势待发。\n\t“但愿如此...召唤师”\n\t“轮！回！幺”\n\t就在他快要发动技能时，人未至声先到，一声揶揄人声传来。\n\t“诶，盆油，你滴身后哥哥在呢！”\n\t一个身穿黑白制服的青年跳出，只见他拧腰、送肩、出拳，动作一气呵成，拳头如同出膛的炮弹，裹挟着凌厉的劲风，后发先至，重重地锤击在影豹的腰腹之间！\n\t直接把它锤出去十几米，得势不饶人，青年再赞拳追击黑豹。\n\t易凡看着来人的拳势，这是八极拳！\n\t一旁的细肢螂看的目瞪口呆，还没反应过来这是什么展开。\n\t细肢螂眼看情势复杂，准备脚底抹油——开溜，四脚一蹦跳出去十几米。\n\t易凡也管不了新来的人什么情况了，打了半天，这细肢螂居然要跑路，它有卸力两人才战得势均力敌，若它一心逃跑，心神分散，正是动用轮回绝境的绝佳时机！\n\t在那种猝不及防的领域转换和属性偷取下，必有极大把握将其留下！\n\t“哼，想逃？没石掷！”\n\t同样的飞剑+轮回绝境连招，易凡手腕一抖，长剑脱手而出，化作一道寒光射向细肢螂的后心，同时，左手那原本针对影豹的法术星云骤然转向，锁定了那只奔逃的青黑色身影！\n\t感知飞剑袭来，细肢螂小脸歪下的嘴角也是和昨日的桂仁鸟同样的不屑神情。\n\t这种远程攻击，对它这种速度见长、且掌握了卸力技巧的妖兽而言，威胁不大。\n\t只想腾挪奔袭跑路的它，赫然发现周围景色的变幻变得慢了下来，这是什么情况！\n\t它复眼中的“不屑”瞬间被巨大的惊骇取代！\n\t它再想举爪使出卸力护体时，已经是来不及了。\n\t飞剑，枭首！\n\t飞起的脑袋，大大的复眼迷惑，它想不通为何躲不开那把剑，明明它速度无双。\n\t它想不通为何自己身体在剑飞来的一瞬间莫名消失了一层速度，让它来不及使用卸力。\n\t它想不通为何这把剑如此锐利，从头到尾只是第一次直接伤害，就要了它的命。\n\t早知，就不急着跑了，早知就先挡住这把剑了！\n\t落地的脑袋，死不瞑目！\n\t（冷知识：复眼确实没有眼皮）"},{"title":"第09章 林焱登场","order":9,"label":"09","text":"影豹，具有隐匿能力的妖兽，从来都是它偷袭别人。\n\t不料今天螳螂捕蝉黄雀在后，被人偷袭，它们本来就不是以防御见长，林焱的一下重拳差点把它打成重伤，肋骨都快干出来。\n\t面对乘胜追击的林焱，不一会儿就嗝屁了。\n\t待林焱拎着影豹的妖躯回到刚才交战处，只看见易凡浑身伤痕，气喘吁吁坐在原地调息，还一边往嘴里塞龙眼果肉，地上不见细肢螂。\n\t“看来是让那畜生给逃了。”林焱心中暗道，倒也并不意外。\n\t细肢螂速度本就极快，又滑溜异常，易凡能在其偷袭和后续缠斗中保住性命，已属不易。\n\t易凡察觉到来人，嘶着嘴站起来抱拳行礼。\n\t“多谢兄弟舍命相救，不然我今日不说继续一模考试了，怕是连命都要葬送在这两头畜生上。兄弟叫什么名字，等下次碰面我一定好好感谢！”\n\t林焱见势丢下影豹，上前关照，“诶，我叫林焱，三中普通学生一枚，你看你真是太性情了，你都叫我兄弟了，咱两还客气啥，赶紧拿这块前腿来恢复身体气血。”\n\t林焱一手掰下影豹的前腿，递给易凡。\n\t“这使不得，使不得啊，这只影豹是你独立击杀，中学生无功不受禄。”易凡连忙摆手。\n\t“见外了吧不是，你不拿就是看不起我这个兄弟！”\n\t“行吧，刚好我这里有一些桂仁鸟的龙眼果肉，还挺新鲜的，林兄弟你尝尝！”\n\t两人寻了个岩洞，起火，补给。\n\t一番推杯换盏，不知道人都以为他们俩是多年好友。\n\t“林兄弟，我看南区打斗迹象，你们好像都往前面的山峰行进，所以我才一路跟过来，不料遇到那只细肢螂，害得我差些殒命。恕我冒昧，想问问萧兄弟，你们上山是做啥？”\n\t“据说一中尖子生马芸和我们二中的李萧然李公子在山上发现了宝藏，所以大伙儿都过来凑凑热闹，看看有没有探索分加一加。”\n\t“你不说我还不记得还有探索分这回事，这两天我躲在山洞，好不容易捡到一只残血桂仁鸟，这才活到现在，不比你们，竟能杀的外围的妖兽都绝迹了。”\n\t“易兄好运气，你不知道桂仁鸟很难打死，这次一模，我还没见过有人能打死一只桂仁鸟的，这龙眼果肉真甜啊！”\n\t“易兄你就留在这里恢复吧，我还要往前跟上他们。”\n\t“行。”\n\t林焱拿起行李，基本都是妖兽血肉，还有易凡赠送的五公斤龙眼，往山上跑去。\n\t易凡大口吃着烤肉，眯着眼睛看他背影。\n\t两人心中同时浮现，“这人有点东西。”\n\t【md，这两个貂毛怎么这么能装】\n\t【一个F级天赋，一个C级天赋，结果都能在南区单杀妖兽，还要装作软弱书生】\n\t【看着易凡小子打死细肢螂后马上抛尸的动作，生怕别人知道他能单杀妖兽，幸好有直播间大伙儿可以看到他的小心思，这就是上帝视角的爽感，哈哈哈】\n\t【从林焱直播间过来的，这个家伙在旁边猫半天了，就是不早出来帮忙，等影豹偷袭才出手，真是腹黑呀】\n\t【你们看，他又是一发飞剑，然后妖兽就待在原地等死，真有隐藏的天赋技能吧，肯定不是F级就对了】\n\t【你们别说，这两个人还挺像的，都是天赋低级，然后武技超群，一个看起来是非凡剑法半步完美无瑕，一个是八极拳熟练贯通，然后靠自己杀妖饮血，如今他们的气血应该都练血期圆满了吧，都是黑马选手呀】\n\t【必须练血期圆满了，不然不可能越两点气血抗衡那只杀过人的细肢螂的】\n\t【年轻人在外有点戒心是正常，好在结果是对的，大家合力打死了两只妖兽】\n\t教育司中，一模观战台上，一群评分老师忙得不亦乐乎。\n\t一位头发雪白，但精神矍铄、目光如电的老者，正负手站在主屏幕前，“恰好”看到了林焱与易凡合作击杀妖兽、分道扬镳的一幕。他指着屏幕，对身旁的记录员吩咐道：“传下去，刚刚林焱和易凡合作打死两只妖兽，根据表现，给林焱记1.5只击杀分，给易凡记0.5只。”\n\t记录员愣了一下，有些迟疑：“这...顾老，根据画面和能量残留分析，那只细肢螂似乎是易凡独立击杀的...而且网上流传他被荣耀踢除，再这样对待他的话，怕是有人会带节奏。”\n\t被称为顾老的白发老者瞥了记录员一眼，语气平淡却带着不容置疑的威严：“如果不是林焱出手帮忙，易凡能在被影豹偷袭的情况下存货下来么？”\n\t“再者，你看不出易凡他在藏拙，既然他喜欢藏，我们帮他藏。反过来，林焱此番表现，有潜龙腾渊之势，适当倾斜资源关注，合乎规矩。我这么做，绝对不是因为我个人看好林焱那小子，而是出于对考生长远发展的综合考虑，明白了吗？”\n\t记录员立刻站直身体：“是！明白了，顾老！”连忙低头记录。\n\t确认林焱走远后，易凡回到案发现场，从碎石堆里挖出了细肢螂的前肢大爪子，它的血肉稀少，食用后效用也不高，其精华在于它的骨质前肢，研磨成粉，可用于练骨期冲刺！\n\t看着山雾缭绕的孤峰，踏步向前。\n\t易凡感受体内气血变化，偷取细肢螂0.7（0.67四舍五入）气血，他的气血如今肯定是超过4.8。\n\t再加上吞食的两条影豹前腿，体内源源不断的力量涌起，身上的伤势恢复如初。\n\t他感觉，今晚就能达到练血期圆满！随即又嚼了两颗龙眼果肉。\n\t炼血期，说的是“血”，但它只是个统称，其实在18岁未觉醒天赋之前，练的是全身筋肉、鼓皮、气息、血脏，筑造体魄根基。\n\t当根基凝练，气血接近炼血期圆满时，那些尖子生就会打磨自身体魄，提前蕴养颈骨、腑脏。\n\t比如慕容清等人，以他们的资质，炼血期圆满足以达到5.8、5.9接近6，但是他们在5气血时，就不会注重气血值的增长，把时间留在武学、武道见识的成长上。\n\t等到面对妖兽，啖其肉饮其血，借妖之力把炼血期最后一段路走通，汰换劣血、旧血，在一模期间短短两三天内，增长1点气血，进步飞快，这一操作被称为“冲刺”。\n\t而像易凡这样，在一模前都没能把气血练到接近圆满，炼血期极限气血是5，但自身还只有3气血，其实不应该贪功冒进吸收妖兽血肉进行冲刺。\n\t因为妖兽血肉能促进的气血是有限的，最多就1点而已，当武者3气血就用掉了这1气血的提升，就算他到达4气血后，剩下从4到5气血这段路，反而更难走了。\n\t模拟高考除了有评分、名次奖励、资源赞助等好处，最大的作用就是给学生杀妖练血冲刺！\n\t反过来讲，这次一模，4气血以下的学生是没有实力、没有资格拿到这份好处的，他们的机会是在二模。\n\t但是易凡除外，因为他偷取的1.3气血，竟然是实打实体魄根基，相当于他是在4.4气血时使用妖兽血肉提升，所以妖兽血肉足够把他顶到5气血，达到练血期圆满。\n\t而到了练血期圆满后，普通妖兽的血肉不会再发挥作用，不能再从其身上获得气血提升，想踏入极境，只能走通天路！\n\t目前大众武者知道的踏入练血期极境的通天路有三种：\n\t1、使用神灵或帝妖级别存在的珍贵心血洗礼己身；\n\t2、将某一门锻体类武学修炼至超凡入圣的至高境界；\n\t3、身负某种独特的天生体质，并通过海量、无尽的练血期资源堆积，硬生生“孵化”出极境！\n\t至于还有没有其他通天路，众说纷纭，有人说世家大族、宗门老怪、赫赫权贵，他们藏有通天路；也有人说根本没有其他通天路，全都是尝试突破极境失败的陨落天才的一厢情愿。\n\t所以易凡通过轮回绝境偷取到的属性能不能支撑他突破极境？\n\t过了今晚，即刻揭晓。\n\t（这不废话嘛，肯定能啊）"},{"title":"第10章 迷路的山顶观光客","order":10,"label":"10","text":"月桂市中学论坛，一模资讯哗啦啦刷屏，看起来很像标题党。\n\t《震惊！殷无忌累计杀妖突破100只，杀戮机器实至名归》\n\t《三大校花均排名前十，彰显女性力量》\n\t《芸萧、清玄、秋烟，三对CP，好磕爱磕》\n\t《少年毒王，理性分析为何一模状元是二中校花莫愁》\n\t《坑杀无数妖兽，惊现至尊骨》\n\t《S级天赋并非无解，A级序列仍有高手》\n\t《10气血准成年期妖兽出世，尖子生战队遭遇滑铁卢》\n\t《神秘水潭下惊现上古传承线索，多方争夺》\n\t《神秘山洞中发现完整传承石刻，价值连城》\n\t《男酷女御，智勇双全，荣耀fens集合》\n\t《超绝体育生，耐力惊人！从南区孤身穿越至北区，成为唯一跨区选手》\n\t易凡自然看不到论坛上的喧嚣。他正在浓密的山雾中全力奔袭，身形如风。\n\t他突然发现轮回绝境偷取的属性中，除了气血外，速度好像也很超模啊！\n\t偷取了两次速度型妖兽的速度属性，现在他可能是速度最快的学生之一了吧，不论是长途赶路，还是短距离躲闪。\n\t为什么他会这样觉得？\n\t之所以有此判断，因为刚才的路上，他曾数次遭遇影豹和细肢螂的伏击，这些狡猾的妖兽藏匿于雾中，发动攻击时如同鬼魅。\n\t然而，在易凡如今超强的感知（源自半步完美的击逆剑）和骤然提升的恐怖速度下，它们的扑击往往落空。易凡甚至无需与之缠斗，只需脚下发力，几个闪烁便能将它们远远甩在身后，留下那些妖兽在原地不甘地嘶吼。\n\t山雾遮蔽，看不清参照物，导致他貌似比预想中前进了更多的距离。\n\t他还在山峰上没错，但他不知道的是，他已经跑到山北面去了，按照地界划分，这里属于北区。\n\t“奇怪，这么半个小时了，没有再碰上影豹和细肢螂了，难道越往山上走，妖兽越少？”\n\t“算了，继续往上走吧，直到走出这团山雾或者找到其他学生为止，以自己现在的速度，遇到妖兽也能安然跑路，离0点还剩下5个小时，就当溜达散步了。”\n\t【这呆子，还没发现自己走岔路了哈啊哈哈】\n\t【只缘身在此山中...】\n\t【说他傻，他又能在救命恩人面前耍心机，说他聪明，他又能跑迷路，越走越错，不撞北墙不回头】\n\t【最绝的是，看官方路观图，这山峰从南面上去就只能停在绝壁之前，但是从北面是可以上山顶的，但是途中没有任何妖兽，只有官方在山顶上投放了一只准成年期石妖，期待他看到它的时候是什么表情】\n\t【四个区分别投放了一只准成年期妖兽，东区的墨蛟已经被战队们当boss围起来了，西区的天竺嫂差点把所有考生团灭了，南区的金雕把李少和马芸一行人堵在山洞中，北区的石妖也要被激活，躲这边偏僻，正常学生都不会浪费时间到没有妖兽踪迹的地方探索，就这个呆子...真是冥冥中自有定数】\n\t易凡看着渐渐稀薄的雾气，隐约可以看到天空血红的月光，感叹终于走出头了。\n\t他又在雾中走了两个小时，才到这山顶区域。\n\t本来走了一个小时的时候，他就察觉不对劲了，不可能要这么长时间的，而且一路上都没有妖兽，连战斗痕迹都没有，更是不同寻常。\n\t但是他一想他都走了这么久了，如果放弃了，那原路返回又浪费一个小时，等于浪费了两个小时，说是散步，真成散步了，沉没成本不小，使他不得不硬着头皮往前走。\n\t（冷知识：沉没成本效应，指因已投入的时间、金钱等不可回收资源而坚持非理性行为的现象）\n\t易凡又走了几步，终于是豁然开朗，清风徐来。\n\t他站在一片平坦开阔的山顶岩石平台上，放眼望去，空无一物。\n\t“不是，不要逗我吧，我到山顶了？怎么没见到人，上面也没东西啊！”\n\t幸好前面还有一个两层楼高的小一些的平顶。\n\t易凡恍然，“哦，喜欢藏是吧，肯定是这个平顶上面。”\n\t易凡运剑在平顶山体上刻下几道口子，继续凭借着的这些口子，攀岩往上。\n\t【666，就这还不放弃，还要走，真是不见棺材不落泪】\n\t【可别最后上去被石妖吓死了哈哈哈】\n\t结果到了平顶上面，还是无一活物，只有一个两米高的石墩子立在平顶悬崖边上，像极了一尊大号的无字碑。\n\t似乎是海拔太高了，平顶上还传来一阵阵闷雷声响——“砰砰砰”。\n\t易凡悬着的心终于死掉了，一前一后浪费了四个小时，就为了上山顶吹风看风景，纯纯来旅游的。\n\t不过来都来，这块石头又这么平整，不如效仿大圣，写个到此一游吧。\n\t念此，易凡提剑在石墩子上刻画起来。\n\t“妈蛋，这石墩子怎么这么硬...我的剑都不能在上面留痕的？”\n\t“接我~泰若斩！”\n\t在他头上，官方直播录像的隐形无人机，已经悄悄飞到石墩子另一边。\n\t直播间中，观众看着石墩子一双小短腿在悬崖边上摇着摇着，双手在胸前一拍接着一拍地鼓掌，就像一个无忧无虑的少年看着山下的蚂蚁大战一样，萌感十足。\n\t【该说不说，虽然妖是人类的死对头，但这个石妖真的好萌啊】\n\t【没事姐妹，石妖是少数不会主动攻击人族，不会吞噬人类的妖种，在妖兽中属于保守派，我们不必抱着敌意看它】\n\t【是嘛是嘛，那可以养一只吗？】\n\t【可能...有点...难】\n\t石妖感觉好像有什么东西在给自己挠痒痒，起初它还不在意，后面挠痒的力道越来越重，让他十分舒适。\n\t【哈哈哈哈，真他么逗，看他挥剑的笔画，应该是想写“易凡到此一游”】\n\t【甚至石妖都被他的剑挠得出舒服的表情了】\n\t【乱涂乱画，真没素质！】\n\t另一边，易凡看着毫无痕迹的石头，不信邪的他，运足气血，使出没石掷。\n\t泰若斩毕竟是斩击，没法对竖起来的石头的发挥最大作用力，而没石掷这种以点破面的刺击，能发挥的效果更好一些，何况它名为“没石”，对石头有特攻也挺合理吧！\n\t不负众望，飞剑虽然还是被石墩子弹开，但在其上面留下了小小一竖的裂口，小到就像人的指甲陷进皮里，一个似乎随时会消失的小小坑。\n\t石妖察觉到一丝不适，单手往背后一抓，没有碰到东西，起身，转身。\n\t易凡正低头捡长剑，一抬头就惊恐地发现，他么怎么石墩子还会动的，原来自己一直在“打”的是一只石妖吗？！\n\t【哈哈哈感觉这一慕可以入选一模十大整蛊时刻】\n\t【+1】\n\t一人一妖面面相觑，真正思考对方的来路。\n\t终究还是易凡反应快了一拍，赶紧把长剑往身后一藏，连连摆手，似乎在说，“你好，我是路过的。”\n\t石妖也反应过来了，刚刚的挠痒是眼前这个人用剑在打它，虽然它们不会主动攻击人，性情也温和，但是被人攻击了，也不可能坐以待毙吧。\n\t易凡不小心触发了它属于妖兽的底层逻辑：被打就会挨打，挨打就会（可能）受伤，受伤就会死掉，不想死就要还手！\n\t十分合理，逻辑闭环。\n\t只见它一挥手，左边的石头胳膊就化作一枚炮弹轰向易凡。\n\t易凡早有警惕，往左一窜，堪堪躲过石头炮的正面打击，却被它和地面接触产生的爆炸冲击力轰飞了十几米，还差几步就要落下山崖了。\n\t“好快的攻击速度，再加上之前显露出来的防御力，要知道我可是有40%护甲穿透的，居然都无法破防它，这只妖兽不简单！”\n\t“不过它攻击一次就少一只手脚？是不是意味着我躲过四次攻击就可以把他磨死了！”\n\t易凡站起身来，虽然身躯被爆碎开来的碎片割破皮肤，血沾染了制服，但这种攻击，抗四次似乎努努力也可以做到。\n\t石妖看着他还能站起来的，双足一顿，一边身子一甩，易凡赫然看见，被它胳膊爆成一个大坑的地方，它完好无损的胳膊像被磁铁吸引一样，飞回了它的身上，令人绝望。\n\t易凡瞪大了眼睛，千言万语最终只化作一句哀嚎：\n\t“这...我...凎啊！”"},{"title":"第11章 准成年期石妖","order":11,"label":"11","text":"离0点还剩两个小时。\n\t站在悬崖旁边，身后是千米高的深渊，身前退路被石妖拦住。\n    易凡在硬干和跑路两种选择之间，想到了一个点子。\n    “你不是能收回地上的石头胳膊嘛，我站在悬崖边，看你怎么打我？”\n    “如果它继续把手臂丢过来，就会落入悬崖。”\n    “如果冲过来打我，以我现在的速度，我可以与它拳脚游斗，再不济还可以抓住机会往来的方向逃跑。”\n    天才！\n    易凡露出邪笑，给它勾了勾手挑衅，“来呀，你来打我呀！”\n    石妖虽然没有眼睛，但丝毫不妨碍它察觉到这个小家伙的挑衅，双手同时甩出，这次它没有瞄准易凡，它自然知道打他容易把胳膊丢到悬崖下，这一左一右的胳膊砸在易凡身前，它想用爆炸冲击力把他弹出山崖。\n    “竟然没有上当，反而利用我站在崖边的占位，机智地想用地面冲击波把我震飞出去，这石妖的战斗意识不差。”\n    “挡是挡不住了，只能往上跳！”\n    【杀妖第一要义，千万别小看任何一只妖兽】\n    【这可是至少高你5个level的存在，你把它当傻子打，你会把你打成傻子】\n    【他估计还没反应过来这是准成年期妖兽】\n    【也幸好是个防御型的妖兽，要是换做其他，估计一招就把这小子搞死了，哪还留他在这唧唧歪歪】\n    易凡无路可躲，只能高高跃起5米，避免了被地震波冲击力轰下山崖。\n    但，跳在空中的他，无处借力，看着石妖单脚直立，另一只腿蓄力，就在他落点处等着要把他如同足球一样踢飞。\n    易凡在空中瞳孔骤缩，看着石妖那磨盘大的脚底板在眼前急速放大。他娘的这看起来这么憨的石妖还会玩连招！用双拳逼他跳起来，跳起来后它就预判他的落点？\n    【一匹被我们寄予厚望的黑马即将落下帷幕，可惜。短短两天带来这么多惊喜和乐子，坚持到现在也算圆满了】\n    【确实，想不通他该怎么躲，这大脚板，别说踢飞了，当场踢成血雾都有可能，再不使用保命装置就来不及了呀】\n    【已经是一具尸体，走了，看东区战队们打boss去】\n    这个情形，多么像第一天跳伞时遇到桂仁鸟的那一幕，在空中被袭击，无所依靠，只能靠泰若斩打击桂仁鸟带来的反作用力加速落地，逃过一劫。\n    “对了，反作用力！只能冒险一试了，不行就使用保命装置吧。”\n    易凡凝气聚神，轮回绝境偷取的精神力属性，不仅让他比过往更容易思考战斗细节，对于使用武技的专注度也有提升，从而让武技拥有更好的效果。\n    “没石掷！”\n    全力甩出的长剑，即使在40%的护甲穿透加持下，都没法破防石妖，它身上泛黄的光芒一闪而过，飞剑虽然击中它的腿，却直接被反弹开了，而快速反弹的方向，经过精准的设计，恰巧是易凡的方向。\n    他瞅准位置，双手夹住飞剑，剑上传来的力量，让他在空中靠后退了十米，落在石妖两只胳膊砸出的大坑中。\n    一波未停一波又起，坑里的两条石头胳膊猛地一合，就要把他拍死，易凡来不及喘息，双脚一蹬堪堪躲开了攻击。\n    他再次站在了悬崖边，“还能远程控制手臂行动，真赖啊！这攻击频率，比之前遇到的速度型妖兽都快了，再加上这种力量，绝对不是寻常妖兽，至少有8气血！”\n    石妖见状，得理不饶人，双脚交错，强势奔袭而至，跳起，双臂在跳起的瞬间丝滑回到它身上，然后作势要从天而降一掌把他拍扁。\n    “好机会！”\n    易凡觑机，爆射而起，不躲反进，往石妖身下穿去，滑到了它的身后，让它扑了个空，而且位置置换，他赶紧往来时方向跑路。\n    此石妖，不是他现在能碰瓷的，赶紧溜溜球。\n    石妖见他跑路了，没有追击，换了个东面的崖边位置，继续荡起了脚丫。\n    【上面的几个打脸了吧，这小子硬是从准成年期妖兽中逃生了】\n    【能单挑准成年期妖兽，还安然逃跑，这下应该没人会不觉得荣耀是丢大漏了吧？】\n    【也就是碰见个防御型妖兽罢了】\n    【你们有没有发现，这小子杀妖不咋地，跑路永远是一流，我记得开局他是第一个被妖兽袭击的，也是轻松跑路】\n    【谁说的，上次打细肢螂，不是林焱帮忙，就嘎了】\n    【我有预感，即使林焱不出来，他或许也有后手】\n    【+1，总觉得他还有底牌没亮。】\n    作为唯一一个和准成年期妖兽SOLO（哪怕是单方面被虐）的学生，易凡现在直播间热度高涨，甚至都排进前十了，直播间中赞助纷飞。\n    这个看似天赋差劲，气血资质低微的学生，一次次打破常规，是个人都知道他不简单。\n    虽然大家没有看出来他怎么让妖兽诡异地迟钝一瞬间，但是凭战斗中各种另辟蹊径的应对手法，以及三年前状元周婵的同款非凡剑法，招式都是拼尽全力不留余地的“死招”，却总能向死而生。\n    最重要的是单杀6气血妖兽，在这场一模中至今也只有少数学生做到了。\n    所以大家对他的好奇实在不小。\n    与易凡一样被认为是大黑马的，还有几个学生，其中一个正在他所在山峰的南面。\n    正是与马芸和李萧然配合对抗金雕的林焱。\n    以区区C级天赋，一路走来，单杀了十几只速度型妖兽，直追两大S级天赋的尖子生，虽然有可能是他们两个忙着找武学传承线索，耽误了杀妖。\n    但从他们与金雕强行抓来的闯岩洞的哪些妖兽的战斗可以看到，林焱的战斗力不比两人差多少！\n    令人印象深刻的是，林焱竭尽全力时，身体上冒出的那一缕缕绿色火焰，让妖兽十分害怕。\n    林焱直播间热度排名第五，在殷无忌、慕容清、莫愁、李萧然之下，赞助都拉满了。\n    而且林焱的打死妖兽后，什么都不取，只是发出一道火焰烧光妖躯，和别人吞食血肉的行为天差地别。\n    他的资料并未显示具体天赋，但有人分析，大概率是一种火属性的，需要奇怪规则进行发育的天赋，见他在一模中就崭露头角，似乎已经掌握了发育手法。\n    再加上他无父无母，所以如今各大势力都有所投资下注予他。\n    视线转到山峰南面的那个山洞。\n    山峰南面山洞，一只准成年期金雕领着一群桂仁鸟盘旋在周围，此洞原本是它的休息之处，但是不久前有几只小猴子闯进来，金雕攻击性很高，作势把他们抓死，但是好在几人中的李萧然吹动箫声，干扰其攻击准度，竟然能与它周旋一二，才让他们从山洞逃出去。\n    它自然不会放过这下猴子，振翅飞出追击，不料就在它飞到天空上时，该死的几只猴子有1个人往山下跑，其他的居然反其道而行之，冲向躲入山洞，这种戏耍行为，让它怒上眉山，放弃追击下山的那只，必须先搞死入侵家门的几只。\n    但它在山洞中只能发挥很小一部分实力，而且洞中空间封闭，对箫声的有所加持，在冲进洞内无法拿下几只猴子，双方勉强僵持，它只好退出来守在洞外。\n    不断往山洞中扇出一道道风刃，时而驱赶一些影豹和细肢螂进洞进攻，但是进去的妖兽都没能出来，不知道这些动作效果如何。\n    而洞内，几个学生分成两批，一批守在洞口，防止妖兽进攻，还有一男一女站在几块石头拼齐的石板跟前，只见平放的石板上，刻画了一套奇异武学。\n    “终于拼好了，该死的金雕竟然把武学石板割碎了，幸好有小芸心思玲珑，把石板复原。”\n    洞内的几人，听到李萧然的尬吹，虽然在困期间听过无数次，但是仍然觉得有些尴尬无语。\n    外界形象风度翩翩的李公子，在一中校花面前，放低了姿态。\n    “这个石板上的武学，我看不懂。”像圆规一样树立在一侧的马芸没有理会他的话，自顾自的说话。\n    马芸两对大长腿引人注目，一中灰色的制服紧贴其上，显露傲人曲线，在场的男性每次目光移到这长腿上，总会赶紧马芸比他们高一个头。\n    洞口的林焱，眼见没有妖兽潜入，深深吐了一口气，“看不懂也罢，可能是地级以上的武学，只要上交给官方，拿到评分即可，武学倒是其次。”\n    “难道你一点都不好奇这武学的能力吗？”马芸终于将目光从石板上移开，看向林焱，那双清冷的眸子带着一丝探究，“如果这是一门极其稀有、甚至已经失传的绝版武学呢？又或者……它甚至是上古的天级武学！”\n    “有缘者居之。”\n    林焱心里吐槽，他缺的是武学吗？他缺的是可以随意挥霍、支撑我这诡异天赋成长的庞大资源啊..."},{"title":"第12章 零点，四妖王","order":12,"label":"12","text":"随着东区墨蛟潜渊、西区天竺嫂肆虐、南区金雕堵门、北区石妖现形，四大准成年期妖兽BOSS的全面登场，将一模考核的紧张氛围推向了顶点。\n    时间，也悄然滑向了第三日的零点。整个一模考核的热度，迎来了最终的巅峰时刻。\n    今夜，很多城内的平民百姓，达官贵人，教师家长都在通宵关注，观看直播，浏览一线资讯。\n    主直播间中。\n    【拉闸，东区战队开的boss团我看是凉了，一众学生拼尽全力，重伤无数，好不容易把墨蛟打成残血，结果它一转头潜入水中，嘴里咬着一枚珠子，身上的伤势肉眼可见地迅速恢复！这还打个屁！】\n    【boss还有二阶段？机制都不懂还开团】\n    【溃败！可惜！】\n    【如果有战队能打死墨蛟，获得它口中的宝珠，说不定评分全部都是满分！】\n    【话说这个水潭是荣耀战队发现，本来他们打死8气血冰纹鳄后，刚刚取出冰纹鳄的脊骨，墨蛟就从水下面冲上去把冰纹鳄吞了】\n    【这个水潭很深，有可能是通往海底的】\n    突然间，弹幕楼歪了。\n    【很多战队都被墨蛟的水炮冲散了】\n    【好在我磕的慕容清和陈玄北、叶知秋和柳如烟两对CP刚好聚在一块了，没散】\n    【有没有可能，柳如烟已经有男朋友了】\n    【去你的，有男友就不能谈恋爱了吗，你凭什么定义我们女生】\n    【小道消息，柳如烟前男友是易凡，已经分手了】\n    【如果你们不知道易凡，他还有一个身份就是荣耀战队前成员】\n    【叶知秋就是顶替他的位置】\n    【易凡不过是个淘汰者罢了】\n    【那我也可以说叶知秋只是个备胎上位罢了】\n    【别瞎聊，搞点正经的行不行】\n    【四大准成年期妖兽全都没有攻略成功吗？】\n    【如你所见，东区刚刚炸团了】\n    【西区把学生全都淘汰完，只剩二中校花莫愁了】\n    【南区人口稀少被boss堵门就不谈了】\n    【北区一个发现boss的学生都没有，要不是南区那个偷渡的小子，估计我们都不知道石妖长什么样】\n    【已经不错了，这些学生都是第一次对上妖兽，做到如此地步也不容易】\n    【今年又没有出现能在一模打死boss的超级学生，可惜】\n    【请问几十年来，有那一年有这种学生】\n    【最有希望的人在三年前，叫周婵，完美无暇级武学，S级天赋，连她都没有做到】\n    【周婵的根基还是薄弱了些，毕竟是贫困家庭出身，难道没有那种出身豪门，练得完美武学，同时天赋异禀的学生吗？】\n    【有】\n    【噢？是谁？】\n    【他们都去中州了，那里才是天才争锋的好地方，是人族核心区域，资源不计其数，同辈们头角峥嵘】\n    山脚下岩洞中，易凡收拾与石妖战斗导致的伤势，默默看着时间，等待。\n    终于，0点到来！\n    旁边石头桌台早就搭好了。\n    易凡朝着桌台跪拜在地，默念有词：\n    “玉皇大帝、三清老祖、如来佛祖、观音菩萨，弟子求求惹~”\n    脑海中，一如既往的念头发起，“窃法巧手！发动！”\n    似乎有个打哈欠的声音，卡牌拖拖拉拉显现：\n    [技能]：使用者开始洗牌，再次释放时，从三种牌中锁定一张，并强化使用者的下一次攻击。蓝牌恢复蓝量；红牌造成AOE伤害和减速；黄牌眩晕目标。\n    今天是第二天，还没有保底，后天才是被动技能保底日。\n    所以这次的技能相对前两次而言有些烂，没有特别强。\n    易凡看着题面，技能是卡牌W技能[选牌]无疑。\n    提交！\n    咕叽咕叽，睡觉~起床~慢跑~洗澡~下班~睡觉~\n    对于这种奇奇怪怪的BGM，他已经习惯...\n    √\n    “获得技能选牌！”\n    脑海中的哈欠声又来了，“融合成功。”\n    [法术星云1——轮回绝境]\n    被动：获得40%护甲穿透\n    主动：你将自身和一个敌人放逐至死者领域7秒，并在期间内偷取该英雄10%的核心属性。\n    进入死者领域时，你会恢复少量气血，敌人会被眩晕小段时间，取决于双方的精神力差值，最多眩晕1秒。\n    如果你在死者领域中杀死了该敌人，那么你会吞噬目标的灵魂，保留你所偷取的属性，死者领域中的战斗不会在现实留下痕迹。\n    （核心属性包含：气血、速度、防御力、精神力）\n    易凡浏览技能效果，露出一抹笑容，“不差，补了个控制，这下飞剑+轮回绝境连招更稳定了。”\n    然后他忽然想到，如果精神力高到能控敌人1秒，配合无情铁手效果，除非像石妖一样，让自己没法破防，不然像之前拿下速度型妖兽，就算气血到8、9点，被自己拉到小黑屋，怕是难抗自己的无暇输出！\n    最重要的是，他的精神力能随着轮回绝境一直偷取提升！\n    “哈哈哈哈哈！”想到美妙处，易凡忍不住低声笑了起来，“无敌！”\n    笑罢，该思考下一件事了，如今他偷取细肢螂的气血后，再加上吞食龙眼果肉，已经5点了，身躯饱满，已经到达极限，似乎再也没有提升的空间了。\n    现在用轮回绝境偷取一些属性，是否会让自己的气血突破5.0，踏入极境？\n    试一试就知道了。\n    易凡出洞，正好撞见一群桂仁鸟在空中叽叽阴叫。\n    “就拿你开刀，正好龙眼吃完了。”\n    左手祭出法术星云，右手一发没石掷，同时发向它。\n    5气血+举轻若重+40%护甲穿透+轮回绝境静止减速+眩晕，5重效果下，桂仁鸟即使有龙眼坚硬外壳防护妖核，也被一剑刺穿脑袋，领域还未展开，就已经掉落尘埃。\n    易凡从发招开始，一直感受体内气血，在发动法术星云时，自己偷取了它的0.6气血，他确实感受到了气血明显提升了0.6，真的可以突破极境！\n    还未等他开始开心，桂仁鸟死后，那0.6气血，突然瞬间萎缩。\n    “艹，不行？”"},{"title":"第13章 练血极境","order":13,"label":"13","text":"易凡怀着不甘心，仔细再感受身体四处，似要找到任何蛛丝马迹。。\n    皇天不负有心人，易凡虽然在身体躯干、四肢、头部没有感觉到前后气血有所差异，但脊椎、关节处有微弱异感传来。\n    他当即挥舞长剑，品味，感受。\n    “我的出剑速度，腾挪，变招都加快了！”\n    “而且提升不小，可能有8%的提升！”\n\t要知道，他的速度可是总共偷取了两次速度型妖兽的1层属性，第一次偷取约增加了6%速度，第二次偷取约增加了5%速度，提升是越来越少的。\n\t按照规律来说，这一次他吸收桂仁鸟的速度，可能会有个4%提升，但实际提升了8%，超出预计多加了4%。\n\t绝对不同寻常。\n    “脊椎、关节，是人体神经元和软组织，关系着动作协调、反应速度，难道是因为我偷取的是速度型妖兽的气血，所以我踏入的极境后，提升的速度相关的属性？”\n    但他的整体气血确实没有产生变化，书上说踏入极境必然伴随气血的增长，究竟是怎么一回事？\n\t思来想去，没有头绪。\n\t“算了，今天的指标已经完成，先回去吧。”\n\t岩洞内，易凡饥肠辘辘，赶紧把新鲜挖来的龙眼果肉塞进嘴里。\n\t奇怪，用轮回绝境会偷取生命力，之前的几次用过后，他都不会感觉到饿，怎么这一次这么饿。\n\t塞了几斤龙眼果肉后，他盘坐调息，鼓动气血，快速消化。\n\t“这...”易凡感觉到体内气血在缓慢增长！而他并未开始练骨。\n\t是极境！\n\t他的气血大概提升到了5.2，超过练血圆满，踏入练血极境了！\n\t原来气血没有马上变化，是因为没有补充妖兽血肉？\n\t亦或者是偷取0.6气血只够用于突破极境，境界是上去了，但0.6气血丝毫不剩，无法转化成极境气血？。\n\t易凡更倾向于后者，6气血的妖兽幼崽不够吃了！\n\t以后自己要考虑更高气血的妖兽，7气血、8气血的！\n\t说到以后，易凡突然想到一个问题，一模之后回城，那么他该怎么打怪升级呢？\n\t“淦！能不能让我留在这里直到高考！？我不要回家！！！”\n\t易凡盘坐在石板上，回想其这两天一点一滴，这是他还没有苏醒记忆时，就养成的习惯，温故知新，复盘反思，才能早就他超出常人的武学熟练度。\n\t但是在直播间观众眼里，就是故意摆烂。\n\t【666装都不装，没食物了，就出门一剑把天上的龙眼砍下来吃】\n\t【有没有大佬分析一下他的天赋是不是对鸟类特攻，这两天以来他是唯一一个能打死桂仁鸟的吧】\n\t【不是只有他能打死桂仁鸟，而是击杀效率问题，南区的那几个学生都优先打地面妖兽，不会特意打鸟】\n\t【对，再加上他们第二天忙于探索，被困岩洞中，少打了很多妖兽】\n\t【我估计他的天赋有可能是对飞行类、鸟类、或者速度型妖兽的震慑，不然没法说通为什么他飞剑过去的一瞬间，它们都不带动的】\n\t【他明明可以杀更多妖兽的，偏偏要躲在洞里摆烂】\n\t【三天以来，只杀了三只妖兽，一只都不带多的，刚好是一模平均杀妖数左右，控分？扮猪吃虎？】\n\t【等等，上面的你提醒到我了，关键词三天三只，也就是说一天一只，参考人族现有天赋池，有很大可能是那些每天只能用一次的天赋！】\n\t【之前我就猜他的天赋是施加强力的减移动速度类的debuff，而非震慑或者凝滞空间】\n\t【我查看了他对战细肢螂的战斗录像，那只细肢螂有卸力技巧，他们在战斗过程中，易凡即使伤痕累累，也没有使用那个诡异的天赋定住对方，估计是害怕减速后被卸力抗住他的爆发，没有秒掉它的话，以他的实力只能开启保命装置了】\n\t【要知道选择南区的学生，一定是自信自己可以克制速度型妖兽的，种种线索串联起来，十分清晰合理了】\n\t【666】\n\t【666】\n\t【确实没有在同一天内发出他那类似定身的能力】\n\t【就连在山顶上对战石妖，最危急的时刻，也没有使出来吧】\n\t【这样就合理，F级天赋，要不就是效果很弱，要不就是无法兑现成战力，要不就是使用成本很高。每天只能释放一次的减速debuff能力，是在F级天赋范围】\n\t【大佬，虽然你分析得很到位，但是如果是真的话，这样被竞争对手知道他天赋的效果，岂不是让他很被动？】\n\t【个人瞎猜，如有雷同，纯属巧合】\n\t【所以他根本就不是摆烂，而是无能为力！】\n\t【上面的，易凡的根本能力其实不是这个天赋，而是他超群的武学和老练的战斗经验】\n\t【玄级武学？气血境的战斗经验？一个人踏上武道，都有属于自己的依仗，悟性、资质、家世、机缘、贵人、心境、天赋等等，自己最大的依仗就是天赋了，你比别人少一个依仗，在漫漫武道路途，要比别人多付出多少才能赶上他们？】\n\t【我见过无数悟性超绝，但是天赋差强人意的年轻人，他们一个个变成了仲永，只有少数幸运儿触摸到了别的机遇，才能踏出樊笼】\n\t【据说易凡觉醒F天赋后，从实验班退到普通班，从知名的荣耀战队退出，被女友分手，难道是学校、队长、女友都瞎了眼吗？难道他们不知道他剑道悟性高吗？这个世道，就是这样...】\n\t【这...】\n\t【别吵，碍着我舔颜了】\n\t一夜月婵凝满霜。\n\t“全体考生请注意！全体考生请注意！”\n\t“这里是一模总指挥室，所有学生，请使用你们的保命装置，登上巨岩岛上空的战机，一模考试结束，计分已暂停，后续动作不会计入加减分。”\n\t听着隐形无人机传来的通报，易凡恋恋不舍地激活了后背隐藏装置，一道湛蓝护盾包裹住他的身体，然后慢慢被战机的电磁牵引力拉向空中。\n\t南区只有一架战机接送返回，人数稀少，他从下方开口进入机舱，舱内数十位学生稀疏坐落在座位上，大家互相聊天述说自己经历，身侧大包小包存放着他们的战利品，只有易凡就身后背着一把剑，空手而归。\n\t人群中，易凡唯一认识的林焱跟他抬头示意，拍了拍他旁边的座位。\n\t“易兄！这边！”\n\t易凡挥手回应，快步上前，坐在旁边。\n\t林焱另一边座位，还坐着两个学生。\n\t一个男生，制服和林焱一样都是黑白相间，但与后者风尘仆仆的模样不同，他身上干干净净，嘴角含着一丝若有若无的笑意，仿佛珠玉在握，自带一股从容不迫的气度。\n\t一个女生，短发犀利，棱角分明，身穿一套紧身的灰色一中制服，将窠窣有致的身材勾勒得淋漓尽致，浑身散发着一股生人勿近的冷冽气场，一看便知不是易与之辈。\n\t这两人一看就是大家子弟，和林焱身上的“穷酸样”截然不同，易凡压下心中的诧异，调侃林焱。\n\t“林焱兄弟，别来无恙，阳光灿烂，想必是蹭到武学传承的评分啦？”"},{"title":"第14章 战机闲聊，雏鹰训练营","order":14,"label":"14","text":"林焱闻言，察觉到另一边两个人好奇的目光，狂对着易凡眨眼，让他不要什么都说出来。\n\t“咳，什么蹭不蹭的，我和马芸还有李少那是互帮互助，再说了，见者有份，大家都有贡献。”\n\t“旁边这两位，就是一中的马芸校花，二中的李萧然李少，大名鼎鼎，不仅查到了武学传承的下落，还领头对抗准成年期妖兽金雕，令人好生佩服！”\n\t李萧然连忙摆手，“哎，我的贡献有限，小芸才是我们的主力输出！”\n\t“这个就是我之前和你们说的易凡啦，唯一一个打死桂仁鸟的家伙，武学不凡，之前给你们尝的龙眼果肉就是从他打死的桂仁鸟那里来的。”\n\t林焱转头介绍了易凡的信息，“易兄啊，你怎么这么久才上飞机，大家都在上面等你好久了，而且两手空空啊，没有带点土特产回去？之前那些龙眼呢？兄弟我可能十分想念那甘甜的味道。”\n\t“啊？还能带回去吗？我以为不行，就当场吃完了。”\n\t“靠，你不知道么，虽然我们不能带妖兽血肉进城，但是官方会统一收集它们，兑换成额外的信用点，信用点比联盟币好使多了，能买很多联盟币买不到的东西。”\n\t“靠，你怎么不早点告诉我，不然我就算饿死都要把龙眼留下来呀！”\n\t易凡当然是知道的，这番话只为了维持他在林焱眼中的呆子人设。\n\t一旁拽拽的马芸第一次开口说话，“你就是易凡？三中那个剑法不错的易凡？练的是三年前高考状元周蝉的同款非凡剑法？”\n\t“正是家传剑法。”\n\t“好呀，我老早就想和你单挑一局了，我们回去安排一下怎么样？”\n\t马芸开门见山，话语中透露出来她似乎是个武痴，哪有人第一次见面就约战的，约那啥都没那么快。\n\t“额，我有其他事情要办咧，可能没空。”\n\t“噢？相传你可是十分乐意与他人对战，不然也不会练就半步完美无暇的非凡剑法。”\n\t“这...确实是莫得空。”\n\t易凡尴尬地推了推鼻子，他回去当然要专注于找个“练功房”杀妖变强，哪里还有兴趣和她搞来搞去，在获得轮回绝境的时候，杀妖的优先级就已经拉满了。\n\t林焱见状，未免争吵，拆开话题。\n\t“什么情况，马芸你怎么比我还了解我兄弟？”\n\t一旁的李萧然也带着好奇的眼光看着他们两个人。\n\t“如果不是他觉醒了F级天赋，他的名字就还在我的必杀榜上，可惜...”\n\t李萧然知道马芸的必杀榜，其实就是个高考的重点对手名单，他知道她立志想像三年前的周蝉一样，镇压一届学生，以无可匹敌的威势称为状元！\n\t林焱闻言则是大吃一惊，心想，“自己靠着家传的神秘戒指获得了自己C级天赋吞日焚炎体的正确打开方式，在跳蚤市场淘到一缕异火遗物，吸收异火遗物后，拼死单杀了一只妖兽，又吸收其魂火，才慢慢变强。在一模中吸收了许多妖兽的魂火，冒着精神错乱的风险，才能勉强接近大部队。”\n\t“易兄，你F级天赋居然能单杀南区妖兽，怪不得马芸平日屁都不放一个的人，都要啰啰嗦嗦和你对战，嘶！半步完美无暇武学，恐怖如斯！连我都想掏你一下了，看看你这剑法到底有多厉害了！”\n\t李萧然听到他说调侃马芸，一拳轻拍他的肩膀，“林焱，不要这样说小芸！”\n\t“心直口快，心直口快~”林焱见李萧然佯装发怒，讪笑道。\n\t易凡笑道，“还是聊聊你们怎么探索武学传承线索的吧，我也很好奇呢。”\n\t一顿交流，主要是林焱在滔滔不绝地讲述他们如何发现山洞，如何被金雕堵门，如何在洞内合力对抗金雕驱赶进来的妖兽，以及最后如何拼凑出那块奇异武学石板的过程。\n\t易凡和马芸偶尔插问一句，李萧然则时不时微笑着补充一些细节，或者纠正林焱过于夸张的描述。\n\t战机飞行速度很快，不到一个小时就到了月桂市边。\n\t“看到了吗，远处那座高山上，守护了人族数千年的琅琊圣城就伫立在那里。”\n\t“...” 几人都望向那座圣城，眼中或多或少都带着一丝向往与敬畏。\n\t林焱收回目光，忽然想起什么，说道：“对了，据说今年月桂市为了高考冲刺，搞了个大动作，叫什么‘雏鹰训练营’的。你们听说过吗？”\n\t“你们要去吗？”\n\t“没兴趣，我家里有专门设计的冲刺计划，一模之后我就要回家闭关修炼！”\n\t“我也是，又要两周见不到小芸了，好难受啊~”\n\t“靠，我跟你们富二代们拼了！你呢易兄，你会去吗？”\n\t易凡刚想回答，又被马芸抢答，“他肯定不回去啦，你不知道他家开道馆的么，大名鼎鼎的非凡道馆就是他家开的，去年我还为他家的大别墅贡献了几块砖瓦呢！”\n\t她特意在“贡献”二字上加重了读音。\n\t原来马芸是非凡剑法受害者，估计是去年花了不少钱就为了加入非凡道馆，结果发现上当了，怪不得她对易凡的事情这么熟悉，破案了。\n\t“咳咳，”易凡赶紧用咳嗽掩饰尴尬，岔开话题，不能被坑爹的老爹给坑了。\n\t“这个训练营啥情况，我都不知道，什么时候的消息？”\n\t“就在一模开始前几个小时吧，学生都传疯了你不知道？噢，忘了你在那天被甩了估计没来及关注。”\n\t易凡确实没有看到这个消息，当时他的心思在怎么用天赋上面。\n\t“就是月桂市官方和警卫司联合创立的一个服务于高考准考生的冲刺班，以往这种冲刺训练可能只专属于你们这三个富二代一样的人群，像我这样的平民百姓都是挤着学校的资源来冲击备战高考，听说训练营里面有学员对战、野外任务体验、荒野求生、战队比赛等等各种专业项目。”\n\t易凡心花怒放，真是瞌睡就送枕头，他还在思考怎么继续发育呢，就送来这种好消息。\n\t他微微颔首，表现得对其很感兴趣，林焱见状，继续补充。\n\t“不过参加训练营需要一定的信用点，只要排名不算太差，拿到的一模信用点就足够，而且里面的所有东西都是用信用点兑换，钱财无用。”\n\t信用点，是人族联盟在联盟币以上的一种货币，它最重要的特点是，绑定个人，无法交易赠送，官方在售卖任何妖兽相关的东西，只认信用点！同时联盟的很多官方活动，也只认信用点！\n\t“我已经决定参加训练营了，易兄一起么？听说里面有很多外界无法买到，甚至是没法看到的珍品，比如增强天赋能力的天才地宝！”\n\t“增强天赋能力？”易凡疑惑。\n\t李萧然擦拭着长萧，“这种天才地宝可遇不可求，获取条件必然很艰难。而且对于高级的天赋，比如小芸的S级天赋，是没有效果，倒是很契合林焱和易凡你们两个，有机会不要错过。”\n\t不合时宜的通报突然出现：\n\t“嘀~嘀嘀~嘀嘀嘀，考生们，我们已经到达月桂市外防检查站，根据《城市管理基本规约》，所有与妖兽相关的物品都不能私自带入城内，请大家下战机，统一上交战利品，我们警卫司会估算价值给予各位市场价3倍的信用点，作为警卫司送给广大学子的成人礼。”\n\t“同时，大家可以在检查站消毒清洁身躯，随后坐专车回返各个中学，公布一模成绩。”\n\t聚散总有时。\n\t因为学校不同，易凡和刚认识的三个朋友添加联系方式后，就分别了。\n\t最重要的是，他怀里藏着细肢螂的骨粉，还有去换信用点，说了没带战利品，不能被他们发现。\n\t“一份细肢螂幼崽骨粉，价值10信用点。”\n\t步入消毒区，在野外摸爬滚打两天，当时还没觉得有什么，现在待在干净的城市里，不适感快速上了心头。\n\t温热水冲洗身体，舒服直冲天灵盖，如果再泡个澡就更完美了，可惜也不能马上上床睡个大觉。\n\t洗白白出来后，易凡看着手环中，自己的信用卡余额从0变成了30（3倍），美美拿下第一桶金。"},{"title":"第15章 回校，顾沁的请求","order":15,"label":"15","text":"三中专车区域，一辆大巴面前，鲜红的“10班”飘扬。\n\t穿着清秀的顾沁站在大巴面前，在人群中看到了易凡，赶紧招手示意让他过去。\n\t“你猜到技能名字了？”\n\t顾沁第一句话就让易凡头皮一凉，不知道怎么回答。\n\t随后又想起来觉醒后确实把天赋模糊告诉过几个人，班主任顾沁就是之一，暗道自己吓自己，刚想组织语言回答，又被顾沁打断。\n\t“先上车吧。”顾沁拍了拍他的肩膀，让他紧张僵硬的肌肉放松下来，她淡漠的双眼似乎知道他心里所想。\n\t易凡选了个靠前的位置坐下，不是他不想坐后面，只是来得太晚了，后排都被其他同学坐满了，刚好前排有座位。\n\t打开手机，准备网上冲浪时，一名高挑的女生走到他面前，伸过芊芊细手给他递了一张纸条，女生耳尖通红，然后低下头羞涩回到后排。\n\t众学生纷纷惊呼。\n\t易凡认得这个女生是一模之前邀请他组队的那几个女生之一，名字叫胡颖。\n\t看着这哭笑不得的一幕，他原本不理解，他不过是F级天赋罢了，之前不是还被嫌弃吗？怎么到了10班反正还被倒追。\n\t他转头从大巴门窗中看到自己的侧脸后，忽然释怀了。\n\t毕竟他只是有点小超级帅，再加上前实验班学生身份，再加上道馆富二代身份（这个肯定不是最重要的吧），再加上为人随和礼貌，再加上最重要的一点点才华，这几个小小的优点罢了。\n\t这些东西在实验班那群学霸看来都不如一个强力的天赋，嫌弃他的人都是什么学校、校队、校花、白手起家狂捞几个亿的道馆馆主，都是些“肉食者”。\n\t但是在普通班的“学渣”眼里，那可就相当于是落凡的男仙子哩！不怪乎女孩这么主动。\n\t“安静！不要吵！”忽然身后传来粗狂的声音喝止乱哄哄的大巴。\n\t又走来一个高大的男生，站在易凡面前，俯视看他，眼神带着几分审视和不悦。\n\t“兄弟，我们快高考了，不要过于招摇，大家要专心在高考上，高考前别搞这些虚的，实力才是硬道理。”\n\t“我是10班的班长王虎，以后有什么困难尽管找我。”\n\t易凡抿着差点压不住的嘴角，硬是憋着听他说完了，小小的班长都会萝卜大棒威恩并施，你说好不好笑。\n\t他的意思是让易凡别接受那个女生的示好，不然凭易凡的F级天赋，就要被下黑手了，反之则是他欠易凡一个人情。\n\t易凡赶紧双手合十鞠躬致谢，不然他真要笑出声了。\n\t“班长真性情啊，你都喊我兄弟，那还说什么呢。兄弟我以后低调点就是了。”\n\t王虎看到他的话起了效果，欣喜走回座位。\n\t胡颖哪能不知道王虎在干什么，两人吵了起来，叽叽喳喳。\n\t“王虎，你在干什么？别以为你是班长就可以欺负易凡！”\n\t“哪有！我是关心他。”\n\t易凡懒得理他们，因为随着最后一名学生上车后，顾沁也上来一屁股做在他旁边。\n\t众学生瞬间噤声。\n\t大巴启动，回校！\n\t“看到我们班全都到齐，老师很欣慰，不论成绩如何，安全回家是最大的成功。”\n\t“你们是我带过最好的一届，这次一模，是历年来唯一一次全班齐全回归的。”\n\t她的语气忽然重了一些，“没有学生不幸身亡。”\n\t车厢内一片寂静，所有人都能感受到这句话背后的沉重。巨岩岛上各类妖兽的危险，他们亲身经历，此刻更能体会到“全员平安”这四个字的珍贵。\n\t“咱们可以在车上互相交流在巨岩岛的经历，为二模乃至高考做下铺垫。”\n\t顾沁点名表扬了表现不错的几个同学，比如班长在一模中突破到练骨，让他完全忘记刚刚的争执，现在脸上表情欲笑非笑，时不时瞥向胡颖，带着一股“你看，老师都夸我了”的傲娇劲儿。\n\t易凡看着顾沁这么温柔的一面，也是惊了，在3班的时候她可不是这样的，可是比教导主任还严格，说的也是完全相反的，都是“你们是我带过最差的一届”来着。\n\t“这就是传说中的...因材施教吗？”\n\t顾沁说完，大家热热闹闹地讨论，有人哭，有人笑。\n\t她自顾自坐下，对易凡脸上那种“你以前可不是这样的！”的表情熟视无睹。\n\t“易凡，回校后我会帮你向学校申请，重新加入实验班，”\n\t她顿了顿，易凡看着她，总感觉她这一顿，就是为了让他开口然后打断他，所以易凡默默看着她，就是不说话。\n\t“虽然希望不大吧。”\n\t“你跳伞时的处理不错，警卫司的副局长岳局看了很喜欢，如果你考不上大学，可以去他那里锻炼一下，为此王校长亲自写了推荐信。”\n\t“警卫司？”\n\t“对，不过警卫司的强度不小，等你高考后再考虑吧，到时候过来找我拿推荐信就行。”\n\t“谢谢，顾老师。”\n\t“有几个战队减员了，各中学的校队联赛关乎大学特招，你可以试试？”\n\t“算了我有更重要的事情要办，顾老师不如你跟我讲一下雏鹰训练营的事情。”\n\t“雏鹰训练营其实背后是琅琊城牵头，月桂市出面，借着警卫司的人，为成绩优秀的学生准备，各中学排名前100的学生免费参加，而排名不够的，也可以通过这次一模获取的信用点报名，只需要100信用点，里面最重要的资源是超潜石...”\n\t易凡听完顾沁带来的消息，感觉也没有比林焱多了解，明天报名时再问问官方的人。\n\t“你在一模中单杀妖兽的能力引起了很多人的注意，”顾沁的手指如同弹钢琴一样敲击放在腿上的笔记本，“尤其是你定住妖兽那诡异的表现，已经被观众翻来覆去分析解构了八百遍——他们都认为这是你的天赋。”\n\t“说起你的天赋...觉醒时你跟我说隔一段时间就会获得一张卡牌，通过上面技能的描述，猜出技能名字，就可以获得技能卡的使用权？”\n\t“所以，你是猜到技能卡的名称了？”\n\t“对于这种奇异的天赋带来的技能卡牌，老师我也有一些好奇。”\n\t顾沁缓慢地靠近易凡，贴着他耳朵，她压低了声音，呼出暖暖的口气让他耳朵痒痒的，就像...有人在用唇瓣轻轻吮吸。\n\t“能不能...”她的声音如同耳语，充满了诱惑力，“跟我分享一下你拿到什么技能了？”\n\t“啊？”\n\t武者的天赋能力是十分敏感的隐私，从来都是武者自己想要分享给别人才行，比如易凡被评为F级天赋时，想让顾沁、易建连帮忙猜一下技能名称，就告诉了他们；比如像杨沸的S天赋怒霸体，是他想造势，才公开，吸引各方早点下注投资。\n\t但是像顾沁这样主动询问天赋的，是很冒昧的行为，就算她是老师也不行！\n\t通常唯有生养武者的父母才有资格理所当然地了解！\n\t顾沁察觉到自己窥探别人的天赋有些越界，看着他喉结滚动也是莞尔一笑，恢复正襟危坐的姿态。\n\t“额，你别误会，其实这是我的研究课题，我除了中学教师的身份，还是琅琊城武者研究所的科员，近年来一直在准备论文《武道涅槃：基于现代训练体系的武者天赋强化机制研究》，我觉得你的天赋十分有研究价值，想让你当我的专属研究对象。”\n\t易凡其实是不喜欢让天赋被人知道的，但是一来顾沁本身就对他天赋能力有一些了解，二来，他很吃清楚系，很难升起拒绝的念头（就是馋人家身子）。\n\t“行吧，但是顾老师你不要把我的天赋能力告诉别人，就当我是个废物天赋者吧。”\n\t两人互相约定了一些事项，比如顾沁在研究的同时还会付出一些资源，看看能不能提升他的天赋，虽然易凡对此没有抱什么信心，但是有机会总要试一试。\n\t顾忌到隐私，易凡只需要把天赋的大概效果告诉她即可，只要不是错误的信息，同时易凡要把每次使用天赋对战的录像发给顾沁研究。\n\t“天赋能力你之前就了解，我这次猜中的技能是轮回绝境：遇到危险时，可以指定敌人同时进入折叠空间一瞬间，进行单挑，每天只能使用一次。”\n\t他隐瞒了偷取属性效果的关键信息，只透露了最基础的“拉人单挑”和“每日限次”。\n\t“空间能力，时间限定，初见杀的优势明显，但遇到了解技能的人，缺陷就更大了，综合评价相当于B级天赋！”\n\t两人压低声音。\n\t时间在交谈中很快消逝，十几分钟的车程转眼即至。\n\t“大家先回宿舍或回家，明天上学后，公布一模成绩。”\n\t看着前来接送的家长们与孩子相拥、怀抱、欢笑，易凡转头孤身往宿舍走去，其他学生他们有人疼，有人爱。\n\t而易凡仅有一间单人宿舍，以及...\n\t一张4×4米的雪绒底垫太空舱，\n\t一个塞满零食的储物冰箱，\n\t一台悬浮式计算机终端，\n\t一瓶冰爽的可乐，\n\t仅此而已（夸张的假哭脸）。\n\t他本想回来后上网冲浪，看看这次一模有没有什么值得注意的事，然后再去找自己的录像复盘一下的。\n\t但是刚把自己摔到太空舱里面，床垫便像记忆海绵般吞噬了所有疲惫。\n\t此刻的柔软像某种温柔的报复，连日积累的酸痛顺着脊椎攀爬上来，眼皮越来越沉，在意识清醒的最后一刻，他总感觉自己忘了些什么。"},{"title":"第16章 意外走红","order":16,"label":"16","text":"就在易凡沉睡的时候，外界关于他的事情漫天纷飞。\n\t慕容府，荣耀战队集结。\n\t香炉袅袅升腾着异香，两侧分体式的投影灯将一组组数据投在墙板上。慕容清端坐于上位，一身蓝色长袍，领口绣着暗色云雷纹。她指尖轻叩案几，目光扫过阶下分列两旁的战队成员，最终停留在左侧与黄发青年叶知秋谈笑开颜的妩媚女孩身上。\n\t“第一个议题，”她语气轻盈，“如烟，你来复盘一模。”\n\t紫色大波浪批肩的柳如烟点了点头，她控制着媒体设备。\n\t“首先做一个估分，一模的评分以探索、杀妖、生存三个维度展开。\n\t生存维度我们全体坚持到最后，必然是有保底分的，以我今天在教育司的线人拿到的内部消息，北区20分，南区25分，东区25分，西区30分，我们都拿到了25分，值得注意的是挑战西区的二中种子莫愁是唯一获得30分的学生，而她是一个强劲的竞争对手。”\n\t柳如烟展开另一组资料。\n\t“杀妖维度，评分细节未得而知，我仅从杀妖榜上做分析，清姐位列第7，知秋第13，光从个人而已，我们都并不占优，但如果做战队排名，我们位居第四，第一第二第三分别是殷无忌所在的冰火战队、莫愁所在的无归战队、杨沸所在的飞扬战队，这样的话，在生存和杀妖数上，殷无忌、莫愁和杨沸领先，然而我们是唯一击败8气血妖兽的，如果它可以兑换成10只6气血妖兽的价值，我们战队是有机会第一的。”\n\t“最后是探索维度，南区马芸和李萧然发现准成年期boss，并收获武学传承，应该是所有人里面探索分数最高的，预估为20分，然后西区boss是莫愁发现，东区boss是我们发现，北区boss是...易凡发现，探索分都是10分。”\n\t似乎提到了一个奇怪的名字，在场众人脸色一变，仇升东冰冷的消瘦脸庞难得挤出一些笑意，“易凡，干得不错。”\n\t慕容清沉默不语，坐在她右侧的陈玄北打了个响指，“如烟，继续吧。”\n\t所有人都没注意到，叶知秋垂下的刘海中藏的一抹不屑。\n\t“综上所述，我们荣耀战队虽然在三个维度都不是首位，但都是第一梯队，我们个人全部进入总排名的前20是很有希望的，个人第一我预估是莫愁，三个维度都很有实力。”\n\t“战队层面，我们荣耀战队有一些希望成为第一，因为无归战队其余三人都提前淘汰了，生存分拿不满；冰火战队、飞扬战队没有探索分。”\n\t慕容清缓缓开口，“杀妖维度已经确定是冰火战队了，而三个维度都拿不下任意一个第一，说明我们战队绝对拿不了第一名。”\n\t此言一出，众人皆惊！\n\t“为什么？”\n\t“这是战队评分的潜规则、惯例，只有三个维度中至少拿下至少一个第一的，才能被评为最佳战队。”\n\t“我在这里说一下关起门的话，想一想我们在一模，在过去是不是有哪些事情没有做好，没有竭尽全力？！”\n\t“比如当时水潭遇上墨蛟，当时超能感应给我的信号是福祸相依，如果我能进一步分析到水潭下有一枚骊珠，让小仇偷偷下去取出，那么我们既会在探索维度取得领先，又有机会在后面围困墨蛟时把它打死。”\n\t陈玄北打断，“慕容，这不是你的错，在获得天赋短短几天内做到这个地步已经是极限了，将来随着使用天赋熟练度的不断提高，你的上限将会远远超过其他人！”\n\t5人就一模经历做了2个小时的复盘。\n\t“第二个议题：高考冲刺计划。”\n\t柳如烟调出她整理的资料，“距离高考不到一个月，中间插了个二模，之前其实已经决定参加月桂市举办的中学战队联赛，联赛关乎大学特招，赛程为期三周。在那之后参加二模，随后是距离高考的最后一周空窗期，会安排一些训练赛保持战斗状态，其他时间休息调整。”\n\t“关于联赛对手，基本就是各中学推出的校队了，资料如下...”\n\t数个小时连续不断分析，再加上一模积累的劳累，结束会议后，5人马上坐进修养舱，这是他们难得的休息机会，这段时间，掌握天赋、战队磨合，都十分消耗他们的精力。\n\t幸好荣耀战队提前锁定了校队名额，减轻了许多负担，只不过...\n\t当时战队里的战士，名字还叫作易凡。\n\t慕容清喃喃自语，“空中被袭击却完美脱逃，单杀三只妖兽，最后一天甚至做到秒杀的程度，还能单独从准成年期妖兽手中逃跑，易凡你还能做到什么地步？”\n\t她登进易凡的直播间，看着他一模中的“精彩时刻”。\n\t“当初玄北牵头，然后如烟通过数据分析师的身份请求踢掉你，只有平常沉默寡言的小仇反对，2：1的情况下，我也默认你将成为一个队伍的累赘，为了我们5个人三年创立荣耀之初，登峰造极境的理想，只能大义灭亲。”\n\t“而替代你的叶知秋，在队伍里做得不比你差，甚至因为真实伤害的缘故，队伍的输出能力进一步上升，只是缺少你重剑亦攻亦守的特性，给玄北的防守压力更大了。”\n\t“看到如今你没有颓唐，反而越战越勇，我真的很欣慰。”\n\t慕容清点击了易凡的哈士奇头像，给他发了一段话，“易凡，恭喜你成为一模中少数单杀速度型妖兽的学生，我们评估你的成绩应该很好，正好我认识几个战队，在一模中不小心减员了，如果你考虑加入战队，明天可以在学校见一面，我可以把你推荐给他们。”\n\t“荣耀在大家的努力下，名列前茅，我们会带着当初我们5人登峰造极境的意志，一直走下去！”\n\t另一边，同样的一幕，柳如烟在修养舱中回想着白天看到的消息，她兼任荣耀的数据分析师，在收集各方信息的时候，自然是知道易凡在一模中表现的。\n\t与她想象中易凡想路边一条被妖兽踢死的场景不同，易凡竟然表现得十分...优秀。\n\t别人或许不清楚单杀桂仁鸟是什么水平，但她见多识广，知道对于气血境的武者，飞行类妖兽是一座大山，即使武者有对空手段，也未必能对其造成有效输出。\n\t至少她面对桂仁鸟的空中偷袭，不说会被咬死，但是极大可能会被淘汰，更遑论在空旷的平地上反杀它。\n\t不仅是她，荣耀中的其他几人也没好到哪里去：\n\t陈玄北自动格挡护体，即使被偷袭也能知道，死不了，但他也杀不了它。\n\t仇升东有草人保命也是死不了，但也没有能力反杀。\n\t叶知秋...与她一样80%可能被淘汰。\n\t慕容清，高能感应下能察觉到偷袭，弓箭又能对空，是荣耀中唯一能杀死桂仁鸟的。\n\t“易凡，你就不能直接被抓死吗？”\n\t“就算你以前是高中里面数一数二的剑术天才，就算你对战经验丰富，但以你的3点气血，再加上首次面对妖兽偷袭，不该能做的这么完美！”\n\t“是使用没石掷的那一瞬，录像中明显能看到桂仁鸟有煽动翅膀，但它却没有躲开，是你的F级天赋！”\n\t柳如烟心里莫名，五分烦躁，三分质疑，一分恨，一分悔。\n\t易凡没有告诉过她天赋能力，她在得知他觉醒F级天赋后，就没给他好脸色。\n\t再看到观众弹幕对他天赋的猜测后，柳如烟也觉得是一天只能使用一次的限制类天赋，这样就说得通了。\n\tF级天赋中确实存在很多使用条件苛刻的能力，一天只能使用一次，注定他走不远，都不说高考了，就是下一次二模，难度会升级很多，不会再像一模一样，有能让他想打就打，不想打就跑路的场景。\n\t更何况，在野外战斗，肯定不会一天只打一次！\n\t“对呀，不过是一个勉强能用的天赋罢了，限制条件这么高，从蚯蚓变成毛毛虫罢了。”\n\t“再加上你的差劲的资质，现在还能凭借你半步完美的非凡剑法做点名堂，显得与众不同。但等半个月后...不，只需一周之后，当S级、A级天赋者开始真正发力，气血快速增长，天赋能力深度开发，你和我...不，你和我们之间的差距，就会被迅速拉开，大到让你绝望！”\n\t柳如烟脑海中刚刚因为易凡表现出色而悄然升起的那一丝——想给他发条信息，哪怕是简单问候一句安危的微弱念头，此刻被她自己构建的逻辑和偏见彻底掐灭，消失得无影无踪。\n\t取而代之的，是一种混合着优越感和嘲弄的复杂心理，她发送了一段信息给易凡：\n\t“不差，杀妖数都快赶上我的零头了。”\n\t发送成功后，她仿佛完成了一场与过去切割的仪式，长长地舒了一口气，闭上了眼睛，任由修养舱的氤氲包裹全身，将外界的一切纷扰，连同那个名叫易凡的身影，暂时隔绝开来。"},{"title":"第17章 十大羁绊","order":17,"label":"17","text":"陆仁甲的高考成绩不太理想，只能在月桂市食品加工厂做个普通员工，负责流水线质检。\n上了一天班，刚上了地铁，幸运的是今天没有学生和他抢座位，他能挨在座椅上舒缓腰间疲劳。\n这几天他迷上了高考备考冲刺的各种节目，尤其是一模直播的切片视频。\n比如他正在看的《一模纪录片之三位火神》，这个是他关注的博主橙留量的视频，视频中，一股合成声音味的解说滔滔不绝地聊着，画面中正是林焱火烧妖兽的场景。\n【登场的第一位火神，我愿意称之为呼吸之野，同时也是一匹逆袭黑马，身负C级天赋，却能驱使一手诡异的绿色火焰，附着到妖兽身上，挥之不去，灭之不尽，直到把妖兽燃烧殆尽，就像绿色大自然呼吸一样，磨灭在其中折腾的所有元素！山川何如昔？风云与古同！】\n【在他遭遇妖兽的第一战，就是最惊险的换伤死斗，最后靠积累的火焰拖死了影豹，从此，愈战愈勇，熟练贯通级别的八极拳招招狠辣，更是在直播中毫无掩饰驱使火焰吞噬妖躯，显然是发育型天赋，有人根据其不停燃烧妖躯的行为，猜测与死灵鬼火类似，没错就是传说中可以吞食妖兽魂火壮大自身的S级天赋，不知为何林焱的天赋被评为C级，难道是有副作用？】\n【接下来这位火神之苏格拉没有底，带来的是让苏格拉底都没底的神秘火焰！来自荣耀战队的战士——叶知秋，他的天赋冥炎，拥有直指敌人灵魂的能力，增幅在其所使的破坏力惊人的焚寂剑法上，让妖兽防不胜防，是荣耀战队当之无愧的输出担当！面对绝对真实伤害的冥炎焚寂剑，一众种子选手，谁心里有底气能接下他的一招？】\n【火神叶知秋一模中最霸道的战绩，是在围殴8气血冰纹鳄和准成年期墨蛟的战斗中，一剑冥炎直击它们的妖核，让其重伤！也是被誉为A天赋直追S级的恐怖存在！】\n【最后一位火神，相信大家都十分熟悉，这两天头条都贴满了这个男人的名字，人称乾坤九阳——殷无忌！天赋乃是霸道绝伦的九阳体，集修炼、解毒、防御、治疗、进攻五位一体属性，同时悟性惊人，早早就把家传的《乾坤大挪移》练到同辈无敌的完美无瑕级别！这门武技是地级武学《小须弥劲》的前置玄级武技，意味着他踏上武道第二境时，能迅速掌握一门地级武学，领先他人数百步！很多人也把他当成三年前的周婵！认为其能镇压这一代】\n【在一模中创下多项记录，比如带领战队击杀妖兽100只、连续三天不停歇持续作战、一模硬接准成年期妖兽全力一击而不死等等，别人求之不得的成就，对他来说信手可得！】\n陆仁甲看得热血沸腾，他的天赋是火球术，与他们有着义父义母的兄弟关系，尽管他当年高考像路边一条被淘汰，但是他一直幻想自己可以横推兽巢，镇杀异族，为人族发光发热啊！\n这群后辈所作所为让他心情澎拜，感叹人族大兴！\n他手指翻飞，打开了月桂市中学论坛，迅速开了一个帖子——《为什么火属性天赋是人族未来》！\n【我做一个爆论：人类的未来将被火属性天赋的天骄引导，原因如下】\n【其一，火是人类文明的起源】\n【其二，四位天尊中的昊天，就是根正苗红的火属性天赋】\n【其三，历年来火属性天赋天骄越来越多，比如今年月桂市一模数万考生中就有三位火属性天赋的天骄占据前列】\n【林焱：废材逆袭流】\n【叶知秋：登峰造荣耀】\n【殷无忌：神魔无惧】\n【我认为，这三个学生，将在高考中占据前三行列，特别是殷无忌，必然是状元！】\n陆仁甲关上手机，疯狂输出他的个人观点，此刻多巴胺分泌已然超过峰值，躺在地铁椅子上，身心具爽。\n距离到家还有半个小时，眯一下眼缓解劳累，正好同时等待网友给予他认同。\n“叮咚！南静站到了，请准备下车的乘客依次从左侧车门下车...”\n陆仁甲听到关键词，条件反射站起来，然后大脑才恢复开机，“噢，到站了。”\n他一边走一边迫不及待地掏出手机翻看自己的帖子。\n“什么情况，99+消息，我的帖子爆了！第一次有这么多人回复我！”\n【林焱是二中的普通学生，默默无闻，从和妖兽五五开，到站在S级天赋学生的身侧共同作战，却只用了两天，我认为他的上限比殷无忌高！】\n【感觉不如...飞剑哥，他被女友分手，被战队踢出局，被学校降级，却仍然无怒无惧，开局一道飞剑精准搏杀桂仁鸟，两天后再遇桂仁鸟，更是直接无情秒杀，要论逆袭，飞剑哥当之无愧！】\n【只杀了三只妖兽的，也来碰瓷？】\n【哼！飞剑哥可是“单杀”“速度型”“飞行”妖兽，也是唯一一个打死飞行妖兽的学生，你能找到第二个达到这样战绩的人？】\n【抱抱我家叶知秋，不仅帅到惨绝人寰，打架担当荣耀战队主C，还在一模中邂逅校花级美女柳如烟，又被墨蛟水泡冲击到同一个岩洞中，那小眼神都拉丝了，凑个CP美美嗑】\n【有没有一种可能...飞剑哥来了全杀了，什么辣鸡叶知秋，不过是荣耀战队宫斗下捡漏的小人，荣耀战队可是飞剑哥创立的，校队名额都是飞剑哥拿的，几个队员忘恩负义把人踢出局摘取胜利果实！而且你不知道吧，柳如烟是个二手货，她前任就是飞剑哥，三中人尽皆知的，这女人上岸第一剑，先砍意中人！辣鸡叶知秋，只配捡我飞剑哥不要的东西，做一个替代品罢了】\n【什么替代品，你有没有学过《进化论》的？优胜劣汰，被赶走的人才是劣质的，懂吗？！我们家知秋是胜利者，拿的都是战利品！】\n【别人是战场上打赢了才叫战利品，哪像有些人，偷偷默默做了不为人知的交易，换取进入上岸校队的荣耀战队的机会，只会偷，还以为自己是凤凰涅槃？不过是一只飞上枝头的小鸡，幻想做凤凰！】\n【殷无忌真的很强！而且为人谦逊和蔼，你看我还在他们回来的时候找他合照了[照片]】\n【给我一个被墨蛟一口喷飞不知道几百米旋转九十周半最后嘴啃泥的预定冠军看笑了，你家殷无忌带一群战队围困墨蛟，直接炸团差点团灭，还能拿这种战斗当战绩的？我看纯纯是罪人吧！不如飞剑哥，独立探索发现，并独战和墨蛟同为准成年期妖兽的石妖，在防御无敌的石妖背后砍出了一道深深的伤口，最后无伤飘然离去，高下立判！】\n【哪来的串子，给这个所谓的飞剑哥招黑的吧，殷无忌是公认媲美周蝉的准状元，也是你能评价的？】\n【周蝉用的是《非凡剑法》，飞剑哥同样把《非凡剑法》练到完美无暇，飞剑哥才是真正的媲美周蝉，殷无忌是什么路边？也来碰瓷周蝉？！】\n这他么什么情况，怎么吵起来了，陆仁甲不明所以。\n他发现这个一直在夸所谓的飞剑哥的消息，都是同一个人发的，难道这就是传说中的nc粉？他不信还有人能比三位火神更牛的，铁定夸张描述了。"},{"title":"第18章 飞剑哥全网爆红","order":18,"label":"18","text":"陆仁甲打开短视频平台，搜索月桂市飞剑哥，刷刷刷一堆视频弹出。\n\t《飞剑，又见飞剑》\n\t《神秘飞剑男竟对两只鸟干了这事！》\n\t《三百六十度瞬ju，没关就是开？》\n\t《反作用力大师，从画里走出的男人》\n\t《教科书级作死，飞剑哥被石头殴打》\n\t《女友分手，战队宫斗，学校打压，飞剑哥用实力打脸他们》\n\t“播放量都最高竟然有几千万，这么牛吗？”\n\t他点开播放量最高的《飞剑，又见飞剑》，萧索的琴笛合奏中，一个青年背着长剑，跪拜在地，前方则是一块堆砌雪白果肉的石板案台，仿佛在祭奠某人，“黄天在上！”，青年身侧冒出两字：“易凡”。\n\t“这开头，很有武侠风味。所以这个就是飞剑哥，名叫易凡嘛？”陆仁甲逐渐沉浸其中。\n\t镜头一转，易凡坐在火堆前，手抓着烤肉，与火堆对面的人谈笑，仿佛至交好友，镜头特写拉过去，竟然是林焱！\n\t又一转，林焱被头顶龙眼的妖鸟追着跑，一道剑光划过天空的特效闪过，易凡手持长剑挡下桂仁鸟攻击。\n\t第三幕，易凡正在与细肢螂对战，势均力敌的情况下，忽然传来一声桂仁鸟厉鸣，它张着巨口迎面而来，眼看易凡要被偷袭，背后林焱一只脚踏出，三步作两步，冲向易凡，一鸟一人，一者为偷袭，一者为守护，两者画面互相交替，在一道黑色背景的血爪特效中，似乎预示了林焱为了挡住桂仁鸟而牺牲的惨烈悲剧。\n\t伴随撕心裂肺的怒吼，易凡扭矩身体，一道飞剑朝着逃跑的细肢螂而去，在它惊愕的复眼中，飞剑如同切豆腐一样划开它的脑袋。\n\t随着转身直指桂仁鸟，在它超声波攻击中，再次祭出飞剑，它躲不开！直中花心！\n\t画面最后，再次来到岩洞中，跪拜石板的易凡，抬起头，露出沧桑（长出胡须）的脸庞，走出岩洞，看着天空厉鸣的一群桂仁鸟，一道飞剑飞出，穿透它坚硬的果壳。\n\t落幕，琴瑟笛箫同奏，这次，还带了二胡和唢呐，愈加悲凉。\n\t右下角还冒出几个小字：剪辑自月桂市一模考生易凡、林焱的录像，如当事人有异议，马上下架作品。\n\t陆仁甲从震撼中脱离出来，“靠，原来是他么剪辑的，搞得我还真以为林焱寄了。”\n\t【只会飞剑，我原称之为飞剑哥】\n\t【侠味十足】\n\t【万恶之源】\n\t【前来祭奠】\n\t看着一道道弹幕和评论，陆仁甲知道为什么飞剑哥传播这么火了，全靠恶意剪辑呀！\n\t他接着点开第二个《三百六十度瞬ju，没关就是开？》视频，搞鬼搞怪的BGM轰炸起来，\n\t“背背背背背上了行囊~”\n\t画面全是易凡被偷袭，然后反手把妖兽砍死的片段，从一模开局在空中被桂仁鸟从背后偷袭，再到空地勾引，配上他使出没石掷飞剑斩首的反转，营造出一种这个人妥妥开了挂的既视感。\n\t【666，演都不演，从背后偷袭都能瞬间反杀，这飞剑跟他么锁头一样】\n\t【这不是挂我吃！】\n\t陆仁甲看着哈哈大笑，这些网友真是太好玩了，他又往下滑看了几个视频，全是搞笑流，\n\t什么跪拜流考生，聚焦易凡跪地的那一幕，\n\t还有山顶给石妖挠痒，作死流考生，\n\t最搞笑的还是他和林焱互相飙戏发癫，甚至又搞出了“兄弟，太性情了”的梗。\n\t陆仁甲从质疑，到释然，再到乐呵，最后也是对易凡这个飞剑哥产生了好感。\n\t怪不得传播这么快，这个人从飞剑哥这个“梗”开始，吸引广大群众关注，最后大家发现，原来除了神秘莫测的飞剑，易凡似乎更有搞笑天赋，随后，开挂梗、祭拜梗、作死梗、兄弟梗接踵而至。\n\t陆仁甲脑中冒出一个词，“现象级流量选手！”没错，易凡飞剑哥的身份，成为了流量密码。\n\t与此同时，月桂市中，经过同城新闻推流，千千万万个人都刷到了易凡相关的短视频，从飞剑到搞笑，再从搞笑刷到易凡的身份信息，导致最后关于他被甩、被踢出战队，被学校打压的事都家喻户晓了。\n\t要说现在谁最生气，谁又最慌张，那必然是三中领导。\n\t易凡被女友甩是真，被战队踢也是真，但从实验班降级至普通班这个操作完全是按照校规白字黑字在做，三中从立校开始，就写死了F级或气血低微的学生，不准进入实验班序列。\n\t最重要的原因不是歧视天赋低的学生，而是为了避免实验班可以获取资源被某些关系户夺取。\n\t这事儿，三中领导他们冤啊！\n\t教导主任与一众教师正加班开一模总结会议，突然就收到了舆情报警，易凡的走火有机率导致三中的风评下降从而影响入学率。\n\t“顾沁你怎么看这个事情，毕竟无论在3班还是10班，易凡都是你带的学生。”教导主任发问。\n\t“对于网络议论，我们应当不予置评！之前调班降级的处理完全合规，如果他后续达成优秀成绩，可通过校规中特殊优秀学生管理办法重新申请调入实验班。”\n\t顾沁一板一眼地回答，年纪轻轻就学会了职场的核心理念：\n\t有法执法，有规按规，无法无规，已读不回。\n\t事不关己，高高挂起，事若关己，合法合规。\n\t对于大众来说，撤销对易凡的调班降级处理和易凡通过申请重新进入实验班都是一样的，没有什么区别，实际目的达成就行。\n\t但是对于顾沁来说，这两者天差地别，前者是程序执行错误，后者则挑不出毛病。\n\t“我正要向上面提这个事情，我看易凡一模发挥出色，以F级天赋和3气血的基础配置，单杀三只妖兽，凭的是他即将达到完美无暇的《非凡剑法》，可以帮助我们三中树立一个对标一中殷无忌武学天赋和二中林焱逆袭的形象，殷无忌明确把武学练到完美级，对易凡可归类为武学特殊型天才！”\n\t“小顾你考虑得很周到，但是...历年来，不止三中没有出现过F级天赋入实验班的情况，整个月桂市中学都没有这样的案例，我们不知道王校长那边怎么想的。”\n\t“这样吧，我后面有时间请示一下王校长，我可以先做主给易凡颁发《进步奖》，其他的等王校长决定。”\n\t“好。”\n\t顾沁似乎对这种拖沓推诿习以为常，淡然称是。\n\t似乎谁都不想冒头反对规则，对他、对她、对在场众人都是如此。"},{"title":"第19章 保底日，怒涛之啸","order":19,"label":"19","text":"一夜氤氲到天明...\n\t易凡醒来的一瞬间，鲤鱼打挺，跳出太空舱。\n\t“嗯~ o(*￣▽￣*)o舒服！”\n\t要不是身体中澎拜的力量，易凡差点以为他还没穿越。\n\t今天是个重要日子，是他拿到的第三个普通技能，也是轮回绝境可以融合的最后一个普通技能。\n\t“窃法巧手！发动！”\n    [技能]\n\t被动：对生命值低于30%的敌方英雄进行的攻击会造成3%已损失生命值的魔法伤害。\n\t主动：扔出一个设备，在3秒的延迟后，放出一个时空球体来使其中的敌人减速40%。如果使用者进入球体，那么可以将其引爆，造成2.25秒的眩晕并获得100护盾值。\n\t易凡拍了一下脑袋，“艾克的W！”\n\t艾克可是他前世最喜欢玩的英雄之一，他的技能名字都能倒背如流了！\n\tZ型驱动共振（被动）、时间卷曲器（Q）、时光交错（W）、相位俯冲（E）、时空断裂（R）！\n\t时间刺客，顾名思义，技能名称和时间都有一些相关。\n\t他的W是在地图上选择一个圆形区域，几秒钟后激活，有强力了减速，如果艾克（或者他的大招影子）经过区域，就可以眩晕里面的人并且获得一个比命还长的白盾。\n\t而且W是有一个被动的，对残血敌人造成额外伤害，不仅打人疼，刷野也嘎嘎快。\n\t可以说艾克的W无论是对线、抓人、刷野、保命，都有不错的效果，属于非常全面的技能。\n\t唯一的槽点就是要延迟3秒才能触发，变相让你提前3秒预判落点位置，算是一个小硬伤。\n\t易凡往卡牌中精准填入[时光交错]。\n\t叮！\n\t√\n\t“获得技能时光交错，技能融合中~”\n\t[法术星云1——轮回绝境]\n\t被动1：获得40%护甲穿透\n\t被动2：对生命力低于30%的敌人进行的攻击会造成3%已损失生命值的附魔伤害（附魔伤害百分比基于精神力强度而增加，目前3%，最大值10%）\n\t主动：你将自身和一个敌人放逐至死者领域7秒，并在期间内偷取该英雄10%的核心属性。\n\t进入死者领域时，你会恢复少量气血，敌人会被眩晕小段时间，取决于双方的精神力差值，最多眩晕1秒。\n\t进入死者领域后的3秒后，眩晕敌人2秒，同时你获得护盾（护盾基于精神力强度）。\n\t如果你在死者领域中杀死了该敌人，那么你会吞噬目标的灵魂，保留你所偷取的属性，死者领域中的战斗不会在现实留下痕迹。\n\t（核心属性包含：气血、速度、防御力、精神力）\n    “什么？！直接晕两秒！！！”\n    易凡激动得翻了两个跟头，他还以为只是在轮回绝境中随机选一个区域框住而已，不曾想是直接对进入的对手指向性眩晕！\n\t他转念想到之前的无情铁手，连主动效果都被吞了，这次居然把时光交错给升级了。\n\t“难道融合的技能们会根据技能形态进行动态修复？形态融合度差的就直接没了，形态融合度好的直接进行优化升级？”\n\t易凡思考着。\n\t卡牌的黄牌晕1秒，对手醒了之后可以动2秒，然后艾克的W又晕2秒，在轮回绝境7秒内，差不多眩晕对手一半的时间，虽然是分段的，不能让他连续无暇输出3秒。\n\t但分段也有分段的好处，反过来说就算可以打断对手的节奏。\n\t想想看对方刚恢复动作，正准备施展一番手段，刚起手时，又被晕了，四舍五入相当于晕5秒！\n\t“无敌！”\n\t“我可在轮回绝境中称同境无敌！”\n\t“什么S级天赋的尖子生，什么豪门战队的核心，只要被我拉进这小黑屋，统统干翻！”\n\t“当然，”他很快冷静下来，理性分析：\n\t“前提是对手一开始并不清楚轮回绝境的具体效果，无法提前准备针对性的防御手段或逃脱方法。或者，对方没有那种能够被动净化眩晕、抵抗控制的天赋能力。否则，想秒杀同级别的顶尖天才，依旧存在变数。”毕竟，天下英雄如过江之鲫，各种诡异强大的天赋层出不穷，绝不能小觑。\n\t“不过在和人对战时，倒是没必要使用轮回绝境。”\n\t“一是杀了对手才能永久保留偷取的属性，高考没办法杀人...吧？”\n\t“二是如果没干掉拉进去的人，就把自己这个底牌暴露了，但如果对手的妖兽就没有这个忧虑，自己就算没干掉妖兽，它也没法告诉其他人的我底细。”\n\t“桀桀桀，得早点进训练营，我已经迫不及待干妖兽了！”\n    易凡开了一包自热火锅，倒水让它煮了起来。\n    由于城里不允许动植物存在，制定了许多法规，比如城内不允许出现生肉、生蔬，人们只能吃这种从食品加工厂中完全制作好的食物，和前世的预制菜类似，被称为“套餐”。\n\t等待的时候，易凡想着怎么回顾自己身上偷来的属性。\n\t脑海中，象征这轮回绝境的黝黑法术星云悠悠自转，仿若知道他之所想一样，显现出一段字样：\n\t[已获得的核心属性]：\n\t气血：1.4（桂仁鸟0.6、细肢螂0.7、桂仁鸟0.2）\n\t速度：19%（桂仁鸟6%、细肢螂5%、桂仁鸟8%）\n\t防御力：3%（桂仁鸟1%、细肢螂1%、桂仁鸟1%）\n\t精神力：？？？（未知公式）\n\t“不错，只偷取了3次就涨了这么多属性，全是速度型妖兽，所以不仅是气血增长，我现在的速度增幅也很高，反而防御加的少。”\n\t“这个精神力未知公式是什么意思？难道没有到第二境看不出来的具体数值么？毕竟精神力是第二境武者才会关注的属性。”\n\t“不过我确实感觉到自己精神力有所增长。”\n\t“而且为什么防御力和速度是百分比显示的，气血是数值显示？”\n\t他立刻拿起手机，连接上武道知识库进行搜索。翻阅了不少资料后，终于在一篇关于《天赋能力效果量化与属性表征研究》的学术论文中找到了相对权威的解释：\n\t论文指出，气血、精神力、以及更高境界的真气等，本质上是武者体内储存和运转的“能量”，是相对稳定且可以量化积累的“存量”，因此在人族的通用度量机制中，它们通常以具体的数值来表现。\n\t而速度、防御力、攻击强度等，则更偏向于一种“动态表现”或“效能”。它们是在武者做出特定动作（如奔跑、格挡、挥拳）时，体内能量通过肌肉、骨骼、经脉以及特定功法武技释放后，最终达成的“效果”。其根本来源是能量水平（气血等）和能量释放的效率与方法（武学境界、发力技巧等）。因此，它们通常不用绝对数值表征，而是更关注“增幅”或“加成”的比例。\n\t并且，在武者觉醒的千奇百怪的天赋能力中，对于速度、攻击、防御这类属性的直接增强，其描述也几乎都是以百分比加持的形式出现。\n\t例如有一个强大天赋[闪电之舞]，其核心效果之一就是：永久增加使用者50%的移动速度和攻击速度。\n\t“原来如此！”易凡恍然大悟，所以其实他增加的19%速度是额外乘区。\n\t他本质的速度基础，来源于他如今5.4的气血水平，以及达到融会贯通境界的《非凡剑法》所能发挥出的身法和出手速度。这19%的加成，是在这个基础上再进行乘法计算，带来的实际提升远比单纯的数字看起来要恐怖！\n\t看着这个属性面板，易凡心中泛起一丝古怪。\n    他拿到轮回绝境时，还以为自己会走上一条依靠偷取属性、堆砌气血、一力降十会的刚猛路子，毕竟他当前最强的就是重剑了。\n    没想到一模中干掉的三只妖兽都是速度型，现在他在速度方面比其他属性强了许多。\n    可他拿的是个重剑呀！速度涨这么快，难道阴差阳错，要让他提前触及到[举重若轻]的重剑境界？\n    举轻若重，让他拿着寻常长剑也可以发挥出像重剑一样的威力，但是招式需要积蓄力量，只能一招一式慢慢来，气血消耗较少，善于长时间作战，更善于在多种环境中作战，虽然他在一模没有体现出这一特点，但那是由于他越级对战，身体机能跟不上，而不是他没有气力了。\n    举重若轻，能让人拿着重剑，也可以像普通轻剑一样挥洒自如，速度很快，输出也很高，而且消耗属于中等，不高不低。\n\t或许有天生神力的人，可以把重剑挥舞得很快，达到看起来和举重若轻一样的效果，但只是表象。\n\t易凡的父亲易建连说过：\n\t真正的举重若轻是一种剑法境界，达到这一境界的武者，即使力量小，也可以拿起重剑乱砍，原因在于他们会“回收”和“传导”力量。\n\t上一击挥出的力道，以及兵器碰撞产生的反震之力，都能被他们巧妙地引导、储存，并毫浪费地运用到下一击之中，形成连绵不绝、越来越强的攻势浪潮。\n\t因此，与达到[举重若轻]境界的重剑武者正面对抗，往往会感到压力层层叠加，难以招架，最好的应对策略往往是凭借更胜一筹的速度进行游斗和闪避。\n\t虽然易凡的速度快了，但是他并没有达到举重若轻的境界，只是让他腾挪、出剑速度快了。\n\t不过，他回想起在一模中，两次于绝境下利用飞剑的反作用力巧妙改变自身位置，化解致命危机的经历...那种对力量细微的感知和精妙的引导，似乎隐隐触摸到了[举重若轻]的一丝门槛。\n\t易凡看着手中那包已经开始沸腾、散发出诱人香气的自热火锅，眼中闪烁着思索的光芒。"},{"title":"第20章 前夜，未读消息","order":20,"label":"20","text":"易凡一边享受火锅，刷着手机，被溢满屏幕的各种消息轰炸。\n\t“柳如烟给我发这个消息？快赶上你的零头？以前我只有3点气血的时候，实战对练就能和你打得有来有回，不相上下。现在我气血都5.2了，还偷了这么多速度属性，哼哼...”\n\t他眼中闪过一丝幽幽的光芒，“你最好祈祷在接下来的考核或者联赛里，别让我在哪个小角落单独遇到你！”\n\t“而且柳如烟你这种妩媚骚鸡类型的，根本不是我的菜呀，只怪我记忆苏醒太晚，浪费萧楚男身份。”\n\t想起他手机中还有柳如烟的一张张紫色“战服”图片，他内心毫无波澜。\n\t易凡给她回个：“？煞笔”，以示“尊敬”。\n\t继续往下翻，看到了慕容清发来的那几条措辞严谨、看似为他着想的信息。\n\t“慕容清...队长，把我踢出战队，现在又要给我介绍新战队？”\n\t慕容清那种清冷高贵、实力强大、自带御姐气场的类型，还挺有意思的，有点戳他的审美（xp），以前还没觉得，现在被踢了之后，她让易凡很有征服欲，回了一个意味难明的无语句号“。。”。\n\t经过荣耀战队这次堪称背刺的经历，易凡内心深处对加入任何战队都产生了强烈的抵触情绪。\n\t连他曾经一手发展起来的荣耀都能反噬，更何况那些素不相识、利益交织的战队？\n\t其中的雷点实在太多了！资源分配、指挥权、战术地位、人际关系...每一样都可能成为未来矛盾的导火索。\n\t“我现在，只想独自升级，难道武者就一定非要加入战队，依靠团队才能发展壮大吗？” 一个强烈的念头在他心中生根发芽。\n\t他忍不住再次复盘当初被踢出荣耀的细节：\n\t对于他被踢的事情，荣耀5人中，仇升东不明态度，他向来沉默寡言。\n\t陈玄北肯定是投赞成票的，或者是由他牵头的，他和慕容清本就青梅竹马，他对她的想法所有人都心知肚明。几年中，易凡在荣耀投入太多心血，无形中和身为队长的慕容清走的近了很多，或许因为这个，陈玄北经常和易凡起争执，所以他一定是“坏人”身份。\n\t柳如烟，在和易凡交往过程中，不止一次表示她自己想成高强武者的态度，似乎背负着什么东西，要知道柳家也是名门望族，无非是“重男轻女的爸，区别对待的妈”这类的剧情？觉醒F级天赋后被她甩
